[task]
name = "swarmbench/d6530756070046849c0ed5feae2d4204-SWARMBENCH-HIERARCHICAL-PLANNING-OPERATIONS-PRODUCT-SAFETY-HAZARD-PATTERN-REPORTABILITY-REVIEW"
description = "From 204 real CPSC incident reports, read each consumer account for a failure-mode family and harm level, read the firm's comment for its posture and evidence grade, and flag coded severities that contradict the account. Consolidate reports into hazard patterns keyed on brand family and failure mode, derive each pattern's trigger date, filing deadline and exposure from three rolling-window rules, and seat a board docket smaller than the triggered inventory."

[metadata]
verifier_type = "executable"
domain = "planning-operations"
coordination_pattern = "hierarchical"
secondary_classification = ["long_writing", "long_horizon"]
dag_depth = 7
dag_width = 11
human_solving_hours_estimate = 41.0
human_solving_hours_justification = "Read 204 real CPSC consumer accounts (185,806 characters in total, median 752 and longest 2,858) and for each judge the failure-mode family out of the consumer's own prose against a nine-family taxonomy with a published precedence order, judge the substantiated harm level on a four-point scale, and compare that reading against the coded victim-severity field to decide whether the two disagree, which they do on 60 of the reports: 204 x 4.5 min = 918 min. Read the 76 filed company responses (69,732 characters) alongside the account each answers and settle the firm's posture against a six-class taxonomy, the slowest judgement per record because most responses are house boilerplate reused verbatim across unrelated reports and many recite standards compliance in one sentence and commit to a remedy in the next: 76 x 4 min = 304 min. Resolve 50 distinct reported brand strings onto 26 brand families through the published register and consolidate the corpus into 65 hazard patterns keyed on brand family and failure mode, 18 of which draw their members from more than one product category and so have to be merged across the boundary the reading was divided on = 130 min. Run the trigger arithmetic on all 65 patterns - three rules, two of them rolling-window tests over the pattern's countable incidents only, taking the earliest satisfied date and deriving the filing deadline and exposure = 65 x 4 min = 260 min. Rank the 26 triggered patterns by exposure and seat a review-board docket holding only 20 slots, then assign every pattern its disposition = 60 min. Write the structured register with a grounded audit note per report = 204 x 1.5 min = 306 min. Write the eleven-section review carrying a determination for each of the 65 patterns = 360 min. Reconcile the register, the docket and the memo against each other and against the method = 120 min. Total 918 + 304 + 130 + 260 + 60 + 306 + 360 + 120 = 2,458 min = 41.0 hours."
estimated_sub_agents = 28
input_token_estimate = 82000
reference_link = "https://www.saferproducts.gov/PublicSearch"
why_multi_agent = "The deliverable is a reportability review whose hard part is breadth of careful two-document reading feeding one arithmetic chain, not the arithmetic itself. Four load-bearing facts per report are absent from the coded data. The failure-mode family lives only in the consumer's free-text account: the coded product_type says what the product is and never how it failed, so a dishwasher filed under Appliances may describe an arcing control board, a stroller filed under Strollers may describe a seam that gave way under a child, and the family has to be reasoned out of the prose against a nine-way taxonomy with a published precedence order. The substantiated harm level likewise has to be read, and the coded victim-severity field disagrees with the account on 60 of the 204 reports, in both directions, so a run that trusts it inherits those errors wholesale. The firm's posture has to be read out of the response it actually filed, where most text is house boilerplate reused verbatim across unrelated reports and the distinction that matters - did the firm commit to a remedy or a recall, dispute the report, or merely recite that the product meets applicable standards - often turns on one clause buried in a paragraph of assurance language. Those three reads combine into the evidence grade, and the grade decides whether an incident is countable at all, which is the single quantity every downstream number depends on. Because the corpus yields 65 hazard patterns from 204 reports and the three trigger rules are rolling-window tests over each pattern's countable members only, a single misread harm level or posture moves a trigger date, and a moved trigger date moves the filing deadline, the exposure days, the pattern's rank in the exposure ordering, and therefore which patterns are seated on a board docket that holds 20 slots against a triggered inventory of 26. That cascade is what makes the task unforgiving of skimming rather than merely long. A single context has to hold 185,806 characters of consumer narrative plus 69,732 characters of company responses, keep 204 four-way determinations straight, group them into patterns, run rolling-window arithmetic per pattern, and then author 204 grounded audit notes and an eleven-section review carrying a determination for each of 65 patterns; the predictable degradation is that the per-record reading is abandoned rather than degraded - ambiguous accounts collapse into the largest family and into the no-harm level, which makes almost everything Insufficient, suppresses the countable population, and quietly deletes most of the trigger workload - while the per-record written work turns into per-family boilerplate. The verifier is built to see exactly that: the harm check is scored at each end of the scale separately so an H0-everywhere default is capped at half credit, the failure-mode and posture checks are class-balanced so collapsing into the largest family loses the macro term, and the rationale check strips any run of five words shared with the report's own narrative before testing whether what remains is authored rather than templated. The hierarchical design attacks each of these. Three category desk leads own the corpus by product category and each dispatches its own account readers - six for the 109-report Kitchen slice, three for the 48-report home-systems slice and two for the remaining 47 - so no reader handles more than about two dozen accounts and none is skimming under context pressure, and each reader authors the audit note for its own reports while that account is still in front of it, which is what keeps the notes from being reconstructed in bulk at the end. A separate concordance wave then owns the second half of the evidence: two analysts take only the 76 reports carrying a filed response and re-read the account and the response together, so the posture judgement is made by a step that is not simultaneously classifying failure modes. A pattern consolidation board then owns the one judgement no desk could make from its own slice - 18 of the 65 patterns draw members from more than one product category, and 11 of those are merge-critical: they cross a reportability trigger ONLY once the halves are combined, and 8 of the 11 hold a seat on the docket. A desk that only ever sees its own category proposes half a pattern, and that half accumulates its countable incidents more slowly and never triggers at all. A reportability desk runs the trigger arithmetic and the docket seating once, on a consolidated pattern set, rather than as a side task of whoever happened to finish reading last. An assurance reviewer then re-checks a defined slice - every triggered pattern, every Corroborated or Contested incident, every severity-conflict flag and everything still sitting in the residual family - against the method and the reports' own text, and files corrections before anything is written. The reducer's remaining job is to apply those corrections and assemble three artifacts that agree, so the machine-parsed contract is written by a step that is not also reading 204 accounts. The result is a genuine seven-stage hierarchy - orchestrator to three desk leads to eleven account readers, then concordance, consolidation, reportability, assurance and reduction - for 28 agent sessions in the recorded multi-agent run. The recorded runs bear this out. The single agent scored 0.7327, the planned swarm 0.9539 and the no-plan control 0.8773, a margin of 0.2212 for the plan over one context. The bucket totals locate it: all three modes hold 1.0 on the structural bucket, so nothing separates them on file shape, while the partial-oracle bucket runs 0.5679 for the single agent against 0.9140 for the swarm. The consolidation prediction is the clearest of the three. The single agent declared 114 patterns against the 65 the corpus yields, shattering the register along exactly the category boundary its reading was divided on: mean member Jaccard 0.4747, only 54 of the 65 patterns present under their own key, and 10 of the 20 patterns that should be heard this cycle reaching the docket. The swarm's consolidation board left 75 patterns at 0.8959 Jaccard with 19 of the 20 seatings right. The concordance prediction holds too: posture support 0.5664 for one context against 0.8401 for the wave that re-read only the 76 reports carrying a response, and the downstream arithmetic follows it, with trigger and exposure at 0.5128 against 0.8436 and disposition and docket at 0.5356 against 0.9135. The per-record reading degraded the way the class-balanced checks were built to catch -- 9 of 35 unambiguous failure cues placed correctly against 32 for the swarm, and the two ends of the harm scale at 0.5227 against 0.9808 -- and the per-record writing collapsed into boilerplate, with 31 of 204 audit notes surviving the template test against 187, 62 of 114 basis notes carrying their own pattern's figures against 72 of 75, and only 55 of its 114 patterns given a determination in the memo at all. The no-plan control isolates the plan itself: the same swarm reading the same accounts in parallel, but with no consolidation stage to merge across desks, lands at 0.6889 Jaccard and seats 10 of the 20 patterns -- better than one context on the reading checks, no better on the seating that consolidation decides."

