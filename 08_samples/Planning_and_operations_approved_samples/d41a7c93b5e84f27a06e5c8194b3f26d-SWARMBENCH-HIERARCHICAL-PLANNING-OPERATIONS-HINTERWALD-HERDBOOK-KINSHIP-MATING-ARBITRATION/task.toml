[task]
name = "swarmbench/d41a7c93b5e84f27a06e5c8194b3f26d-SWARMBENCH-HIERARCHICAL-PLANNING-OPERATIONS-HINTERWALD-HERDBOOK-KINSHIP-MATING-ARBITRATION"
description = "Rebuild the conservation standing of 100 living Hinterwaelder cattle from a real 1,438-record herdbook extract, then arbitrate a mating and inter-holding movement round against veterinary restrictions written as free clinical prose, breeding-place capacity and livestock movement rules that contradict each other. Deliver six reconciled artifacts."

[metadata]
verifier_type = "executable"
domain = "planning-operations"
coordination_pattern = "hierarchical"
secondary_classification = ["long_horizon", "long_writing"]
dag_depth = 11
dag_width = 37
human_solving_hours_estimate = 74.0
human_solving_hours_justification = "Read the herdbook extract, holdings register, herd health correspondence, weighings, previous seasons, movement bands and charter = 9h. Recompute the tabular kinship matrix, inbreeding coefficients and founder shares over 1,438 pedigree records and 100 living animals, including the unknown-founder and registration-defect conventions = 18h. Read 362 free-written clinical statements across 18 files and reconcile each animal's standing restriction by restriction against recency, end dates and the round-date cutoff at 3 minutes a statement = 18h. Assess 100 animals for breeding eligibility against age, standing restrictions, calving history and mating exclusions = 6h. Build a feasible 14-allocation round under the kinship ceiling, the sire-contribution limit and place capacity, and derive the movements it implies across 18 holdings = 12h. Arbitrate the conflicts the three boards raise against each other = 5h. Produce six machine-readable and reader-facing deliverables = 4h. Cross-artifact and provenance review = 2h. Total = 9 + 18 + 18 + 6 + 12 + 5 + 4 + 2 = 74h."
estimated_sub_agents = 37
input_token_estimate = 74000
why_multi_agent = "Three evidence domains disagree by construction and none of them can be settled locally. Relatedness is the one part that does not divide, and the plan treats it that way: mean kinship for an animal moves when a blank parent four generations back is treated as its own founder, so a segment of the pedigree yields no finished figure for anybody in it, and the genetics board owns that pass outright rather than splitting it. It is also the cheap part, one bounded computation over 1,438 records. What does not fit one working set is everything around it. The veterinary corpus is 362 statements of ordinary clinical prose across 18 files, written in whatever words the vet used on the day, where restrictions are placed, lifted, re-placed, given end dates that have since passed, and recorded at visits that fall after the round opens; each restriction on each animal has to be reconciled separately and there is no grammar to key on. Movement rules bind the consignment rather than the animal: certificate class, transport category, receiving isolation and remaining capacity depend on which bull the genetics board wants, which holding the cow already stands at, and whether the veterinary board will let that bull travel. A mating that is optimal on kinship is frequently one the vets have blocked or that no holding can host, and the answer is neither board's answer but an arbitrated third one that must still be defended against the alternative it displaced. A single context spends its budget on the computable half, then reads the correspondence once and quickly: it keeps the restriction the last note mentions rather than the one that survives the charter's rules, loses the lapsed-and-superseded distinction once the corpus exceeds its working set, and writes the per-animal half of the papers as a repeated frame because nothing is left to write it from. Separate genetics, veterinary and movement boards give each domain a complete pass over its own corpus, with the correspondence split by holding block so each block is read and then adjudicated animal by animal by the reader that holds it; an arbitration tier then reconciles the three constraint sets, and only then do the drafters run, each with one artifact to write and the handoffs to write it from. The allocation is the judgment-bearing half: the constraints admit many feasible rounds and nothing ranks genetic gain against welfare risk, transport burden and the load a single sire may carry, so the choice and its per-allocation defence must be argued rather than computed."
reference_link = [
  "https://cran.r-project.org/package=optiSel",
  "https://cran.r-project.org/src/contrib/Archive/optiSel/optiSel_2.0.9.tar.gz",
  "https://www.g-e-h.de/",
  "https://www.fao.org/dad-is/en/",
  "https://eur-lex.europa.eu/eli/reg/2005/1/oj",
  "https://food.ec.europa.eu/animals/traces_en"
]
data_provenance = "Declared up front rather than left to be discovered in the package, and stated at the precision each source supports. The pedigree is real and carries the analytical weight of the task: environment/input_artifacts/herdbook_pedigree.csv is a connected 1,438-record subset of the Hinterwaelder cattle pedigree distributed as PedigWithErrors in the optiSel package on CRAN. Hinterwaelder is a real endangered German breed under active conservation management, listed by the Gesellschaft zur Erhaltung alter und gefaehrdeter Haustierrassen and in FAO DAD-IS; the pedigree structure is the real herdbook genealogy, the sire and dam links, sexes and birth years are the herdbook's own, and the animal identifiers are real ear-tag numbers. Every kinship, inbreeding, founder-share and ranking figure the round turns on is computed from that real genealogy. The package documentation is explicit that the dataset 'gives the pedigree of Hinterwald cattle with some artificially introduced errors and simulated breeding values', so the data-quality defects the agent has to reconcile (blank parents, a parent naming no record of its own, an animal recorded in one sex but used in the other parent role) were seeded by the package authors to exercise pedigree-checking tools rather than attested from the German herdbook; they were not introduced by this trainer and the task's own files do not claim otherwise, and the simulated breeding_value column carries no constraint in the charter. The movement layer follows real regulation: movement_rules.csv reproduces the EU documentary regime for cattle consignments, a national movement document for a domestic move and an intra-union health certificate raised in TRACES where a consignment crosses a border, and its transport categories follow the weight-banded space-allowance scheme of Regulation (EC) No 1/2005; the receiving-isolation day counts are the programme's own planning bands rather than a figure lifted from the regulation. The geography is real: the member holdings sit in the southern Black Forest districts where the breed is actually kept - Breisgau, Kinzigtal, Elztal, Dreisamtal, Glottertal, Muenstertal, Markgraeflerland, Hotzenwald, Kaiserstuhl, Wiesental - with one member across the Swiss border in Basel-Land, which is why a cross-border consignment arises at all and which matches the breed's real distribution. The herd's own operational record for this round - the holdings' names and their place and box counts, the veterinary correspondence, the weighings and the previous-season matings - is a reconstruction of one round's paperwork rather than the file of an identifiable farm or veterinary practice: no public source publishes a named commercial herd's clinical correspondence, and a conservation programme's free capacity on a given date is not a published figure. It is written to the form that record takes in practice, which is why the correspondence has no fixed grammar and contradicts itself across visits. The same account is given in environment/input_artifacts/source_manifest.json, which the agent reads, so the agent is never misled about what it is working with."
scoring_design = "Fully deterministic executable evaluation with static, reward-hacking and partial-oracle buckets. Each bucket is the unweighted mean of its manifest-declared checks and the final reward is (static + 2*reward_hacking + 3*partial_oracle)/6, exposed with all four fields in /logs/verifier/reward.json. The verifier independently recomputes the tabular kinship matrix, inbreeding coefficients, founder shares, mean kinship ranks, pair kinship and expected progeny inbreeding from the packaged herdbook, and independently recomputes breeding status, allocation feasibility, the sire-contribution limit, place capacity, the movements the round obliges, certificate class, transport category, receiving isolation and remaining capacity. The one value that cannot be recomputed from the shipped files is each animal's standing on the round date, because the herd health correspondence is free clinical prose with no fixed grammar; it is frozen in tests/health_standing.json alongside the sentence evidencing each restriction, and that file is never copied into the agent image. Content checks are graded against these recomputed facts rather than against other fields the agent wrote: the dashboard's embedded data and the plan's control totals are compared with the independently recomputed round, not with the submission's own rows. Many rounds earn full credit: feasibility, local optimality, grounded per-allocation facts and a displaced alternative that was itself a workable option are checked, not agreement with a selected round. Anti-padding checks reject invented or duplicated identifiers, quotations lifted from a lapsed, superseded or later-dated statement, movements the round does not create, an HTML table dressed up as a visualisation beside an empty SVG stub, hidden or zero-size marks, and prose padded by repetition. There are no LLM calls, answer-key comparisons for the round itself, caps, floors, score gates, bonuses, or mode-specific branches."

