[task]
name = "swarmbench/3ad62514f308448ba70d918c03a68937-SWARMBENCH-HIERARCHICAL-PLANNING-OPERATIONS-CORSIA-FIRST-PHASE-UNIT-ELIGIBILITY-CANCELLATION-PLAN"
description = "Clear 221 blocks of real registry carbon credit for cancellation against an airline group's 2024-2026 CORSIA offsetting requirement, judging each against the ICAO Council's own eligibility document rather than the label its issuing programme attached to it. Deliver the clearance register, the referral file for blocks where programme and Council disagree, the cancellation schedule, the eligibility map and the note to the audit committee."

[metadata]
verifier_type = "executable"
domain = "planning-operations"
coordination_pattern = "hierarchical"
secondary_classification = ["long_horizon", "long_writing"]
dag_depth = 3
dag_width = 64
human_solving_hours_estimate = 62.0
human_solving_hours_justification = "Read the Council's CORSIA Eligible Emissions Units document end to end and reduce the 2024-2026 section to the rule set that governs a cancellation, programme by programme, keeping the wording of every exclusion = 7h. Read the eligibility criteria and the advisory body's summary table to fix which approvals apply to which compliance period = 3h. Answer the five eligibility questions for each of the 221 blocks against the registry record and the activity dossier behind it, at about 6 minutes a block once the rule set is in hand = 22h. Pull the governing sentence for every block from the Council document and check each one word for word against the file it is attributed to rather than against memory = 8h. Work the blocks where the programme's label and the Council's scope disagree, set out both positions in their own words and recommend = 6h. Build the cancellation schedule to the required tonnage in the stated order, including the split on the final block = 3h. Draw the eligibility map and write the committee note = 9h. Cross-artifact reconciliation and provenance check = 4h. Total = 7 + 3 + 22 + 8 + 6 + 3 + 9 + 4 = 62h."
estimated_sub_agents = 64
input_token_estimate = 62000
why_multi_agent = "Eligibility here is five questions, not one, and they are answered from different places. Whether a programme is approved for this compliance period, whether the activity's first crediting period and the vintage sit inside the eligible unit dates, whether the programme's own scope of eligibility admits the activity, whether the host country authorised the unit and accounted for the corresponding adjustment, and whether the tonnage is still unretired, are settled respectively by a section of the Council document, two sentences elsewhere in it, a per-programme exclusion list that differs sharply between programmes, a condition worded one way for some programmes and the opposite way for others, and the registry record. Four of those five are written per programme rather than once: the Council gives each approved programme its own eligibility timeframe, its own eligible unit dates line, its own scope of eligibility and its own separately worded host country condition, and the exclusion list that governs a Gold Standard block says nothing at all about a Verified Carbon Standard one. The deliverables are wide rather than deep. Five files have to agree with each other on 221 block ids, five test columns each, a verdict each and a tonnage each, and the register alone is 221 rows of thirteen columns carrying a quotation per row. That width, not the difficulty of any single judgement, is what breaks a single context, and the recorded single-agent run shows exactly how. It did not fail to understand the rules: its committee note reports 54 cleared, 10 referred and 157 refused against the 61, 10 and 150 the grader recomputes, so most of the reasoning happened. What it lost was the output contract. Holding the rule set, 221 blocks across five questions and five mutually-agreeing artifacts in one context, it filed /logs/agent/clearance_register.csv under its own working columns, block_id, project_id, registry, vintage_year, quantity_available, country, activity_type, methodology and scope_field, with the five test columns, the verdict, the governing quotation and its source id absent altogether, and with only the 54 rows it had cleared rather than the 221 the pool contains. It then filed a 1,267 word committee note under headings of its own invention, none of the six the brief names, below the length floor the brief sets. Its analysis survived in prose and its filing did not, and it scored 0.213 against the multi-agent run's 0.570 almost entirely on that. This is the single-context failure this task is built to expose: the declared schema is the last thing a crowded context holds and the first thing it drops, and no amount of additional reasoning time repairs it, because the agent does not know it has dropped it. Splitting the pool the way the document splits its rules is what fixes that. The Council writes the rules under six programme headings, so there is a desk per programme and it owns every block that programme issued: it reads its own programme's entry once, and the clause list a Gold Standard desk works from is never loaded into the context deciding an Isometric block. Under a desk the split is by question. Each programme desk puts one leaf worker on one eligibility test - approval, dates, scope, labelling, authorisation, availability - so a worker holds one column of one programme's rows and nothing else, and the desk is where those six columns are put back together. Above the programme desks a council rules desk reads the pool-wide rule set once and hands the same reading to all six, so no two desks work from a different one; an evidence desk holds every quotation to the section of the pinned document that governs this compliance period; and the assembly, panel and issue desks own nothing but the output contract, so writing the declared columns for every block in the pool is somebody's whole job rather than the last thing attempted by a context that has already spent itself. The 64 nodes of decomposition.yaml are that plan, in the three dispatch tiers the runner allows: the orchestrator dispatches eleven desk managers, each manager dispatches its own leaf workers, and the leaf workers execute and cannot dispatch further. The corpus supplies the substance to get wrong underneath that: 49 of the 221 blocks are labelled for the pilot compliance period, which is not this one, and a further ten are labelled for this period while the record shows nothing of the authorisation the Council's scope requires. Two of the exclusions that bear on this pool turn on what the activity actually is rather than on any field of the record, so whether an activity is grid electricity generation at all and what capacity the registry states for it have to be read out of the registry's own prose description and matched against a clause the Council words differently from programme to programme. The referral is where the work concentrates rather than where it becomes a matter of taste: nothing in the sources ranks a programme's label against the Council's scope, so a run has to identify which blocks are caught between the two, set out what each side of the record says in that side's own words, and say what would settle each one. Those are checkable properties of the referral file, and they are what the grader checks; no component of the reward depends on an assessment of style or persuasiveness."
