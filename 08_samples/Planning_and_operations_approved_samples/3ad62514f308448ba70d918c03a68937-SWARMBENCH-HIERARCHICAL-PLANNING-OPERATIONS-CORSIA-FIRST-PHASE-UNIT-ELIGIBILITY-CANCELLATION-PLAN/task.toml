data_provenance = "Every input is a verbatim capture of a public document and nothing in the package was written for the exercise. environment/input_artifacts/sources/ holds three ICAO documents as published, each as the original PDF and as text extracted from that same PDF: the ICAO document 'CORSIA Eligible Emissions Units', 14th edition of April 2026, which is the Council's own list of approved programmes with the eligibility timeframe, eligible unit dates and scope of eligibility for each; the Technical Advisory Body's Programme Eligibility Summary Table of April 2026; and the CORSIA Emissions Unit Eligibility Criteria. environment/input_artifacts/sources.json records for each capture its publisher, title, canonical URL, capture date and the SHA-256 of both the PDF and the extracted text, so a reviewer can re-fetch and compare bytes. The 221 candidate blocks are real registry activities: candidate_pool.csv, activity_dossiers.md and programme_labelling_extract.csv are extracts of the Voluntary Registry Offsets Database v2026-06 published by the Berkeley Carbon Trading Project at the Goldman School of Public Policy, University of California Berkeley, which compiles the public registry records of ACR, ART, CAR, Gold Standard, Isometric and Verra. Every project identifier, activity type, methodology, host country, first project vintage, per-vintage unretired tonnage and programme label in this package is that database's record of the real registry entry, unaltered; the only editorial acts were selecting 221 project-and-vintage blocks and splitting the registry attributes, the registry's own activity description and the programme labels into three files, because in practice a buyer receives the activity record and the programme's labelling claim separately. The contradiction the task turns on is already in that record rather than introduced here. Of the 221 rows in programme_labelling_extract.csv, 49 carry a programme label for the 2021-2023 pilot compliance period and 47 of those carry no label for the 2024-2026 first phase at all; 71 carry a first-phase label; 79 carry no compliance period label of any kind; and only 66 blocks in the pool carry labelling the record can be read as the host country authorisation the Council's scope requires. A further 33 blocks are caught by an exclusion in their own programme's Scope of Eligibility, and 14 of those are caught on a fact only the registry's prose description of the activity carries. That distribution is the real state of first-phase supply and none of it was arranged for the exercise. The offsetting requirement of 4,000,000 tonnes, the cancellation order and the convention of reading the first project vintage as evidence of the crediting period start are the requester's own operating parameters and are stated as such in the brief, because no airline group publishes its purchase pipeline."
scoring_design = "Fully deterministic executable evaluation with no model call anywhere in the grader. Checks sit in three buckets, every check carries weight 1, each bucket is the unweighted mean of its checks, and the reward is the plain mean of the three bucket means, with no caps, floors, gates, bonuses, aggregate multipliers or mode-specific branches. Three individual checks combine their own two terms as a product or a geometric mean rather than as an average, so that neither term can carry the check on its own: separating the verdicts by colour earns nothing on a map that drew no pool, refusing the whole pool earns nothing for catching the pilot-labelled blocks inside it, and citing one clearance well earns nothing on a pool that was not cleared. Those shapes are symmetric, sit inside a single check, and are the same in every execution mode. Eligibility is recomputed at grading time by applying the Council's rules to the packaged registry record, so a block's verdict is derived rather than compared against a stored answer for that block, and the same recomputation drives the schedule, the tonnages and the disposition totals. The rules themselves, including which exclusion clause attaches to which programme and the capacity threshold one of those clauses carries, are read out of the pinned Council document at grading time rather than held as constants, and the exclusions that turn on what an activity is are settled from the registry's own prose description of that activity rather than from a categorical field, so a change in either document changes what the grader expects. Every quotation is round-tripped against the pinned snapshot it is attributed to and must appear in it verbatim, and where that snapshot is the Council document the round trip is scoped to the section governing the 2024-2026 compliance period rather than run over the whole file, because the document says different things about the same programme under each compliance period and a sentence from the preamble or from another period's section is not the rule that decides one of our blocks, and a quotation is credited only where the sentence carries the rule the row applied rather than merely naming the programme, is not a sentence the Council writes about a different programme's units, and is not one sentence carried across two different deciding rules; the reuse test is scoped to the rule rather than to the verdict, because the condition a programme carries is legitimately the sentence that clears a block whose record shows it met and the sentence that refers a block whose record is silent on it. Every graded property is decidable from the packaged record: quotations are matched against the pinned document, figures against the recomputed clearance, and prose against identifiers, figures and sentence frames drawn from the record itself, so no check rests on a judgement about wording or tone. Anti-padding checks refuse a block cleared on the programme's label rather than the Council's scope, a pilot-period label read as a first-phase one, a referral that restates the verdict instead of setting out what each side said in its own words, a schedule that reuses a block or overshoots the requirement, a map whose marks carry no block identity or encode no verdict, a map whose geometric encoding is a raw registry figure written into a radius or a coordinate and therefore drawn off its own canvas, a map that fetches its marks or its styling from outside a page the brief requires to be self-contained, and a note padded by repetition. Credit accumulates per block rather than per row throughout: every content check that walks the submission's own rows consumes each block once, on the first row that claims it, and takes its denominator from the recomputed pool rather than from whatever the submission chose to file, so a table padded with restatements of the same block, a column left blank to shrink its own denominator, a file carrying several wordings of one referral until one passes, and a register that clears a single block and cites it perfectly are all scored as what they are. A register filled with one legal combination of tests and verdict in every row fails the typed-fields check on the spread of its own rows against the spread the recomputation produces, rather than passing a structural check that reads only the vocabulary. Structural checks account for under 40 per cent of the available reward, and the checks that require the Council document to have been read carry the rest."

