    depends_on: [council-rules-desk]
    parallel_group: programme-desks

  - id: evidence-worker-dates
    description: >-
      Supply the exact sentences carrying the eligible unit dates for the 2024 to 2026
      compliance period, copied word for word from the section of
      /input_artifacts/sources/ICAO-CEEU-2026-04.txt that governs that period. Return them to
      evidence-desk.
    depends_on: [evidence-desk]
    parallel_group: evidence-work

  - id: evidence-worker-identification
    description: >-
      Supply, per approved programme, the exact sentence in which the Council makes that
      programme's units eligible for cancellation toward the 2024 to 2026 compliance period,
      copied word for word from the section of /input_artifacts/sources/ICAO-CEEU-2026-04.txt
      that governs that period. Return them to evidence-desk.
    depends_on: [evidence-desk]
    parallel_group: evidence-work

  - id: evidence-worker-exclusions
    description: >-
      Supply the exact excluding sentence for every exclusion clause listed under any approved
      programme's Scope of Eligibility, copied word for word from the section of
      /input_artifacts/sources/ICAO-CEEU-2026-04.txt that governs the 2024 to 2026 compliance
      period, and say which programme each one sits under. Return them to evidence-desk.
    depends_on: [evidence-desk]
    parallel_group: evidence-work

  - id: evidence-worker-authorisation
    description: >-
      Supply the exact sentence making host country authorisation and the avoidance of
      double-claiming a condition under each approved programme, copied word for word from the
      section of /input_artifacts/sources/ICAO-CEEU-2026-04.txt that governs the 2024 to 2026
      compliance period, and say which programme each one sits under. Return them to
      evidence-desk.
    depends_on: [evidence-desk]
    parallel_group: evidence-work

  - id: evidence-worker-attribution
    description: >-
      For every sentence the other evidence workers supply, return the source_id
      /input_artifacts/sources.json gives the capture it was read out of, read out of that
      file rather than written from memory of a filename, so a sentence and its attribution
      cannot come apart downstream. Return the pairing to evidence-desk.
    depends_on: [evidence-desk]
    parallel_group: evidence-work

  - id: evidence-desk
    description: >-
      Own the quotations. Dispatch the five leaf workers named for this desk, then hold every
      sentence they return to two conditions before it leaves: it appears verbatim in the
      section of the file it is attributed to that governs the 2024 to 2026 compliance period,
      and it carries the rule it is offered for rather than merely naming a programme. Send
      back any sentence that fails either. Return the checked sentence set, each paired with
      its source_id, to clearance-assembly.
    depends_on: [council-rules-desk]
    parallel_group: evidence

  - id: clearance-assembly
    description: >-
      Settle the verdict each block's own desk answers support, in the vocabulary
      instruction.md sets, and write /logs/agent/clearance_register.csv in the declared column
      order with one row per block in the pool - each row carrying the five test columns as
      the desks returned them, the verdict, and the governing sentence with its source id from
      evidence-desk. Do not re-answer a desk's question and do not let a programme's own label
      stand in for an answer no desk gave. Hand the referred set to referral-panel and the
      cleared set to issue-desk.
    depends_on:
      - programme-desk-acr
      - programme-desk-art
      - programme-desk-car
      - programme-desk-gold
      - programme-desk-iso
      - programme-desk-vcs
      - evidence-desk
    parallel_group: assembly

  - id: referral-analyst-labelling-conflict
    description: >-
      Work the referred blocks where a programme has labelled the activity for the 2024 to
      2026 compliance period and a desk has found the Council's scope unsatisfied. For each,
      return what the programme claimed and what the Council requires, each in its own
      source's words with that source's id, and what would settle it. Return them to
      referral-panel.
    depends_on: [referral-panel]
    parallel_group: panel-work

  - id: referral-analyst-record-silence
    description: >-
      Work the referred blocks a desk returned UNRESOLVED because the record is silent rather
      than contrary. For each, return both positions in their own source's words and say what
      would have to be produced to settle it, naming the document and the figures of that
      block it applies to, against the assessment criteria council-rules-desk returned. Return
      them to referral-panel.
    depends_on: [referral-panel]
    parallel_group: panel-work

  - id: referral-panel
    description: >-
      Own the referral file. Dispatch the two leaf analysts named for this desk, then write
      /logs/agent/referrals.json as a JSON array, one object per referred block, in the
      declared key order, carrying both positions in their own source's words and a
      recommendation argued from that block's own figures. Overturn no desk and decide nothing
      on the schedule. Report the referred set to issue-desk.
    depends_on: [clearance-assembly]
    parallel_group: panel

  - id: schedule-builder
    description: >-
      Write /logs/agent/cancellation_schedule.csv in the declared column order from cleared
      blocks only, in the order and to the tonnage instruction.md sets, splitting the final
      block for the outstanding balance rather than overshooting it, and carrying the running
      total in the file. Take the cleared set and the tonnages from the register rather than
      recomputing them. Report the filed set to issue-desk.
    depends_on: [issue-desk]
    parallel_group: issue-work

  - id: map-builder
    description: >-
      Write /logs/agent/eligibility_map.html as one self-contained page meeting the
      requirements instruction.md sets for it, with the register and the schedule embedded as
      JSON under the declared script ids so the page and the files cannot drift. Take every
      block id, verdict and tonnage from the register and the schedule rather than recomputing
      them. Report to issue-desk.
    depends_on: [issue-desk]
    parallel_group: issue-work

  - id: note-writer
    description: >-
      Write /logs/agent/committee_note.md to the headings, length and disposition table
      instruction.md declares. This node writes in its own context, so carry the heading names
      and the table keys into it rather than assuming they are remembered. Every figure comes
      from the register, the referral file and the schedule and none is recomputed here, and
      each block is described only as the register describes it, in a sentence naming one
      disposition. Report to issue-desk.
    depends_on: [issue-desk]
    parallel_group: issue-work

  - id: release-check
    description: >-
      Read the four issued files back against /logs/agent/clearance_register.csv and report
      every disagreement: a block id in one and not another, a verdict that moved, a tonnage
      that does not add up, a heading or column that is not the declared one, a quotation that
      is not verbatim in the first-phase section of the file it is attributed to. Report to
      issue-desk; do not rewrite any file.
    depends_on: [schedule-builder, map-builder, note-writer]
    parallel_group: issue-check

  - id: issue-desk
    description: >-
      Own the four artifacts beside the register. Dispatch schedule-builder, map-builder and
      note-writer, then release-check once they have returned, and hold what they filed to one
      another: nothing leaves with a block id, a verdict or a tonnage that disagrees with the
      register. Report what was issued and what did not reconcile to clearing-router.
    depends_on: [clearance-assembly, referral-panel]
    parallel_group: issue

