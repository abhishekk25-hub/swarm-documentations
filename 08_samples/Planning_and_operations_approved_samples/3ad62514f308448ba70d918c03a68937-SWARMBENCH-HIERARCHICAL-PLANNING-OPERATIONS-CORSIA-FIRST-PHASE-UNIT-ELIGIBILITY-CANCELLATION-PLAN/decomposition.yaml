      separate field. Do not judge whether any label holds; that is not this worker's
      question. Return the two fields to programme-desk-iso.
    depends_on: [programme-desk-iso]
    parallel_group: programme-work

  - id: authorisation-worker-iso
    description: >-
      Answer the host country question, and only that question, for every block in
      /input_artifacts/candidate_pool.csv that Isometric issued: the condition the Council
      attaches to that programme on host country authorisation and the avoidance of
      double-claiming, and whether the record shows it met, unmet or unevidenced. Return PASS,
      FAIL or UNRESOLVED per block, naming the condition applied and the field of the record
      read for it, to programme-desk-iso. The verbatim sentence is evidence-desk's to supply.
    depends_on: [programme-desk-iso]
    parallel_group: programme-work

  - id: availability-worker-iso
    description: >-
      Answer the availability question, and only that question, for every block in
      /input_artifacts/candidate_pool.csv that Isometric issued: the tonnage the record shows
      still unretired on that vintage, and whether it is greater than zero. Name the blocks
      the record gives no usable figure for. This is the only place that tonnage is read.
      Return PASS, FAIL or UNRESOLVED and the figure per block to programme-desk-iso.
    depends_on: [programme-desk-iso]
    parallel_group: programme-work

  - id: approval-worker-vcs
    description: >-
      Answer the approval question, and only that question, for every block in
      /input_artifacts/candidate_pool.csv that the Verified Carbon Standard issued: whether
      the Council has approved that programme to supply units for the 2024 to 2026 compliance
      period and the block sits inside the eligibility timeframe stated against it. Work from
      that programme's entry in the rule set council-rules-desk returned. Return PASS, FAIL or
      UNRESOLVED per block, naming the rule applied, to programme-desk-vcs. The verbatim
      sentence behind that rule is evidence-desk's to supply and is not this worker's to
      quote.
    depends_on: [programme-desk-vcs]
    parallel_group: programme-work

  - id: dates-worker-vcs
    description: >-
      Answer the dates question, and only that question, for every block in
      /input_artifacts/candidate_pool.csv that the Verified Carbon Standard issued: whether
      the activity's first crediting period and the block's vintage year sit inside the
      eligible unit dates the rule set carries for this compliance period, naming the field of
      the record each was read from. Return PASS, FAIL or UNRESOLVED per block, naming the
      rule applied, to programme-desk-vcs. The verbatim sentence behind that rule is
      evidence-desk's to supply.
    depends_on: [programme-desk-vcs]
    parallel_group: programme-work

  - id: scope-worker-vcs
    description: >-
      Answer the scope question, and only that question, for every block in
      /input_artifacts/candidate_pool.csv that the Verified Carbon Standard issued: whether
      the activity falls outside the exclusions that programme's own Scope of Eligibility
      carries. Where the record's category fields do not settle what an activity is, read that
      activity's entry in /input_artifacts/activity_dossiers.md. Return PASS, FAIL or
      UNRESOLVED per block, naming which exclusion catches it and what in the record or the
      dossier put it there, to programme-desk-vcs. The verbatim excluding sentence is
      evidence-desk's to supply.
    depends_on: [programme-desk-vcs]
    parallel_group: programme-work

  - id: labelling-worker-vcs
    description: >-
      Read /input_artifacts/programme_labelling_extract.csv for the blocks the Verified Carbon
      Standard issued and return, per block, the compliance period label the programme carries
      for that activity or that it carries none, and every other entry against that activity
      as its own separate field. Do not judge whether any label holds; that is not this
      worker's question. Return the two fields to programme-desk-vcs.
    depends_on: [programme-desk-vcs]
    parallel_group: programme-work

  - id: authorisation-worker-vcs
    description: >-
      Answer the host country question, and only that question, for every block in
      /input_artifacts/candidate_pool.csv that the Verified Carbon Standard issued: the
      condition the Council attaches to that programme on host country authorisation and the
      avoidance of double-claiming, and whether the record shows it met, unmet or unevidenced.
      Return PASS, FAIL or UNRESOLVED per block, naming the condition applied and the field of
      the record read for it, to programme-desk-vcs. The verbatim sentence is evidence-desk's
      to supply.
    depends_on: [programme-desk-vcs]
    parallel_group: programme-work

  - id: availability-worker-vcs
    description: >-
      Answer the availability question, and only that question, for every block in
      /input_artifacts/candidate_pool.csv that the Verified Carbon Standard issued: the
      tonnage the record shows still unretired on that vintage, and whether it is greater than
      zero. Name the blocks the record gives no usable figure for. This is the only place that
      tonnage is read. Return PASS, FAIL or UNRESOLVED and the figure per block to
      programme-desk-vcs.
    depends_on: [programme-desk-vcs]
    parallel_group: programme-work

  - id: programme-desk-acr
    description: >-
      Own every block in the pool that the American Carbon Registry issued. Dispatch the six
      leaf workers named for this desk in desk_register, one per eligibility test, and merge
      what they return into this programme's rows: the five test columns, the tonnage, the two
      labelling fields, and per block which rule decided it, so evidence-desk's sentence for
      that rule can be joined to the row at assembly. Where two workers contradict each other
      about a block, return both and mark the block disagreed rather than choosing between
      them. Settle no verdict and write no file; hand the rows to clearance-assembly.
    depends_on: [council-rules-desk]
    parallel_group: programme-desks

  - id: programme-desk-art
    description: >-
      Own every block in the pool that Architecture for REDD+ Transactions issued. Dispatch
