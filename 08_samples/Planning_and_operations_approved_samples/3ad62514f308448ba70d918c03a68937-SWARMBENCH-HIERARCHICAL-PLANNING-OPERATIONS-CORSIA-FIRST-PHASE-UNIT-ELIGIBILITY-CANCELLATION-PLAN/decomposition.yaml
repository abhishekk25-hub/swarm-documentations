version: "1.0"
coordination_pattern: "hierarchical"
realized_subagent_target: 64
dispatch_tiers: 3
dependency_levels: 8

tier_model: >-
  Three tiers, because three is what the runner dispatches. The orchestrator sits at the top
  and is the clearing-router node below. It dispatches the eleven desk managers as general
  agents, and each desk manager dispatches its own leaf workers as explore agents, which
  execute directly and cannot dispatch further. Nothing in this plan asks for a fourth tier
  and nothing in it is written to be worked down by one reader. task.toml's dag_depth is this
  tier count. The dependency_levels figure above is a different quantity: it counts the
  ordering constraints among the 64 nodes, which sit inside the three tiers rather than
  adding to them, and it is what a reader gets by levelling the depends_on graph below.

  depends_on below is read as the runner reads it: a node is not dispatched until everything
  its depends_on names has returned. A leaf worker therefore names the desk that dispatches
  it, a desk names whatever it needs in hand before it can start, and the desk_register above
  is where a desk's own workers are listed. The two together are the whole graph: the
  register is who dispatches whom, depends_on is what has to be back first.

routing_model: >-
  The pool splits by programme first because the Council document does. Under each approved
  programme the Council writes that programme's own eligibility timeframe, its own eligible
  unit dates line, its own scope of eligibility and its own list of exclusions, and the list
  that governs a Gold Standard block says nothing at all about a Verified Carbon Standard
  one. So there is one desk per programme, and that desk owns every block its programme
  issued: it reads its programme's entry once and applies it to the blocks that entry
  governs, rather than six desks each re-reading the same document for a different question.

  Under a desk the split is by question. A programme desk dispatches one leaf worker per
  eligibility test - approval, dates, scope, labelling, authorisation, availability - so no
  worker holds more than one question about the blocks it sees, and the desk is where those
  six answers are put together into that programme's rows. A worker is named for one question
  under one programme; the desk is named for the programme.

  Four desks are not per programme, because the work they own is not written per programme.
  The council-rules-desk owns what the Council decided for the 2024 to 2026 compliance period
  as a whole and hands one rule set to every other desk before the programme desks start, so
  no two desks work from a different reading. The evidence-desk owns the quotations and the
  source ids they are attributed to. The clearance-assembly owns the register and is the only
  node that settles a verdict. The issue-desk owns the four remaining artifacts and holds
  them to the register.

  The desks are the source of the answers rather than a review of somebody else's. The
  orchestrator's own job is dispatch, ordering and the final reconciliation report; the
  verdicts, tonnages, schedule and totals are what the desks return, and a run in which they
  are computed before the desks are dispatched has inverted the plan rather than executed it.
  Nothing is written to /logs/agent until the desks whose answers it carries have returned,
  and the issue-desk's workers are the only nodes that write there.

  There are 64 nodes and a correctly executed run dispatches one worker per node. A run that
  has to re-dispatch a worker whose answer came back incomplete is still executing this plan,
  so the count is read with a tolerance of a fifth either way rather than as an exact figure.

referral_rules: >-
  A desk answers its own question or it refers, and it never does both. A desk refers when the
  answer it would have to give is not in the material it owns, and when the answer it holds
  contradicts an answer another desk has already returned for the same block. The referral
  panel does not overturn a desk: it records what each side said in that side's own words and
  recommends. A block under referral is not cleared and nothing under referral reaches the
  schedule.

handoff_contract: >-
  A leaf worker returns two things for every block it was asked about: the answer in its own
  column, and which rule it applied to reach it. It does not quote. The verbatim sentence for
  each rule, and the source_id of the capture it was read out of, come from the evidence desk,
  which is the only node that copies text out of a source document, and clearance-assembly
  joins the two so that each row carries the sentence for the rule that actually decided that
  block. That sentence comes out of the section of the Council document governing the 2024 to
  2026 compliance period. A desk that returns an answer naming no rule has returned an opinion
  and the assembly sends it back. Desks return UNRESOLVED where the material genuinely does
  not answer, and UNRESOLVED is a finding rather than a gap.

desk_register:
  clearing-router:
    - council-rules-desk
    - programme-desk-acr
    - programme-desk-art
    - programme-desk-car
    - programme-desk-gold
    - programme-desk-iso
    - programme-desk-vcs
    - evidence-desk
    - clearance-assembly
    - referral-panel
    - issue-desk
  council-rules-desk:
    - rules-reader-approvals
    - rules-reader-dates
    - rules-reader-exclusions
    - rules-reader-summary-table
    - rules-reader-criteria
  programme-desk-acr:
    - approval-worker-acr
    - dates-worker-acr
    - scope-worker-acr
    - labelling-worker-acr
    - authorisation-worker-acr
    - availability-worker-acr
  programme-desk-art:
    - approval-worker-art
    - dates-worker-art
    - scope-worker-art
    - labelling-worker-art
    - authorisation-worker-art
    - availability-worker-art
  programme-desk-car:
    - approval-worker-car
    - dates-worker-car
    - scope-worker-car
    - labelling-worker-car
    - authorisation-worker-car
    - availability-worker-car
  programme-desk-gold:
