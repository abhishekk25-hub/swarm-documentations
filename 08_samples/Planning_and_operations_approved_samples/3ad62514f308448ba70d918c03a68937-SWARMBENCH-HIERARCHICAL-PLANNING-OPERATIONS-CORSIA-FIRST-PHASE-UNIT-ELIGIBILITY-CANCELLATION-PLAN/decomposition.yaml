    - scope-worker-gold
    - labelling-worker-gold
    - authorisation-worker-gold
    - availability-worker-gold
  programme-desk-iso:
    - approval-worker-iso
    - dates-worker-iso
    - scope-worker-iso
    - labelling-worker-iso
    - authorisation-worker-iso
    - availability-worker-iso
  programme-desk-vcs:
    - approval-worker-vcs
    - dates-worker-vcs
    - scope-worker-vcs
    - labelling-worker-vcs
    - authorisation-worker-vcs
    - availability-worker-vcs
  evidence-desk:
    - evidence-worker-dates
    - evidence-worker-identification
    - evidence-worker-exclusions
    - evidence-worker-authorisation
    - evidence-worker-attribution
  clearance-assembly: []
  referral-panel:
    - referral-analyst-labelling-conflict
    - referral-analyst-record-silence
  issue-desk:
    - schedule-builder
    - map-builder
    - note-writer
    - release-check

sub_tasks:
  - id: clearing-router
    description: >-
      Dispatch the eleven desk managers and hold the order between them. Send
      council-rules-desk first and wait for its rule set, then the six programme desks and the
      evidence desk together, then clearance-assembly, then the referral panel, then the issue
      desk. Do not read /input_artifacts/candidate_pool.csv,
      /input_artifacts/programme_labelling_extract.csv or the dossiers, do not write or run a
      script over them, and do not form a verdict, a tonnage, a schedule or a total for any
      block: those are the desks' answers and this node has none of its own. Report which
      desks returned complete, which blocks came back UNRESOLVED from more than one desk, and
      what the panel was left holding.
    depends_on: []
    parallel_group: routing

  - id: rules-reader-approvals
    description: >-
      Read /input_artifacts/sources/ICAO-CEEU-2026-04.txt and return the emissions unit
      programmes the Council has approved to supply units for the 2024 to 2026 compliance
      period, each with the sentence naming its approval and the eligibility timeframe stated
      against it. Note where a programme is approved for one compliance period and not
      another. Return the list to council-rules-desk.
    depends_on: [council-rules-desk]
    parallel_group: rule-reading

  - id: rules-reader-dates
    description: >-
      Read /input_artifacts/sources/ICAO-CEEU-2026-04.txt and return the eligible unit dates
      that apply in the 2024 to 2026 compliance period: the date from which an activity's
      first crediting period must have started and the window the emissions reductions
      themselves must fall in, each with the sentence carrying it. Return them to
      council-rules-desk.
    depends_on: [council-rules-desk]
    parallel_group: rule-reading

  - id: rules-reader-exclusions
    description: >-
      Read /input_artifacts/sources/ICAO-CEEU-2026-04.txt and return, per approved programme,
      that programme's Scope of Eligibility and every exclusion listed under it, keeping the
      wording of each exclusion rather than paraphrasing it, as a list a desk can apply to a
      row without opening the document again. Return it to council-rules-desk.
    depends_on: [council-rules-desk]
    parallel_group: rule-reading

  - id: rules-reader-summary-table
    description: >-
      Read /input_artifacts/sources/ICAO-TAB-SUMMARY-2026-04.txt and report every programme
      the advisory body's summary table and the Council document place differently, saying
      which way each of them has it. Report the difference; do not resolve it. Return the list
      to council-rules-desk.
    depends_on: [council-rules-desk]
    parallel_group: rule-reading

  - id: rules-reader-criteria
    description: >-
      Read /input_artifacts/sources/ICAO-EUC-DOC09.txt and return the criteria the Council
      assesses an emissions unit programme against, with the sentence carrying each. This is
      the material the referral panel argues a recommendation from. Return it to
      council-rules-desk.
    depends_on: [council-rules-desk]
    parallel_group: rule-reading

  - id: council-rules-desk
    description: >-
      Own the rule set for the 2024 to 2026 compliance period. Dispatch the five leaf readers
      named for this desk, merge what they return into one rule set - approved programmes and
      their eligibility timeframes, the eligible unit dates, the per-programme scope of
      eligibility with its exclusions, the summary-table discrepancies and the assessment
      criteria - and hand that one rule set to every other desk before any programme desk
      starts, so no two desks work from a different reading. Mark every item with where in the
      document it was found and which compliance period's section it came out of. Answer
      nothing about any individual block.
    depends_on: [clearing-router]
    parallel_group: rule-set

  - id: approval-worker-acr
    description: >-
      Answer the approval question, and only that question, for every block in
      /input_artifacts/candidate_pool.csv that the American Carbon Registry issued: whether
      the Council has approved that programme to supply units for the 2024 to 2026 compliance
      period and the block sits inside the eligibility timeframe stated against it. Work from
      that programme's entry in the rule set council-rules-desk returned. Return PASS, FAIL or
      UNRESOLVED per block, naming the rule applied, to programme-desk-acr. The verbatim
      sentence behind that rule is evidence-desk's to supply and is not this worker's to
      quote.
    depends_on: [programme-desk-acr]
    parallel_group: programme-work

  - id: dates-worker-acr
    description: >-
      Answer the dates question, and only that question, for every block in
      /input_artifacts/candidate_pool.csv that the American Carbon Registry issued: whether
      the activity's first crediting period and the block's vintage year sit inside the
      eligible unit dates the rule set carries for this compliance period, naming the field of
      the record each was read from. Return PASS, FAIL or UNRESOLVED per block, naming the
      rule applied, to programme-desk-acr. The verbatim sentence behind that rule is
      evidence-desk's to supply.
    depends_on: [programme-desk-acr]
    parallel_group: programme-work

  - id: scope-worker-acr
    description: >-
      Answer the scope question, and only that question, for every block in
      /input_artifacts/candidate_pool.csv that the American Carbon Registry issued: whether
      the activity falls outside the exclusions that programme's own Scope of Eligibility
      carries. Where the record's category fields do not settle what an activity is, read that
      activity's entry in /input_artifacts/activity_dossiers.md. Return PASS, FAIL or
      UNRESOLVED per block, naming which exclusion catches it and what in the record or the
      dossier put it there, to programme-desk-acr. The verbatim excluding sentence is
      evidence-desk's to supply.
    depends_on: [programme-desk-acr]
    parallel_group: programme-work

  - id: labelling-worker-acr
    description: >-
      Read /input_artifacts/programme_labelling_extract.csv for the blocks the American Carbon
      Registry issued and return, per block, the compliance period label the programme carries
      for that activity or that it carries none, and every other entry against that activity
      as its own separate field. Do not judge whether any label holds; that is not this
      worker's question. Return the two fields to programme-desk-acr.
    depends_on: [programme-desk-acr]
    parallel_group: programme-work

  - id: authorisation-worker-acr
    description: >-
      Answer the host country question, and only that question, for every block in
      /input_artifacts/candidate_pool.csv that the American Carbon Registry issued: the
      condition the Council attaches to that programme on host country authorisation and the
      avoidance of double-claiming, and whether the record shows it met, unmet or unevidenced.
      Return PASS, FAIL or UNRESOLVED per block, naming the condition applied and the field of
      the record read for it, to programme-desk-acr. The verbatim sentence is evidence-desk's
      to supply.
    depends_on: [programme-desk-acr]
    parallel_group: programme-work

  - id: availability-worker-acr
    description: >-
      Answer the availability question, and only that question, for every block in
      /input_artifacts/candidate_pool.csv that the American Carbon Registry issued: the
      tonnage the record shows still unretired on that vintage, and whether it is greater than
      zero. Name the blocks the record gives no usable figure for. This is the only place that
      tonnage is read. Return PASS, FAIL or UNRESOLVED and the figure per block to
      programme-desk-acr.
    depends_on: [programme-desk-acr]
    parallel_group: programme-work

