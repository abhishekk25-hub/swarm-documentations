    parallel_group: programme-desks

  - id: programme-desk-iso
    description: >-
      Own every block in the pool that Isometric issued. Dispatch the six leaf workers named
      for this desk in desk_register, one per eligibility test, and merge what they return
      into this programme's rows: the five test columns, the tonnage, the two labelling
      fields, and per block which rule decided it, so evidence-desk's sentence for that rule
      can be joined to the row at assembly. Where two workers contradict each other about a
      block, return both and mark the block disagreed rather than choosing between them.
      Settle no verdict and write no file; hand the rows to clearance-assembly.
    depends_on: [council-rules-desk]
    parallel_group: programme-desks

  - id: programme-desk-vcs
    description: >-
      Own every block in the pool that the Verified Carbon Standard issued. Dispatch the six
      leaf workers named for this desk in desk_register, one per eligibility test, and merge
      what they return into this programme's rows: the five test columns, the tonnage, the two
