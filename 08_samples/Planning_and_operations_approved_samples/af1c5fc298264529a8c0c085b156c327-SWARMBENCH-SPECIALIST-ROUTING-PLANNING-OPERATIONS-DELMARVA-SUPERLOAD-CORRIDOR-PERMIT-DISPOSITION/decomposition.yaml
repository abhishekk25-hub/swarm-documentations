      Coordination: dispatched by the router; consumed by the capacity integrator.
    depends_on: [permit-desk-router]
    parallel_group: specialists

  - id: record-lane-sr141
    description: |
      Scope: the pinned structure records on corridor HC-141, both the 2024 delivery and the
