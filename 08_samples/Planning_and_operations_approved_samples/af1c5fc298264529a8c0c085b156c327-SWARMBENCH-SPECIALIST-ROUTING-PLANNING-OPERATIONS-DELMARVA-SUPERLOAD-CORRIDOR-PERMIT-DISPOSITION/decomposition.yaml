version: "1.0"
coordination_pattern: "specialist-routing"

sub_tasks:
  - id: permit-desk-router
    description: |
      Scope: the whole packaged input set, for dispatch purposes only.
      Produces: the twenty-three specialist assignments below, each naming one partition, and the
      shared identifier, rounding and column conventions the package will use.
      Coordination: entry point, opened by the run's top-level agent. Dispatches all twenty-three
      specialists in parallel, then dispatches both integrators once their specialist returns are
      in, and does no analysis of its own.
    depends_on: []
    parallel_group: routing

  - id: record-lane-us13-newcastle
    description: |
      Scope: the pinned structure records on corridor HC-13N, both the 2024 delivery and the
      2022 and 2023 prior deliveries of those same structures.
      Produces: a per-structure record sheet for that corridor, carrying each structure's current
      coded condition items and ratings, and the direction those items have moved since the prior
      deliveries, which is the condition trend the register reports.
      Coordination: dispatched by the router; consumed by the capacity integrator.
    depends_on: [permit-desk-router]
    parallel_group: specialists

  - id: record-lane-us13-kent
    description: |
      Scope: the pinned structure records on corridor HC-13K, both the 2024 delivery and the
      2022 and 2023 prior deliveries of those same structures.
      Produces: a per-structure record sheet for that corridor, carrying each structure's current
      coded condition items and ratings, and the direction those items have moved since the prior
      deliveries, which is the condition trend the register reports.
      Coordination: dispatched by the router; consumed by the capacity integrator.
    depends_on: [permit-desk-router]
    parallel_group: specialists

