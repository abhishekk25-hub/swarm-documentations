[task]
name = "swarmbench/af1c5fc298264529a8c0c085b156c327-SWARMBENCH-SPECIALIST-ROUTING-PLANNING-OPERATIONS-DELMARVA-SUPERLOAD-CORRIDOR-PERMIT-DISPOSITION"
description = "Dispose 72 superload permit applications over six Delaware heavy-haul corridors carrying 88 real NBI structures. What a structure carries depends on its real condition ratings, on whether an interim district limit is still standing in 331 free-prose field memos, and on where the load's own path runs; the load-rating budget relieves only a fraction of what is blocked. Deliver the capacity register, dispositions, re-rating programme, bottleneck ledger, refusal register, chart and letter."

[metadata]
verifier_type = "executable"
domain = "planning-operations"
coordination_pattern = "specialist-routing"
secondary_classification = ["long_horizon", "long_writing"]
dag_depth = 6
dag_width = 23
human_solving_hours_estimate = 105.3
human_solving_hours_justification = "Reading the 331 field memos and settling, structure by structure, whether a limit is standing on the docket date runs about 5 minutes a memo, 27.6h: the notes are free prose, a concurred imposition has to be told apart from a recommendation nobody signed, from a revision that replaced an earlier figure, from a rescission, from a review date that has already run out, and from a figure the note quotes for the structure next door, and the tonnages and dates are written in whatever form the writer used. Reading the 590 pieces of applicant correspondence and working out what each of the 72 applications actually asks for now runs about 2.5 minutes an item, 24.6h, because most messages change nothing while still quoting figures and several quote another application's figures. Deriving the 88 capacity rows from the two pinned deliveries at 8 minutes each takes 11.7h. Walking the six-rule ladder over each application's path takes about 12 minutes each, 14.4h. The 30-row corridor bottleneck ledger takes 3h. Choosing the re-rating set inside 20 engineer-weeks and seating it takes 8h. The chart takes 3h. Writing 72 case-specific sections plus the docket summary takes 7h. Reconciling the seven artifacts against each other takes 6h. Total: 27.6 + 24.6 + 11.7 + 14.4 + 3 + 8 + 3 + 7 + 6 = 105.3h."
estimated_sub_agents = 37
data_provenance = "Two real FHWA datasets are pinned and carry every structure fact and every movement the docket turns on. nbi_structure_extract.json is the National Bridge Inventory 2024 delivery, Delaware state file DE24.txt, and nbi_prior_deliveries.json is the same 88 structures as published in the 2023 and 2022 deliveries; both were retrieved from fhwa.dot.gov and decoded field by field against FHWA's published NBI record format. Nothing in either was altered: structure numbers, kilometerpoints, condition ratings, operating and inventory ratings, posting status, clearances, span counts, traffic and bypass detour lengths are the values FHWA published. Between them they settle what each structure carries today and which way it has moved since 2022, which is the layer the register, the ledger and the whole disposition ladder rest on. The operational layer around them is the exercise's own: the caseload of 72 applications, the 331 district field notes, the nine load-rating engineers, the corridor naming and the rulebook. Even there the evidence is drawn from the real records - every technical fact a note states (year built, material, span count, structure length, the feature crossed and the four coded condition items) is that structure's own published FHWA value, so reading a note against the extract is reading real data. The notes carry no fixed template: wide wording pools per act, clause order, date format and tonnage format differ note by note, optional fields are absent where a real file would have them absent, and note length runs from 12 to 77 words. The clutter is deliberate and is what the reading is about: superseded impositions, recommendations nobody concurred with, rescinded limits, review dates that have run out, and figures quoted for a neighbouring structure."
verifier_determinism = "INTENTIONAL. tests/verify.py recomputes every expectation in code from the packaged inputs, with no LLM judge, no network, no randomness, no clock read and no answer-key file, so the reward is reproducible and auditable. The verifier reads the same free prose the agent reads: it recognises what act a note performs and the figure and review date it carries across the wordings, tonnage forms and date forms the notes actually use, then walks each structure's own file in date order. The arithmetic layers below that determination (the derate, the posting cap, the disposition ladder, the ledger) are stated in the packaged rules file and are meant to be reproducible once the reading above them is right, which is the point: a wrong reading of one structure's file propagates into its capacity, into every path that crosses it, into a corridor band, a refusal reason and a letter section. The re-rating programme is underdetermined by design. Twelve structures are implicated in relieving sixteen blocked movements, they need 34 engineer-weeks between them and the programme may spend 20, so the verifier grades it on feasibility, on whether the relief it claims survives re-running the ladder, and on saturation against the optimum the verifier computes itself, rather than against one chosen programme."
input_token_estimate = 113000
scoring_design = "Fully deterministic executable verifier, no LLM judge. tests/verify.py rebuilds the structure capacity model, the standing-restriction determination, the 72 paths, the disposition ladder, the bottleneck ledger and the re-rating optimum from the pinned NBI extract, the memo corpus, the application table, the engineer roster and the rules file, then scores three buckets of weight-1 checks: 9 static, 9 reward-hacking and 17 partial-oracle. Structural checks are one sixth of the reward. The evidence layer (standing restrictions, coded facts and derate, effective capacity, re-rating eligibility) accounts for 5 of the 17 content checks; the other 12 sit on the work itself, being path construction in path order, controlling structure, the five-way decision, condition codes, escort class, blocking structures and detour arithmetic, refusal reason codes, programme feasibility and saturation, the corridor ledger, and two checks on the written letter graded against the evidence rather than against the agent's own rows. Anti-gaming checks are grounded rather than self-referential: chart geometry is measured against both the evidence and the submitted register, the summary block is reconciled against both the rows written and the corpus counts, cited memos must be the memo that actually governs the structure they are cited under, copy detection runs on content-word shingles so filler words do not hide a lifted passage, and verdict spread is compared with the spread the evidence carries so a single repeated decision earns nothing. Coverage checks are denominated over the full 88-structure and 72-application corpora rather than over the rows the agent chose to write. reward = (static + 2*reward_hacking + 3*partial_oracle)/6, with no caps, ceilings, floors, binary gates or mode-specific branches."
why_multi_agent = "Three bodies of evidence have to be settled before a single permit can be disposed, and none of them can be sampled. The 331 memos are free prose in which no standing limit is written down: each structure's file has to be walked in date order, and a concurred imposition told apart from a recommendation that was never concurred, from a revision that replaced an earlier figure, from a rescission, from a review date that has already run out, and from a limit the note quotes for the structure next door. Nothing is uniform, so a reader who learns one note's shape has learned nothing about the next one. The 88 pinned records decide, through four coded condition items, a posting flag and a design-load code, what each structure carries and whether refined analysis could recover anything. Only then does the work start: every one of the 72 applications has its own path, and a path is only as good as its worst structure, so the same structure governs many applications at once and a single misread limit propagates into a dozen decisions, a corridor band, a refusal reason and a letter section. On top of that sits a set-cover choice. Twelve structures are implicated in relieving sixteen blocked movements, they need 34 engineer-weeks between them, and the programme may spend 20, which cannot be settled until the disposition layer is complete and which then has to be seated against specialty, availability and an eight-week window. One context reads a few memo files closely, then starts asserting limits it has not traced, and the errors compound across paths rather than staying local. Routing the reading by question class, giving one specialist the pinned records for a corridor and a different specialist the restriction file for the same corridor, and settling the whole standing-restriction register before any path is walked, keeps coverage intact and surfaces the conflicts a single pass silently resolves the wrong way."
reference_link = "https://www.fhwa.dot.gov/bridge/nbi/2024/DE24.txt, https://www.fhwa.dot.gov/bridge/nbi/format.cfm, https://www.fhwa.dot.gov/bridge/nbi/ascii2024.cfm"

