[task]
name = "swarmbench/91914ae0fdfe4b6cac0025d4c54c185e-SWARMBENCH-HIERARCHICAL-PLANNING-OPERATIONS-INLAND-WATERWAY-WINTER-LOCK-OUTAGE-PROGRAMME"
description = "Build one winter 2026-27 major-maintenance outage programme for 57 real USACE lock chambers on the Upper Mississippi, Illinois and Ohio. What a closure costs depends on each site's real chamber count and usable dimensions read against the season's committed tows, and mandatory work is stated only inside 140 inspection narratives. Deliver the chamber assessment, programme, severance ledger, bulkhead itinerary, deferral register, schedule chart and navigation notice."

[metadata]
verifier_type = "executable"
domain = "planning-operations"
coordination_pattern = "hierarchical"
secondary_classification = ["long_horizon", "long_writing"]
dag_depth = 8
dag_width = 6
human_solving_hours_estimate = 78.0
human_solving_hours_justification = "Reading the 140 inspection notes, picking out the current-cycle reading of each component governing metric against the earlier-cycle and other-component readings in the same prose, and applying the division bands takes about 6 minutes a note, 14h. Screening the 57 candidate chambers against the pinned NTAD extract for chamber count, usable dimensions, status and district at 8 minutes each takes 8h. Establishing eligibility, duration and resource class for the 72 work items at 7 minutes each takes 8h. Working the double-locking exposure of the 66 committed tows across their routes takes 10h. Solving and reconciling the season against severed-day budgets, district windows, crew classes and bulkhead availability takes 14h. Sequencing the bulkhead itineraries with river-mile travel takes 5h. Producing the six structured artifacts and the schedule chart takes 9h. Writing the per-outage navigation notice takes 6h. Cross-artifact and provenance verification takes 4h. Total: 14 + 8 + 8 + 10 + 14 + 5 + 9 + 6 + 4 = 78h."
estimated_sub_agents = 22
data_provenance = "MIXED - one real pinned dataset plus constructed operational records. ntad_waterway_locks.json is real and verbatim: the USACE NDC lock-characteristics record set published in the USDOT/BTS National Transportation Atlas Database, retrieved from the live feature service, and it is the authority for every chamber identity, river mile, chamber count, usable dimension, district and operational status the task uses. The programme rules, the 72 work items, the 140 inspection notes, the 66 tow commitments, the crew and bulkhead rosters and the district windows are CONSTRUCTED records built against those real chambers. They are realistic but they are not captured from any USACE system, and nothing in them should be read as evidence of real USACE practice. This is stated plainly rather than implied by the origin labels in source_manifest.json. The distractor readings inside the inspection notes - earlier survey cycles, and readings from other components at the same chamber - are deliberately placed, because real inspection prose carries the same clutter."
verifier_determinism = "INTENTIONAL. This is a deterministic-verifiable task type: tests/verify.py recomputes every expectation in code, with no LLM judge and no answer-key file, so the reward is reproducible and auditable. It follows that a purpose-built script with the packaged rules in hand could reproduce the condition determinations, which are one input layer scored by 3 of the 14 content checks. The season itself is not reducible that way: choosing which mandatory work to seat inside a per-river severed-day budget, with physical bulkhead sets that must travel and classed crews that must be free, is an underdetermined combinatorial choice with many valid answers, and the verifier grades it on feasibility, saturation and defensible deferral rather than against one chosen season."
input_token_estimate = 85000
scoring_design = "Fully deterministic executable verifier, no LLM judge. tests/verify.py recomputes every evidence-determined expectation from the pinned NTAD extract, the inspection notes, the work-item table, the tow commitments, the resource rosters and the rules file, then scores three equal-membered buckets of weight-1 checks: 9 static, 9 reward-hacking and 14 partial-oracle. Structural checks are one sixth of the reward. The condition-standing layer accounts for 3 of the 14 content checks; the remaining 11 sit on the programme itself - placement feasibility, season saturation, per-river severance, held traffic, bulkhead movement, deferral reasons, reported chamber facts and the written traffic argument. Anti-gaming checks are grounded rather than structural: citations must resolve to tows that actually reach the outage and to notes that actually govern the item, summary figures must reconcile with the rows in both the JSON and the written notice, chart geometry and classification attributes must follow the schedule, and notice sections must survive three template defences. Classification is scored by F1 and macro recall so a repeated guess earns little, and programme-side checks are denominated over the mandatory corpus rather than over the rows the agent chose to write. reward = (static + 2*reward_hacking + 3*partial_oracle)/6, with no caps, ceilings, floors, binary gates or mode-specific branches."
why_multi_agent = "The season cannot be built until three independent bodies of evidence are resolved, and none of them can be sampled. The 140 inspection notes are free narrative in which no condition class is written down: each note has to be read for the reading that governs its component, separated from the earlier-cycle reading and from the reading taken on a different component at the same chamber, and weighed against the notes a later survey retired or that never obtained a reading. The 57 chamber records decide, through chamber count and usable dimensions, whether a closure severs a river or merely restricts it. The 66 committed tows decide who is held and who must double-lock. That evidence is the input. The work itself is the season: a full closure holds a whole river, the severed-day budget binds per river rather than per site, the bulkhead sets are physical and have to travel between sites, the crews are classed and districted, and seven artifacts have to describe the same programme. Choosing which mandatory work to seat inside those budgets has no single right answer and no closed form, and every deferral has to be defensible against the programme actually submitted. Splitting the reading across six fixed evidence blocks, adjudicating those reads into one determination set, and having an independent auditor re-derive every contested determination before any scheduling begins keeps coverage intact and surfaces the conflicts that one pass settles silently."
reference_link = "https://services7.arcgis.com/n1YM8pTrFmm7L4hs/ArcGIS/rest/services/Locks/FeatureServer/0, https://hub.arcgis.com/datasets/usdot::waterway-locks"

