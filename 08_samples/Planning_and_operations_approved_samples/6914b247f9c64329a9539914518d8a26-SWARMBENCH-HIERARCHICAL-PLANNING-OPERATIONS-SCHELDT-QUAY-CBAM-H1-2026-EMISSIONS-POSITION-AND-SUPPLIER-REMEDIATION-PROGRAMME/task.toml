[task]
name = "swarmbench/6914b247f9c64329a9539914518d8a26-SWARMBENCH-HIERARCHICAL-PLANNING-OPERATIONS-SCHELDT-QUAY-CBAM-H1-2026-EMISSIONS-POSITION-AND-SUPPLIER-REMEDIATION-PROGRAMME"
description = "Close the first-half 2026 carbon border position for an Antwerp indirect customs representative that files as authorised CBAM declarant for twelve importers. Whether a goods line is in scope, whether an operator's own emissions figures may be used at all, and what a tonne of imported steel, aluminium, cement or fertiliser actually carries are settled only in 204 customs, installation, verification, carbon-pricing and supplier documents."

[metadata]
verifier_type = "executable"
domain = "planning-operations"
coordination_pattern = "hierarchical"
secondary_classification = ["long_horizon", "long_writing"]
dag_depth = 8
dag_width = 20
human_solving_hours_estimate = 68.45
human_solving_hours_justification = "Reading is 26.10h. The 56 release declarations are 6 minutes each, 5.60h, because each carries two to four goods lines and the procedure code, the declared origin, the country of dispatch and the net mass all have to be taken off the item rather than off the header. The 36 operator communications are 15 minutes each, 9.00h: each states an attributed emissions figure and an activity level on one of five house layouts, lists the production processes inside its boundary, and names the precursors it consumed with a consumption figure that is sometimes per tonne of product, sometimes an absolute quantity for the period and sometimes a percentage of product mass. The 37 verification reports are 6 minutes each, 3.70h, since each carries an assurance opinion, a statement on unresolved misstatements, the period it covers, the accreditation reference of the body that signed it and the date of signature, and two of them are reissues that displace an earlier report. The 24 carbon price claims are 6 minutes each, 2.40h, because each prints an amount, a currency, a scheme, a character of charge, a period and whether an attestation is attached. The 33 supplier letters are 4 minutes each, 2.20h, and the 18 proofs of origin 4 minutes each, 1.20h. The desk reference and the eleven pinned tables are 2.00h. Analysis is 28.85h. Deciding scope and origin for each of the 123 goods lines, which means the customs procedure, whether the code is a covered good, and resolving the country of origin where the entry, a proof and a letter disagree, is 2 minutes each, 4.10h. Adjudicating whether each of the 36 communications may be used at all, against the period, the assurance opinion, the accreditation validity at the date of signature, the sector scope of that accreditation, the completeness of the boundary and the unresolved misstatements, is 8 minutes each, 4.80h. Walking the precursor chains and deriving each installation's specific embedded emissions is 9 minutes each, 5.40h. Resolving the applicable published default for a line, including the sector rule on indirect emissions and the fallbacks where the Commission publishes no figure for that country and code, is 2 minutes over 123 lines, 4.10h. Computing embedded emissions per line is 1 minute over 123 lines, 2.05h. Testing each of the 24 carbon price claims, converting it and allocating it is 6 minutes each, 2.40h. Aggregating each of the 12 importers, running the mass threshold and settling the certificate position is 15 minutes each, 3.00h. Ranking the remediation actions against their exposure and filling the engagement capacity is 3.00h. Synthesis is 13.50h: assembling the six tabular deliverables with a located passage behind every admitted figure is 4.50h, the position memorandum 4.50h, the exposure exhibit 1.50h, and a final pass reconciling the eight deliverables against each other 3.00h. Total: 26.10 + 28.85 + 13.50 = 68.45h."
estimated_sub_agents = 31
data_provenance = "Two layers, and the split is disclosed rather than blurred. The public layer is real and unaltered. reference/commission_default_values.csv and reference/commission_annex_iv_values.csv are an extract of the default values the European Commission adopted for the CBAM definitive period, retrieved from taxation-customs.ec.europa.eu on 2026-08-31 as the workbook DVs as adopted_v20260204.xlsx, which reproduces Annexes I and IV to Commission Implementing Regulation (EU) 2025/2621 as corrected by Implementing Regulation (EU) 2026/1740. The extract carries every country of origin and every commodity code that appears in the portfolio, together with the Other Countries and Territories sheet and the Annex IV highest values, reshaped from one sheet per country into long form and otherwise exactly as released. It carries the Commission's own heterogeneity with it: some country sheets publish the whole code list and others publish only the sectors that country exports, some rows are published with no figure at all, and the indirect column is printed N/A for aluminium, hydrogen and iron and steel. Those numbers are what makes a line decidable rather than assertable, and three of the four fallback routes in the desk reference exist because the published table genuinely behaves that way. The rule frame is real and restated rather than invented: cbam_desk_reference.md is a desk restatement of Regulation (EU) 2023/956 as amended, of the conditions under which actual embedded emissions may be used, of the precursor rule by which a complex good carries the emissions of the goods consumed to make it, of the sector rule on indirect emissions, of the fifty tonne cumulative mass threshold that applies per importer, of the 2.5 per cent phase-in factor for 2026 and of the conditions for deducting a carbon price paid in the country of production, each cited in the reference so a reviewer can check it against the published source. The transaction layer could not be published as sourced and is disclosed here as authored rather than presented as downloaded. Customs declarations, operator emissions communications, verification opinions, carbon price attestations and proofs of origin are commercially confidential filings that no declarant, operator or verification body publishes. Scheldt Quay Customs Services NV, the twelve importers it represents, the 36 installations, their operators, their four verification bodies and every identifier in the corpus are invented, identify no real company, installation, verification body or person, and the 204 case documents restate the kind of paperwork a CBAM declarant's file holds rather than reproduce any particular filing. No real operator, verifier or authority is depicted as having erred: every defect in the corpus attaches to an invented document. The paper carries the variation of real filing rather than one repeated form: five house layouts for the operator communication with different field labels and section orders, three date presentations, three ways of expressing a precursor consumption figure, monitoring and data-quality narratives drawn from pools so no two sheets read alike, and verification reports that print the qualification that matters beside findings that do not."
verifier_determinism = "The task is not automatable by script from where the agent stands, and the grader's determinism is a property of the grading rather than of the work. No script of any kind reaches any agent mode: environment/Dockerfile copies input_artifacts/ and nothing else, tests/ is not in the build context, and nothing under /input_artifacts parses, derives or pre-computes anything. What an agent is handed is 204 documents of prose on five house layouts, three date presentations and eleven tables, and what it has to do with them is interpretation, judgment and ambiguity resolution. Whether an assurance opinion is the unqualified one the rule requires or one of the three that are not. Whether a verifier's accreditation was live and in sector scope on the day the opinion was signed, which is settled in a register filed under neither the operator nor the opinion. Whether a later verification report has displaced an earlier one. Whether a communication's declared boundary omits a process or a precursor that the route the operator itself declares requires. Whether a precursor consumption figure is a rate per tonne, an absolute quantity for the period or a percentage of product mass, which is only decidable from the sentence it is written in. Whether the country on an entry survives the proof of origin filed against it, and whether that proof is capable of settling anything at all. Whether a letter has corrected a figure the communication still carries, or disclosed a rebate the claim form does not. Whether an installation supplied anything the position actually counts. None of that is stated anywhere in the inputs in a form a pattern could pick up, and any script that solved this package would first have to be written by somebody who had already done that reading. tests/verify.py is that somebody's record, not a substitute for the work. It is not a solver for this task: what it holds is the recorded outcome of a human author having read the corpus first, and the layouts, the date presentations and the sentence forms each verification opinion and each supplier letter prints are enumerated in it because a human enumerated them out of the corpus, one document at a time, before a line of it was written. Writing the grader that way is what lets every check be exact and every point traceable to the evidence that produced it, and it is why the grader can be deterministic while the task is not scriptable by the agent. The determinism itself is complete and is disclosed as such: verify.py recomputes every expectation from the packaged inputs with no network, no randomness, no clock read and no stored answer key, so two runs of one submission score identically. It does the same reading the agent does rather than a keyword sweep over it: it parses each operator's own house layout, resolves each declared good to its installation, adjudicates admissibility condition by condition in order, walks the precursor graph to its roots applying each link's own verdict, applies the sector rule on indirect emissions, resolves the default value under the not-listed, no-value-published and origin-not-established fallbacks, computes the embedded emissions line by line, tests, converts and allocates the carbon price claims, aggregates each importer against the mass threshold and fills the remediation capacity. The claim that it reads the corpus correctly is measured rather than asserted: the grader's independent recomputation was compared field by field against the corpus generator's own model of the same period, over all 36 installations, all 123 goods lines, all 24 claims, all 12 importer positions and all 14 remediation actions, and the two agree exactly on every scope decision, origin, basis, specific emissions figure, embedded emissions figure, admissibility verdict, failing condition, precursor ratio, claim verdict, deduction, threshold status, certificate position, exposure, rank and wave."
input_token_estimate = 130000
scoring_design = "Fully deterministic executable verifier; no LLM judge anywhere in the package. tests/verify.py rebuilds the document reading, the scope determination, the origin resolution, the admissibility adjudication, the precursor walk, the default-value resolution, the embedded emissions arithmetic, the carbon price test and allocation, the importer aggregation and the remediation fill from the packaged inputs, then scores 72 checks in three buckets: 13 static, 17 reward-hacking and 42 partial-oracle. reward = (static + 2*reward_hacking + 3*partial_oracle)/6, where each bucket total is the plain unweighted mean of its own checks and no check inside a bucket carries a weight of its own. The 13 structural checks therefore carry one sixth of the reward and the other 59 grade content, arithmetic and authenticity. Every check is bounded in [0, 1] by its own arithmetic, being a proportion, a mean of proportions, an F1 or a product of those, and there are no caps, clamps, ceilings, floors, binary gates or mode-specific branches anywhere on the path from a check to the reward. The one floor in the package is a domain rule rather than a scoring device: certificates due are never less than zero, which is what the mechanism says. The structural bucket does not pay for the declared shape returned empty and does not pay for the declared shape filled with invention: each of the six shape checks multiplies its column term by a term asking what each row refers to to exist in the corpus and by a term asking the load-bearing cells to be filled at all, and four of the thirteen are internal-consistency tests that compare the submission only with itself. The memorandum and exhibit length floors are priced as proportions rather than as gates and are scaled by each file's own twelve-word distinctness and by the share of its sentences that name something the corpus holds. Distinctness is measured after every token carrying a digit is normalised to a placeholder, so a sentence pattern repeated with the figures varied to make each line look new counts once rather than once per repetition: measured on this package, genuinely written prose scores 1.00 on that term, prose generated from one sentence template per row scores 0.71, and 200 filler sentences built on one template score 0.03. Per-row ledger, dossier, chain, claim, position and remediation checks are multiplied by the precision of the rows the submission filed, so padding is priced in the same checks it would otherwise buy. An evidence passage grounds only on four conditions together: it is found word for word in the document the row names, it stays inside a sixty word ceiling, it carries a discriminator that identifies the row itself rather than the document the row sits in, and it is not a near duplicate of a passage already accepted for another row. Three checks are keyed to the row rather than to a pool the row sits in, because a figure that is real somewhere is not evidence for the case in hand. Three shortcut sources are scored in two strata with the two accuracies multiplied, the desk export's mass column, the desk export's origin column and the figure each operator prints for its own specific emissions, so copying any of them scores zero rather than the share on which it coincides with the recomputed answer. The fabrication check on the two prose files exempts no band of numbers: identifiers, dates, commodity codes and condition and wave labels are stripped first because they carry digits without being quantities, and every number that survives must match a figure the recomputation produces, where that set includes the counts an honest account would state rather than allowing them by exemption. Measured on this package by rebuilding each submission from the grader's own recomputation and rescoring it: an oracle-identity submission scores 0.9840, and the whole residual is in the two prose checks, where the probe writes from a sentence template rather than as a person would. The same submission with one shortcut applied and everything else left correct: the threshold never run 0.9710, the default table's total column read across where only the direct column is admitted 0.9661, one genuine quote copied down the ledger 0.9508, every quote paraphrased 0.9507, the proofs of origin never opened 0.9507, the export's origin column copied 0.9451, the ledger padded with the export's cancelled rows 0.9436, the export's mass column copied 0.9167, the correspondence never opened 0.9163, no prose and no evidence at all 0.8840, the export's row set trusted as the ledger 0.8769, the operator's own stated figure copied 0.8644, admissibility never tested 0.8454, the verification folder never opened 0.8340, and the precursor chains never walked 0.7767. Two shortcuts were probed directly against the grader after it was hardened against them: one document-level sentence reused as the evidence for every item on that declaration, reworded row by row so an exact-string test cannot see it, takes the two evidence checks from 1.0000 to 0.2466 and 0.2022; and reaching the prose floors with filler sentences carrying invented small whole numbers takes the two length checks from 0.8046 and 0.8767 to 0.0279 and 0.0740. A well-formed submission derived from the machine-readable inputs alone, that is from the desk export, the four registers and the two published default tables without opening a single document, scores 0.2746; a package with every identifier in place and a placeholder in every value column scores 0.3102; an empty submission 0.0196. The rung ladder below each rung recomputes the entire position from what a reader who had settled only that much would believe, so the arithmetic under the belief is never what differs between rungs. Coverage costs more than any single rule: one fifth of the supplier files never opened scores 0.8851, two fifths 0.8215 and three fifths 0.7532."
why_multi_agent = "Nothing can be priced until it is settled whether the operator's own figures may be used at all, and that question cannot be answered inside the folder the communication sits in. entry_summary_export.json is the desk's own hand-maintained system of record and it is not the answer: it lists nine items that were declared and then cancelled before release, it omits eleven items that were released, its net mass column drifts from the declarations on roughly a third of the lines it does carry, its origin column repeats the country of dispatch rather than the country of origin, its procedure column has been overwritten in places, and its emissions column carries whatever figure a supplier last sent rather than anything the desk has derived. A run that works from it scores 0.2746. So each of the 123 goods lines has to be matched to the papers that actually establish it, and those are 204 documents on five house layouts. Four things then exist only above the level of any single supplier file. The verification opinion that decides whether a communication may be relied on is filed under the verification body rather than the operator, and the accreditation register that decides whether that opinion counts at all is neither, so the admissibility of a communication is never decidable from the communication: never opening that folder costs 0.15 of reward and never testing admissibility at all costs 0.14. The precursor rule makes a good carry the emissions of the goods consumed to make it, and those goods were made at other installations in other countries whose own communications have their own verdicts, so a chain of three installations is settled only by reading three folders against each other and an inadmissible link takes the published default for that link alone rather than for the whole chain; not walking the chains costs 0.21. The carbon price claims reach consignments by scheme and period rather than by consignment, so one claim touches several importers at once, a rebate disclosed in a letter filed against neither the claim nor the operator removes it, and one condition on every claim cannot be settled at all until the whole ledger is closed. And the mass threshold is a property of an importer's entire year rather than of any line, so twelve aggregations that each span the whole portfolio decide whether groups of lines generate an obligation at all, and three of the twelve importers fall the quiet side of it. One context reads a few supplier folders closely, takes the export's word for the rest, opens the verification folder unevenly, never walks a chain past its first link and reports a position that is not the position of anything: measured at 0.584 for a run that reads about half the supplier files, misses the correspondence and the proofs, and can only test the two admissibility conditions visible inside a communication, against 0.877 to 0.945 for a run that shards the reading, sends each question to the seat that owns it and computes the portfolio quantities once against a settled book. The work splits into a genuine hierarchy of eight dependency levels: a standing brief, twenty reading seats cut across six folders on three different axes, a scope bench and an assurance bench that each decide a question no reading seat is entitled to decide, a precursor walker that is the only seat holding the whole material graph, a default desk and a pricing bench, a ledger bench that publishes three deliverables the moment they are settled, a portfolio bench that can only run once the ledger is closed, a programme bench that prices what fixing each supplier file would release, and two authors in parallel so the heaviest narrative deliverable is never dropped. Each tier consumes the prior tier's output, so depth is load-bearing: the assurance bench is where the cross-folder question is actually answered, and a flat fan-out over folders cannot answer it at all. The same fan-out run without a plan splits the corpus ad hoc, computes the portfolio quantities inside its shards and scores 0.726."
