  - trial-extraction-batch-8
  - trial-extraction-batch-9
  - trial-extraction-batch-10
  - trial-extraction-batch-11
  - trial-extraction-batch-12
  - trial-extraction-batch-13
  parallel_group: coordinate
  description: >-
    You are the extraction coordinator for the portfolio's reading team. The thirteen
    extraction-batch specialists have each written their rows to
    /workspace/parts/extract_batch1.md through extract_batch13.md. Read all thirteen,
    merge them into one portfolio extraction table, resolve duplicate or conflicting
    rows, and confirm every one of the 52 trials appears exactly once with its
    monitoring-risk fields, its in-scope/exclusion determination and its
    status-divergence flag; call out any trial that is missing or ambiguous. Write the
    single consolidated table to /workspace/parts/extraction_master.md. Do not score or
    schedule.
- id: research-coordinator
  depends_on:
  - gcp-foundations-research-specialist
  - gcp-revision-and-qa-research-specialist
  - methodology-and-framework-research-specialist
  - cfr-regulation-research-specialist
  - registry-and-subjects-research-specialist
  parallel_group: coordinate
  description: >-
    You are the research coordinator for the regulatory-confirmation team. The five
    research specialists have each written a sources_*.md file in /workspace/parts.
    Read all five, merge them into one source register, and confirm every one of the
    twelve authorities S-01 through S-12 is present with a confirmed official-domain
    URL, a retrieval date and the specific requirement or fact it supplies; call out
    any authority that is missing or unconfirmed. Write the single consolidated
    register to /workspace/parts/sources_master.md.
- id: workbook-builder
  depends_on:
  - extraction-coordinator
  - research-coordinator
  parallel_group: assemble
  description: >-
    You are the data engineer who owns the structured monitoring workbook, and the run
    FAILS unless you write it.     Read /workspace/parts/extraction_master.md,
    /workspace/parts/sources_master.md, /input_artifacts/monitoring_rulebook.md and
    /input_artifacts/data_provenance_note.md. For each
    in-scope trial derive the risk score, risk tier, monitoring hours and visit window
    from the rulebook, and build the monitoring schedule by applying the rulebook's
    ranking and weekly CRA-capacity rules, marking each trial schedule_visit (with its
    assigned week), window_infeasible, or defer_capacity. Reconcile against the
    rulebook: out-of-scope trials excluded from the schedule, the overall status
    governing every status conflict, no week over the CRA-hours cap, the source
    register covering every authority in sources_to_confirm.md, and every trial carried
    to an audited decision. Write the workbook directly to /logs/agent/output.xlsx with
    the worksheets trial_risk_scores, monitoring_schedule, conflict_log, exclusion_log,
    capacity_allocation, source_register, audit_log and summary, using the exact column
    headers in the task instruction. Read the file back to confirm it exists and every
    sheet is populated. Do not finish until /logs/agent/output.xlsx exists.
- id: plan-writer
  depends_on:
  - extraction-coordinator
  - research-coordinator
  parallel_group: assemble
  description: >-
    You are the author who owns the written monitoring plan deliverable, and the run
    FAILS unless you write it.     Read /workspace/parts/extraction_master.md,
    /workspace/parts/sources_master.md and /input_artifacts/monitoring_rulebook.md,
    and derive from the rulebook the risk score, tier,
    monitoring hours and monitoring decision (with assigned week) for each in-scope
    trial so your narrative is quantified. Write all twelve sections in order:
    Executive Summary; Background and Portfolio Overview; Methodology and Risk-Based
    Monitoring Rulebook (with the risk formula spelled out); Risk-Tiering
    Determination; Regulated-Intervention and Data-Integrity Analysis; a Trial-by-Trial
    Risk and Monitoring Proofs section with a short, specific, quantified note for
    EVERY in-scope trial (name it by NCT number, give its risk score, tier and
    monitoring decision and assigned week, tie the numbers to the record); Monitoring
    Schedule and CRA Capacity Allocation; Visit-Window and Capacity Infeasibility
    Analysis naming every window_infeasible and deferred trial (especially any
    high-tier trial not monitored this quarter) with a concrete mitigation; Data
    Reconciliation (overall vs site status); Excluded / Out-of-Scope Studies and Data
    Limitations; Recommendations and Mitigations; and Regulatory Basis and Citations.
    Write the whole document directly to /logs/agent/monitoring_plan.md, with no
    placeholder text. Read it back to confirm it is complete. Do not finish until
    /logs/agent/monitoring_plan.md exists.
