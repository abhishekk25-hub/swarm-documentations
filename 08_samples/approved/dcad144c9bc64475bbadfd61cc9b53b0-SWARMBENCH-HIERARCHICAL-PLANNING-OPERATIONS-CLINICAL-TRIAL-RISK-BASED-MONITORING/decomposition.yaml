- id: gcp-foundations-research-specialist
  depends_on: []
  parallel_group: research
  description: >-
    You confirm the foundational good-clinical-practice authorities. Using
    /input_artifacts/sources_to_confirm.md, open the official source for S-01 and S-02
    (ICH E6(R2) GCP and the FDA risk-based-monitoring guidance). For each, confirm the
    specific requirement or fact it supplies, record the URL you actually retrieved on
    the official domain (ich.org, fda.gov), and freeze the retrieval date. Emit a
    source_register block (source_id, authority, requirement_or_fact, source_url,
    retrieved_date, used_in_section) to /workspace/parts/sources_gcp.md.
- id: gcp-revision-and-qa-research-specialist
  depends_on: []
  parallel_group: research
  description: >-
    You confirm the current-revision GCP and operational-Q&A authorities. Using
    /input_artifacts/sources_to_confirm.md, open the official source for S-10 and S-12
    (the FDA risk-based-monitoring Questions and Answers, and ICH E6(R3) GCP). For
    each, confirm the specific requirement or fact it supplies, record the URL you
    actually retrieved on the official domain (fda.gov, ich.org), and freeze the
    retrieval date. Emit a source_register block (source_id, authority,
    requirement_or_fact, source_url, retrieved_date, used_in_section) to
    /workspace/parts/sources_gcp_qa.md.
- id: methodology-and-framework-research-specialist
  depends_on: []
  parallel_group: research
  description: >-
    You confirm the study-design and industry-framework authorities. Using
    /input_artifacts/sources_to_confirm.md, open the official source for S-03 and S-09
    (ICH E8(R1) General Considerations and the TransCelerate BioPharma RBM framework).
    For each, confirm what it supplies, record the URL actually retrieved on the
    official domain (ich.org, transceleratebiopharmainc.com), and freeze the date.
    Emit a source_register block (source_id, authority, requirement_or_fact,
    source_url, retrieved_date, used_in_section) to /workspace/parts/sources_method.md.
- id: cfr-regulation-research-specialist
  depends_on: []
  parallel_group: research
  description: >-
    You confirm the FDA regulation authorities. Using
    /input_artifacts/sources_to_confirm.md, open the official source for S-04, S-05
    and S-06 (21 CFR Part 312 IND, 21 CFR Part 812 IDE, and 21 CFR Part 11 electronic
    records). For each, confirm what it supplies, record the URL actually retrieved on
    the official domain (ecfr.gov, govinfo.gov, accessdata.fda.gov), and freeze the
    date. Emit a source_register block (source_id, authority, requirement_or_fact,
    source_url, retrieved_date, used_in_section) to /workspace/parts/sources_cfr.md.
- id: registry-and-subjects-research-specialist
  depends_on: []
  parallel_group: research
  description: >-
    You confirm the human-subjects, reporting and registry authorities. Using
    /input_artifacts/sources_to_confirm.md, open the official source for S-07, S-08
    and S-11 (FDAAA 801 / 42 CFR Part 11 ClinicalTrials.gov registration and results,
    45 CFR Part 46 the Common Rule, and the NLM ClinicalTrials.gov registry
    documentation). For each, confirm what it supplies, record the URL actually
    retrieved on the official domain (ecfr.gov, govinfo.gov, hhs.gov,
    clinicaltrials.gov), and freeze the date. Emit a source_register block (source_id,
    authority, requirement_or_fact, source_url, retrieved_date, used_in_section) to
    /workspace/parts/sources_registry.md.
- id: extraction-coordinator
  depends_on:
  - trial-extraction-batch-1
  - trial-extraction-batch-2
  - trial-extraction-batch-3
  - trial-extraction-batch-4
  - trial-extraction-batch-5
  - trial-extraction-batch-6
