- id: completion-qa
  description: >
    You are the completion-QA agent. The 20 chapter writers have run; your job is to
    guarantee a complete deck. (1) Audit /logs/agent/chapter_01_slides.json ...
    chapter_20_slides.json: each must exist, be valid JSON, and hold at least one non-empty slide
    with its first slide titled 'Chapter N: <title>'. (2) For any chapter whose file is missing,
    unreadable, empty, or malformed, author it yourself: read that chapter from
    /opt/book_chapters/chapter_NN.txt (fallback /input_artifacts/Principles_Finance.pdf), produce at
    most 5 faithful key-point slides, and write /logs/agent/chapter_NN_slides.json in the required
    shape with the first slide titled 'Chapter N: <title>'. Do not rewrite chapters that are already
    good. (3) Once all 20 chapter JSON files are present and valid, build the deck by running:
    python3 /opt/assemble_deck.py /logs/agent/output.pptx /logs/agent  (4) Verify
    /logs/agent/output.pptx exists, is non-empty, and covers all 20 chapters; if assembly failed or
    a chapter is missing, fix the offending JSON and re-run the command. Do not finish until
    /logs/agent/output.pptx exists and covers all 20 chapters.
  depends_on: [chapter-01, chapter-02, chapter-03, chapter-04, chapter-05, chapter-06, chapter-07, chapter-08, chapter-09, chapter-10, chapter-11, chapter-12, chapter-13, chapter-14, chapter-15, chapter-16, chapter-17, chapter-18, chapter-19, chapter-20]
  parallel_group: finalize
