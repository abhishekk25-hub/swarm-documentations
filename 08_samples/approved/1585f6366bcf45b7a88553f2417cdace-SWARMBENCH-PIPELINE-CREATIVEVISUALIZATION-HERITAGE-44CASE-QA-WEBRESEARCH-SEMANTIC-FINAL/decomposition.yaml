  - id: source-collector
    parallel_group: source_collection
    depends_on:
      - url-candidates-01
      - url-candidates-02
      - url-candidates-03
      - url-candidates-04
      - url-candidates-05
      - url-candidates-06
      - url-candidates-07
      - url-candidates-08
    description: >-
      Collect the external-source evidence for the listed cases in this pipeline stage. Read all
      candidate-source files from /logs/agent/_intermediate and respect the trial limits from the
      main instruction. Save usable candidate snapshots under
      /logs/agent/_intermediate/candidate_sources/{case_id}/ and write
      /logs/agent/url_validation_results.json summarizing usable sources, skipped duplicates,
      unavailable sources, terminal failures, and cases that still lack external evidence. Do not
      spawn subagents. Do not write case memos, final source paths, review files, or package
      files.
      
  - id: url-plan-reducer
    parallel_group: source_planning
    depends_on: [source-collector]
    description: >-
      Read /logs/agent/url_validation_results.json and select the best successful external
      candidate snapshot for each case where one exists. Do not retrieve new sources. Prefer
      candidates that directly support the public-context curator question and include exact
      usable excerpt text. For cases without a successful external source, preserve the terminal
      failure note. Write /logs/agent/external_source_plan.json with one row per case: case_id,
      selected_status, selected_source_url, selected_snapshot_path, selection_reason, and any
      terminal note.

  - id: source-finalizer
    parallel_group: source_finalization
    depends_on: [url-plan-reducer]
    description: >-
      Read /input_artifacts/source_manifest.json and /logs/agent/external_source_plan.json. For
      every listed case, save the official UNESCO starting page at
      /logs/agent/retrieved_sources/{case_id}/unesco_property_page.txt. For each case, copy the
      selected external candidate snapshot or exact excerpt text to
      /logs/agent/external_context/{case_id}/external_context_source.txt. Do not paraphrase,
      summarize, or normalize quote-bearing text. If no usable external source was selected, save
      a clear terminal note at that path. Write
      /logs/agent/_intermediate/source_finalizer_status.json with source status for every case.
      Do not spawn subagents. Do not write case memos, review files, or package files.

  - id: retrieval-auditor
    parallel_group: source_audit
    depends_on: [source-finalizer]
    description: >-
      Use saved sources only. Read the final UNESCO and external-context source files for every
      case plus /logs/agent/external_source_plan.json and the source_finalizer_status file. Write
      /logs/agent/retrieval_audit.json with one row per case for each source type, using the
      fields required by /input_artifacts/output_requirements.md. Record success, terminal
      retrieval notes, source URLs, saved paths, exact excerpts, and comparison notes. Do not
      write case memos or final package files.

  - id: analysis-01
    parallel_group: analysis
    depends_on: [retrieval-auditor]
    description: >-
      Use saved sources only. Analyze WHR-001, WHR-002, WHR-003, WHR-004, WHR-005, WHR-006. Use
      /input_artifacts/source_manifest.json for fixed identity fields such as case_id,
      property_name, state party, UNESCO site id, and listed danger year. Write one case memo per
      case at /logs/agent/case_memos/{case_id}.json using
      /input_artifacts/output_requirements.md. Each memo should answer the curator questions,
      compare UNESCO and external context where available, use exact quotes copied from saved
      snapshots, state safe claim boundaries, and note retrieval limits where a source failed.

  - id: analysis-02
