coordination_pattern: pipeline

orchestrator_notes:
  - Run dependency-ready sub_tasks with the task tool according to this pipeline; do not do retrieval, analysis, QA, repair, or synthesis yourself.
  - The sub_tasks list is closed. Do not create, request, or spawn any additional sub_tasks beyond the IDs listed here. If a listed stage finds issues, pass those issues to the next listed dependent stage through its output file; do not create an ad hoc repair, audit, retry, or helper subagent.
  - Keep the workflow staged: candidate planning, bounded source collection, source finalization, retrieval audit, case analysis, QA, bounded repair, then final reduction.
  - Do not add case facts, hidden answers, themes, or source claims beyond what is available in the main instruction, /input_artifacts/source_manifest.json, /input_artifacts/output_requirements.md, and files created during the run.
  - Respect the retrieval limits in the main instruction. A documented terminal retrieval failure is better than repeated URL variants or repeated attempts at the same failed source.
  - Candidate planning proposes possible public sources only. Source collection prepares saved source snapshots. Analysis and QA use saved source snapshots only.
  - Intermediate files under /logs/agent/_intermediate are coordination aids only; final user-facing outputs must still follow /input_artifacts/output_requirements.md.
  - When a sub_task says "Same role as ...", expand the referenced role requirements in the spawned subagent prompt together with the listed case range and output path. Do not pass an unresolved reference to a subagent.

sub_tasks:
  - id: url-candidates-01
    parallel_group: url_candidates
    depends_on: []
    description: >-
      Read /input_artifacts/source_manifest.json and /input_artifacts/output_requirements.md.
      For WHR-001, WHR-002, WHR-003, WHR-004, WHR-005, and WHR-006, perform source discovery for candidate URLs or source leads that
      could answer the public interpretation, conservation, access/restriction, or teaching-context
      question. Prefer candidate public URLs where possible; clearly label non-URL source leads.
      Use only the provided files and source knowledge at this planning stage; do not retrieve,
      open, browse, fetch, or validate sources in this step. Sources must be outside UNESCO and
      Wikimedia. For each candidate, record case_id, property_name, candidate_url_or_source_lead,
      source_type_goal, reason_for_candidate, and known_risk_or_uncertainty. Write valid JSON to
      /logs/agent/_intermediate/url_candidates_01.json.

  - id: url-candidates-02
