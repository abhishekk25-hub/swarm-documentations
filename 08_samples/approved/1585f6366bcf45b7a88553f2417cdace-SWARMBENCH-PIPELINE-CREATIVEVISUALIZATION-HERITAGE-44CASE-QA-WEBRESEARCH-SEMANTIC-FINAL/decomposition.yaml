      claims, non-exact quotes, unsafe claim boundaries, retrieval-limit notes, and missing exact
      external quotes in curator_questions.what_external_context_changes. If a problem cannot be
      fixed from saved evidence, leave it cautious and record it as unresolved. Update affected
      /logs/agent/case_memos/{case_id}.json files in place, then write
