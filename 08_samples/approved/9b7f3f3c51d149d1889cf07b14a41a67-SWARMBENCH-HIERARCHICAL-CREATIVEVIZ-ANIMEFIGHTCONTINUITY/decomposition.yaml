  - id: segment-manager-3
    parallel_group: manager
    depends_on: [analysis-leaf-act11, analysis-leaf-act12, analysis-leaf-act13, analysis-leaf-act14, analysis-leaf-act15]
    description: >-
      You are the segment-3 manager, responsible for the fight phase spanning acts 11-15. Your five leaf analysts (act11, act12, act13, act14, act15) have each clustered one act and returned bundle_act*.json with per-beat momentum cues. Collect those five bundles and do the segment-level reduction your leaves could not: MERGE their beats into one ordered timeline for this segment by reasoning over the momentum/phase cues (do NOT just stack act11 then act12; beats from different acts interleave), and summarise how the tide of the fight moves across this segment so the director can place it globally. Union the five acts' assignment lists (group labels are already act-unique, so no recap is reassigned). Write /workspace/segment_3.json = {"assignments": [... this segment's recaps ...], "beats": [... this segment's beats in order, each carrying group/attacker/move/callout/momentum/phase ...], "segment_momentum": "how the advantage shifts across this segment"}.

  - id: segment-manager-4
    parallel_group: manager
    depends_on: [analysis-leaf-act16, analysis-leaf-act17, analysis-leaf-act18, analysis-leaf-act19, analysis-leaf-act20]
    description: >-
      You are the segment-4 manager, responsible for the fight phase spanning acts 16-20. Your five leaf analysts (act16, act17, act18, act19, act20) have each clustered one act and returned bundle_act*.json with per-beat momentum cues. Collect those five bundles and do the segment-level reduction your leaves could not: MERGE their beats into one ordered timeline for this segment by reasoning over the momentum/phase cues (do NOT just stack act16 then act17; beats from different acts interleave), and summarise how the tide of the fight moves across this segment so the director can place it globally. Union the five acts' assignment lists (group labels are already act-unique, so no recap is reassigned). Write /workspace/segment_4.json = {"assignments": [... this segment's recaps ...], "beats": [... this segment's beats in order, each carrying group/attacker/move/callout/momentum/phase ...], "segment_momentum": "how the advantage shifts across this segment"}.

  - id: director
    parallel_group: integrate
    depends_on: [segment-manager-1, segment-manager-2, segment-manager-3, segment-manager-4]
    description: >-
      You are the director at the top of the hierarchy. The four segment managers have each returned segment_1.json .. segment_4.json with their segment's ordered beats and a segment_momentum summary. Perform the GLOBAL reduction no single manager could: (1) MERGE the four segments into ONE global fight order by reasoning over their segment_momentum and the per-beat cues (segments and acts are NOT pre-sorted into fight order, so you must interleave them, not chain segment 1 then 2). (2) Resolve the continuity chain across that global order: start at full HP, combo 0, and the full timer, then walk every beat in order, decrementing the defender's HP by each blow and advancing the combo and timer, so each beat's start-state equals the previous beat's end-state regardless of which segment it came from (a per-segment manager cannot compute these absolute values). (3) Union every segment's assignments into the full recap-to-group map. Then render the reconstructed, continuity-resolved beats with the toolkit (render_fight in /input_artifacts/fightkit.py; see instruction.md) to /logs/agent/final.mp4 plus the per-shot clips. Write /logs/agent/output.json = {"assignments": [... all recaps, each exactly once ...], "beats": [{"group": "<label>", "attacker": "A", "move": "uppercut", "callout": "...", "hp_a": 900, "hp_b": 820, "combo": 3, "timer": 88}, ... in GLOBAL fight order]} and /logs/agent/manifest.json (one record per shot: {"order", "group", "clip"}).
