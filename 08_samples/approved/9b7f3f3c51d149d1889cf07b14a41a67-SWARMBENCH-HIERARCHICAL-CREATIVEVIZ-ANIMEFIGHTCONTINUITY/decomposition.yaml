  - id: segment-manager-1
    parallel_group: manager
    depends_on: [analysis-leaf-act1, analysis-leaf-act2, analysis-leaf-act3, analysis-leaf-act4, analysis-leaf-act5]
    description: >-
      You are the segment-1 manager, responsible for the fight phase spanning acts 1-5. Your five leaf analysts (act1, act2, act3, act4, act5) have each clustered one act and returned bundle_act*.json with per-beat momentum cues. Collect those five bundles and do the segment-level reduction your leaves could not: MERGE their beats into one ordered timeline for this segment by reasoning over the momentum/phase cues (do NOT just stack act1 then act2; beats from different acts interleave), and summarise how the tide of the fight moves across this segment so the director can place it globally. Union the five acts' assignment lists (group labels are already act-unique, so no recap is reassigned). Write /workspace/segment_1.json = {"assignments": [... this segment's recaps ...], "beats": [... this segment's beats in order, each carrying group/attacker/move/callout/momentum/phase ...], "segment_momentum": "how the advantage shifts across this segment"}.

