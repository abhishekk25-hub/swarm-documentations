# Hierarchical decomposition — Animated DATA-STORY reels (16 World Bank sections).
#
# Level 0 orchestrator -> 16 reel workers (one per section): fetch country+peer live,
#   derive the story facts, write a faithful narrative, and render that section's reel.
# Level 1 reel worker -> NO task tool; does its own fetch/analysis/writing/rendering.
# Level 2 assembler -> concatenates the 16 records into manifest.json + output.json.
#
# Each section is independent; no computed truths/values appear here (only task inputs).

coordination_pattern: hierarchical

sub_tasks:
  - id: reel-worker-pop_de
    parallel_group: map
    depends_on: []
    description: >-
      WORKER RULES — READ FIRST: You are a leaf-level reel worker. DO NOT use the task
      tool. DO NOT spawn sub-agents. Do all of the work below yourself.
      Fetch LIVE (requires network) the country series:
      https://api.worldbank.org/v2/country/DE/indicator/SP.POP.TOTL?format=json&date=2000:2022&per_page=100
      and the peer (France) series for the same indicator:
      https://api.worldbank.org/v2/country/FR/indicator/SP.POP.TOTL?format=json&date=2000:2022&per_page=100
      Points are in response[1], each {"date":"YYYY","value":<number or null>}; use non-null points.
      From Germany's own series derive, for real: latest_value + latest_year (most recent non-null);
      peak_year (year of highest value); trough_year (year of lowest value); trend_direction
      ("rising"/"falling"/"flat" comparing latest vs earliest, ~2% band); and peer_comparison
      ("higher"/"lower": Germany's latest vs France's latest).
      Write a faithful 150-250 word NARRATIVE telling this series' real story (start/end,
      trend, what happened at the peak and trough years, the France comparison) using the real
      numbers — specific, not generic, nothing the data doesn't show.
      Render an explainer reel to /logs/agent/reels/pop_de.mp4 using Python (matplotlib
      FuncAnimation -> ffmpeg mp4): 7.0-9.0s, genuine motion (the chart grows over 2000-2022),
      >=320px short side, with the country "Germany", the indicator "Total population", the latest value, and
      the story beats (trend, peak/trough year, France comparison) legible on screen.
      Append your record to the shared manifest:
      {"section_id":"pop_de","country":"Germany","indicator":"Total population","latest_value":<num>,
       "latest_year":<int>,"trend_direction":"..","peak_year":<int>,"trough_year":<int>,
       "peer_country":"France","peer_comparison":"..","narrative":"<150-250 words>",
       "reel":"reels/pop_de.mp4"}.
      Confirm with: ls -la /logs/agent/reels/pop_de.mp4

