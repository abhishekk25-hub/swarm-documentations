      Consume your three reader partial CSVs, enforce rulebook closed lists and
      quote discipline, recompute tightness scores, and write
      /logs/agent/coord_uk_ecju.csv for this jurisdiction only.
      Spawn ownership for your readers sits under you; depends_on below is dataflow.
    depends_on:
      - read-uk_ecju-b1
      - read-uk_ecju-b2
      - read-uk_ecju-b3
    parallel_group: coordinators
  - id: interim-assembly
    description: >-
      Concatenate all ten coordinator CSVs into /logs/agent/export_screening_matrix.csv
      with one row per catalog claim and no duplicates. Checkpoint the matrix to disk
      before any synthesis branch runs.
    depends_on:
      - coord-us_itar
      - coord-wassenaar
      - coord-de_bafa
      - coord-ca_eipa
      - coord-in_scomet
      - coord-ie_dual
      - coord-se_isp
      - coord-nz_sgca
      - coord-il_export
      - coord-uk_ecju
    parallel_group: checkpoint
  - id: analyse-class
    description: >-
      Class-audit branch. Consume /logs/agent/export_screening_matrix.csv and the
      rulebook. Re-check each row's control_class against the instrument_family
      recorded for that claim in the catalog and against the rulebook definition
      of that class. Write /logs/agent/class_audit.json with disputed rows.
    depends_on:
      - interim-assembly
      - coord-us_itar
      - coord-wassenaar
      - coord-de_bafa
      - coord-ca_eipa
      - coord-in_scomet
      - coord-ie_dual
      - coord-se_isp
      - coord-nz_sgca
      - coord-il_export
      - coord-uk_ecju
    parallel_group: analysis
  - id: analyse-conflict
    description: >-
      Conflict branch, parallel with analyse-class. Consume the matrix. Form
      crosswalk_group_id values linking the same control_theme across two or more
      jurisdictions, draft reconciliation notes, and draft exception_conflict_ledger
      rows where control classes diverge in a way that would mislead a single global
      compliance claim. Write /logs/agent/conflict_audit.json.
    depends_on:
      - interim-assembly
      - coord-us_itar
      - coord-wassenaar
      - coord-de_bafa
      - coord-ca_eipa
      - coord-in_scomet
      - coord-ie_dual
      - coord-se_isp
      - coord-nz_sgca
      - coord-il_export
      - coord-uk_ecju
    parallel_group: analysis
  - id: write-atlas
    description: >-
      Consume class_audit.json, conflict_audit.json and export_screening_matrix.csv.
      Write the full /logs/agent/jurisdiction_control_atlas.json with per-jurisdiction
      arcs and per-group reconciliation notes, and the final
      /logs/agent/exception_conflict_ledger.csv.
    depends_on:
      - analyse-class
      - analyse-conflict
      - interim-assembly
    parallel_group: writing
  - id: build-charts
    description: >-
      Consume export_screening_matrix.csv, class_audit.json and
      conflict_audit.json. Render the four charts into /logs/agent/
      control_class_distribution.png, tightness_score_histogram.png,
      theme_coverage_by_jurisdiction.png, conflict_density.png and write
      /logs/agent/chart_data.json whose series equal the matrix counts.
    depends_on:
      - analyse-class
      - analyse-conflict
      - interim-assembly
    parallel_group: writing
  - id: compose-briefing
    description: >-
      Final assembly. Consume jurisdiction_control_atlas.json,
      exception_conflict_ledger.csv, chart_data.json, class_audit.json and the
      matrix. Write /logs/agent/counsel_briefing.json with claims_reviewed,
      jurisdictions_covered, control_class_counts, mean_tightness_score,
      highest_tightness_themes, most_conflicted_jurisdiction_pairs,
      regime_comparison, recommended_actions and summary. Do not invent control
      classes the matrix does not support.
    depends_on:
      - write-atlas
      - build-charts
      - analyse-class
      - analyse-conflict
      - interim-assembly
    parallel_group: synthesis
