version: "1.0"
coordination_pattern: "hierarchical"
# depends_on edges record DATAFLOW (who consumes whose artefacts).
# They are not the spawn tree. Spawn ownership is orchestrator ->
# jurisdiction coordinator -> theme-block reader (dag_depth=3).
sub_tasks:
  - id: discover-catalog
    description: >-
      Lock the 180-claim catalog from /input_artifacts/claim_catalog.json, confirm
      the ten jurisdiction source_url values in source_manifest.json, and write
      /logs/agent/catalog_lock.json listing claim_id ranges per jurisdiction.
      Do not fetch instruments yet.
    depends_on: []
    parallel_group: setup
  - id: read-us_itar-b1
    description: >-
      Read US_ITAR claims XCL-0001..XCL-0006 from the catalog. Fetch
      the jurisdiction source_url live. For each claim, locate the passage
      named by locator_hint/focus_prompt, write obligation_paraphrase in your
      own words, copy a verbatim 12-60 word evidence_quote that appears in
      full in the fetched text, assign closed-list classifications from the
      rulebook, compute control_tightness_score, and draft a short note.
      Write /logs/agent/partial_read-us_itar-b1.csv with those rows only.
      Mark the theme absent honestly when the instrument does not speak to it.
    depends_on:
      - discover-catalog
    parallel_group: readers-us_itar
  - id: read-us_itar-b2
    description: >-
      Read US_ITAR claims XCL-0007..XCL-0012 from the catalog. Fetch
