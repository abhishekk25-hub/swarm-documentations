version: '1.0'
coordination_pattern: hierarchical
orchestrator_guidance: 'Optimize for one-pass execution. Dispatch frame--as-of and prep--provision-index together, then dispatch the four cluster leads together. The orchestrator never dispatches a crosswalk--* role: each cluster lead exclusively spawns its own six listed band workers, waits for those six sessions to finish, and returns their completion summary. After all leads return, dispatch the four cluster reducers together, then dispatch reduce--workbook-rows, reduce--unresolved-queue, reduce--lineage-graph and reduce--source-coverage together. Dispatch publish--workbook next and publish--board-package last. Every role has one owner. The orchestrator itself does not retry, respawn, recursively delegate, or redispatch a role; report a failed dispatch once in the final report and never initiate a replacement at the orchestrator level. Each cluster lead retains a bounded, at-most-once-per-worker dispatch allowance for its own six band workers, described in each lead''s own sub-task entry below. Open a downstream stage when its declared dependencies have returned, not by polling or duplicating their work. The orchestrator writes no deliverable, no sub-task may write a deliverable another sub-task owns, and only the four cluster leads spawn sub-agents.'
sub_tasks:
- id: frame--as-of
  parallel_group: prepare
  depends_on: []
  description: 'You own the crosswalk as-of frame and nothing else: confirm the cutoff date 2026-07-30, the twelve iso3 codes and the citation conventions section 4 of /input_artifacts/crosswalk_standard.md governs, then read /input_artifacts/common/mlc_compendium_2026.txt for the ratification date of each of the twelve jurisdictions and /input_artifacts/common/mlc_article22_report_form_2025.txt for the reporting headings a jurisdiction has to answer under, and /input_artifacts/corpus_note.md for the archivist''s account of the staged corpus. Report, as text, the cutoff, the jurisdiction list in csv order with each ratification date, the Article 22 reporting headings, the instrument_id naming rule and what the corpus note records about the staged files. Write no files under /logs/agent and do not spawn sub-agents.'
- id: prep--provision-index
  parallel_group: prepare
  depends_on: []
  description: 'You own the provision-band index and nothing else: read /input_artifacts/provisions_registry.csv and section 2 of /input_artifacts/crosswalk_standard.md, and report the twenty-four band_ids with their provision_id lists and cluster_ids as text. Write no files under /logs/agent and do not spawn sub-agents.'
- id: lead--c1
  parallel_group: root
  depends_on:
  - frame--as-of
  - prep--provision-index
  description: You are the dispatch lead for cluster C1 (minimum requirements for seafarers) and provide dispatch context only. After frame--as-of and prep--provision-index have returned, dispatch exactly the six crosswalk sub-agents for your cluster (crosswalk--c1-b01, crosswalk--c1-b02, crosswalk--c1-b03, crosswalk--c1-b04, crosswalk--c1-b05, crosswalk--c1-b06), one per band sub-task, passing the frame and provision-index results in each dispatch. Wait for all six sessions to finish. You may dispatch any one of your six band sub-tasks a second time, at most once per band sub-task; spawn no other replacements and no further sub-agents. Do not read domestic sources or write shard files. Return one text completion summary naming the six band_ids, the shard files delivered, and any band you dispatched a second time; write no files under /logs/agent.
- id: lead--c2
  parallel_group: root
  depends_on:
  - frame--as-of
  - prep--provision-index
  description: You are the dispatch lead for cluster C2 (conditions of employment) and provide dispatch context only. After frame--as-of and prep--provision-index have returned, dispatch exactly the six crosswalk sub-agents for your cluster (crosswalk--c2-b07, crosswalk--c2-b08, crosswalk--c2-b09, crosswalk--c2-b10, crosswalk--c2-b11, crosswalk--c2-b12), one per band sub-task, passing the frame and provision-index results in each dispatch. Wait for all six sessions to finish. You may dispatch any one of your six band sub-tasks a second time, at most once per band sub-task; spawn no other replacements and no further sub-agents. Do not read domestic sources or write shard files. Return one text completion summary naming the six band_ids, the shard files delivered, and any band you dispatched a second time; write no files under /logs/agent.
- id: lead--c3
  parallel_group: root
  depends_on:
  - frame--as-of
  - prep--provision-index
  description: You are the dispatch lead for cluster C3 (accommodation, food, medical and welfare) and provide dispatch context only. After frame--as-of and prep--provision-index have returned, dispatch exactly the six crosswalk sub-agents for your cluster (crosswalk--c3-b13, crosswalk--c3-b14, crosswalk--c3-b15, crosswalk--c3-b16, crosswalk--c3-b17, crosswalk--c3-b18), one per band sub-task, passing the frame and provision-index results in each dispatch. Wait for all six sessions to finish. You may dispatch any one of your six band sub-tasks a second time, at most once per band sub-task; spawn no other replacements and no further sub-agents. Do not read domestic sources or write shard files. Return one text completion summary naming the six band_ids, the shard files delivered, and any band you dispatched a second time; write no files under /logs/agent.
- id: lead--c4
  parallel_group: root
  depends_on:
  - frame--as-of
  - prep--provision-index
  description: You are the dispatch lead for cluster C4 (compliance and enforcement) and provide dispatch context only. After frame--as-of and prep--provision-index have returned, dispatch exactly the six crosswalk sub-agents for your cluster (crosswalk--c4-b19, crosswalk--c4-b20, crosswalk--c4-b21, crosswalk--c4-b22, crosswalk--c4-b23, crosswalk--c4-b24), one per band sub-task, passing the frame and provision-index results in each dispatch. Wait for all six sessions to finish. You may dispatch any one of your six band sub-tasks a second time, at most once per band sub-task; spawn no other replacements and no further sub-agents. Do not read domestic sources or write shard files. Return one text completion summary naming the six band_ids, the shard files delivered, and any band you dispatched a second time; write no files under /logs/agent.
