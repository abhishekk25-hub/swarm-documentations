  parallel_group: band
  depends_on:
  - lead--c1
  description: 'You own provision band B01 of cluster C1 and nothing else. Start after lead--c1 has provided dispatch context from frame--as-of and prep--provision-index. For every provision_id in the band and every iso3 in /input_artifacts/jurisdictions.csv, read /input_artifacts/mlc_2006_authoritative.txt, /input_artifacts/source_manifest.json, and /input_artifacts/domestic_sources/<ISO3>/ as defined in section 1.4 of /input_artifacts/crosswalk_standard.md, with status assignment governed by section 3, and write /logs/agent/shards/SHARD-C1-B01.json to the contract of section 9.1. Use the dispatch context from lead--c1. Report, as text, per band: cell count, status counts and unresolved count. Touch no file outside your own shard and spawn no sub-agents.'
