version: "1.0"
coordination_pattern: "hierarchical"
orchestrator_guidance: >-
  Each sub-task is dispatched once; at most one retry on hard failure. If a retry fails,
  escalate with the list of judgments or findings still missing rather than redispatching
  recursively. A coder that disagrees with a reviewer escalates rather than filing a second
  version of the same finding, and no sub-task may invent a limb code the standard does not
  print.

sub_tasks:
  - id: lead--group-a
    parallel_group: lead
    depends_on: []
    description: >-
      You are the desk lead for SERBIA and TÜRKİYE.
      Your scope is the eight judgments those two States hold in
      /input_artifacts/respondent_states.json. Dispatch exactly four coder sub-agents, one
      per coder sub-task in your group (coder--a1
      through coder--a4), each owning the two case_ids that sub-task names.
      Dispatch each of your four coders exactly once and spawn no further sub-agents beyond
      those four. Your own output is a short text status naming which of your eight
      case_ids have a findings file under /logs/agent/findings/ and which are missing.
      Write no files yourself and do not restate a coder's findings.

  - id: coder--a1
    parallel_group: code
    depends_on:
      - lead--group-a
    description: >-
      Code the merits findings of these two judgments: 001-243363 and 001-245073.
      Read each judgment at /input_artifacts/judgments/<case_id>.txt in full and write
      /logs/agent/findings/<case_id>.json for each of them, to the field contract in
      section 4 of /input_artifacts/limb_standard.md. Take the findings from that
      judgment's own operative provisions, in the order they appear there. Every finding needs a verdict
      for each limb in its family, the limb it turned on, a quotation of at least
      fifteen words copied exactly from the paragraph that states that outcome with
      that paragraph's number, and a turning point in your own words. Write only your
      two files and do not spawn sub-agents.

