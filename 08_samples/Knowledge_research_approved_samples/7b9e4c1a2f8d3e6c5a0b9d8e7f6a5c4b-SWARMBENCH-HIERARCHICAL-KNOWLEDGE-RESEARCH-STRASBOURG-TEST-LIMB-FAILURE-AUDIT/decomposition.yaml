      - coder--c1
      - coder--c2
      - coder--c3
      - coder--c4
      - coder--d1
      - coder--d2
      - coder--d3
      - coder--d4
      - coder--e1
      - coder--e2
      - coder--e3
      - coder--e4
    description: >-
      Review the coding of every finding under Articles 5 and 6 across all forty delivered
      findings files under /logs/agent/findings/, that is the liberty and fair-trial families of the
      standard. Your scope is those findings wherever they occur, not one State's files.
      For every finding in scope, whether or not you end up changing it, open the judgment
      it comes from and read its assessment under THE LAW before deciding: a verdict you did
      not personally check against that judgment's own text is not reviewed, it is repeated.
      Where a coding does not match the holding, correct that finding in place in its own file and
      leave the quotation and the turning point untouched unless the correction makes them
      wrong about the limb they now name. Touch only findings in your own families. Your
      text output lists, for every finding in scope, whether you checked it and whether you
      changed it - not only the ones you changed. Do not spawn sub-agents.

