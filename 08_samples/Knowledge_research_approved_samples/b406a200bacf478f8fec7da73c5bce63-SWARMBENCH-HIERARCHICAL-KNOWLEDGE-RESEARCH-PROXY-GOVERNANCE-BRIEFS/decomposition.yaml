- id: brief--w01
  depends_on: [lead--slice-1]
  parallel_group: brief-workers
  agent_type: explore
  description: "Brief worker 1. Your slice-1 lead assigns you exactly one company (one ticker). Read the full proxy at /input_artifacts/proxies/<ticker>.txt and write a governance-and-pay brief of that company to /logs/agent/briefs/<ticker>.md in the exact required format (a level-1 heading naming the company and ticker, then the sections Company and meeting; Board and governance structure; Executive compensation design; Pay-for-performance and say-on-pay; Related-party and conflict flags; Shareholder voting takeaway). Cover only the single company your lead assigned you."
