version: "1.0"
coordination_pattern: "hierarchical"

sub_tasks:
- id: lead--slice-1
  depends_on: []
  parallel_group: leads
  agent_type: general
  description: "Slice 1 lead. List /input_artifacts/proxies/ and sort the ticker file names; take the FIRST third of the sorted list as your slice (19 companies). You own brief workers brief--w01, brief--w02, brief--w03, brief--w04, brief--w05, brief--w06, brief--w07, brief--w08, brief--w09, brief--w10, brief--w11, brief--w12, brief--w13, brief--w14, brief--w15, brief--w16, brief--w17, brief--w18, brief--w19; assign each worker exactly one company from your slice (one company per worker) and give it that ticker. Do not read proxies or write briefs yourself; after your workers finish, confirm every brief in your slice exists under /logs/agent/briefs/."
