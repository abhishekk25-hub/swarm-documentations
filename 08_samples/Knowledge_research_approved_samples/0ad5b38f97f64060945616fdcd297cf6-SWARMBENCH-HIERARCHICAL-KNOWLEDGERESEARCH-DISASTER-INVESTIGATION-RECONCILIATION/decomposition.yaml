version: "1.0"
coordination_pattern: hierarchical
sub_tasks:
  - id: reconciliation-lead
    description: >-
      Own the whole reconciliation and delegate it. Dispatch one lane manager for each of the four
      event lanes and do none of the report reading or fact alignment yourself. When every lane
      reports back, read the finished per event files under /logs/agent/reconciliation/ from disk,
      check that each of the eleven events named in the brief has a file and that the files parse,
      and then build /logs/agent/reconciliation_ledger.csv by concatenating one row per unit
      across every event file in the order the units appear, with the header and column meanings
      the brief specifies.
    depends_on: []
    parallel_group: root
  - id: lane-atlantic-major
    description: >-
      Own the atlantic-major lane, which covers these events: ida-2021, harvey-2017, matthew-2016.
      Dispatch one reader for each of the 6 report files in those event directories, wait for the
      readers of an event to finish, then dispatch that event's aligner. Do not read the reports
      or write the event files yourself. Return to your caller only the output path and the count
      of items written, never the contents.
    depends_on:
      - reconciliation-lead
    parallel_group: lanes
  - id: lane-atlantic-northeast
    description: >-
      Own the atlantic-northeast lane, which covers these events: sandy-2012, irene-2011,
      florence-michael-2018. Dispatch one reader for each of the 8 report files in those event
      directories, wait for the readers of an event to finish, then dispatch that event's aligner.
      Do not read the reports or write the event files yourself. Return to your caller only the
      output path and the count of items written, never the contents.
    depends_on:
      - reconciliation-lead
    parallel_group: lanes
  - id: lane-severe-local-storm
    description: >-
      Own the severe-local-storm lane, which covers these events: joplin-tornado-2011,
      table-rock-lake-2018. Dispatch one reader for each of the 6 report files in those event
      directories, wait for the readers of an event to finish, then dispatch that event's aligner.
      Do not read the reports or write the event files yourself. Return to your caller only the
      output path and the count of items written, never the contents.
