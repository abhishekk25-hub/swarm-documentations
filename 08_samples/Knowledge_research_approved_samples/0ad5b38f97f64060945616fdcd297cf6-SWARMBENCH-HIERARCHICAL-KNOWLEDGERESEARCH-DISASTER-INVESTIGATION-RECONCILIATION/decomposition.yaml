  - id: align-ida-2021
    description: >-
      Read every extract file under /workspace/extracts/ida-2021/ and write
      /logs/agent/reconciliation/ida-2021.json, one unit per fact that the reports of this event
      address. Each unit carries the category, a short qualifier line, one entry per report that
      states the fact giving that report's file name, the value as that report frames it and the
      passage copied exactly from that report, then a verdict which is one of agree_exact,
      agree_after_mapping, discrepant or single_source_only, then mapping_arithmetic.
      mapping_arithmetic is a required field whenever the verdict is agree_after_mapping or
      discrepant, and it states the relation connecting the reports' figures rather than listing
      those figures again. Return to your caller only the output path and the count of items
      written, never the contents.
    depends_on:
