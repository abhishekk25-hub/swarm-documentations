version: "1.0"
coordination_pattern: "hierarchical"

sub_tasks:

  - id: lead--g1
    agent_type: general
    parallel_group: leads
    depends_on: [spec--g1-01, spec--g1-02, spec--g1-03, spec--g1-04]
    description: >-
      You are the lead for review group 1. Your specialist lanes (spec--g1-01 through spec--g1-04)
      each author the digests for their assigned releases; you do not re-author their digests. When they
      finish, read across your group's eight digests and write a short group rollup: the recurring radio
      services and licensee classes, the spectrum bands and technical limits that recur, the responsible
      Bureaus, and the split between Report and Order, Memorandum Opinion and Order, Order on
      Reconsideration, and Further Notice actions represented within your eight releases, naming the
      convergences and divergences you see among them and flagging any digest that is thin or ungrounded
      for its lane to fix. Assemble your group's eight register rows (report, rule_subject,
      document_number, fcc_bureau, radio_service, action_type, note_status) from those digests, and hand up
      both your group rollup and your group's rows.

  - id: spec--g1-01
    agent_type: explore
    parallel_group: specialists--g1
    depends_on: []
    description: >-
      Read in full your assigned release record(s) a01, a02 at /environment/input_artifacts/releases/<id>.txt
      and write /logs/agent/output/digests/<id>.md for each, headed with the digest id, the rule subject,
      and the document number, then working through: what the rule is about and which spectrum bands,
      licensee classes, or equipment it reaches, and the radio service it falls under; the kind of
      Commission action taken and the substance of the rules it adopts, including the specific limits,
      eligibility, or obligations; the problem or record the Commission was responding to; and the
      reasoning it gave for the choices it made, plus what sets this rulemaking apart: the proceeding, the rules, the parties, and the figures that anchor it so the digest could not be mistaken for any other release in the batch. Write in your own words grounded only in the assigned
      record; do not copy the record text and do not import anything from outside it.

