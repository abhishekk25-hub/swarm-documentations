[task]
name = "swarmbench/a524d05c08fe427aac66521969c6ab3e-SWARMBENCH-HIERARCHICAL-KNOWLEDGE-RESEARCH-FCC-TELECOMMUNICATIONS-RULEMAKING-DIGEST-REVIEW"
