version: "1.0"
coordination_pattern: "hierarchical"

sub_tasks:

  - id: mgr--g1
    parallel_group: managers
    depends_on: [spec--g1-01, spec--g1-02, spec--g1-03, spec--g1-04, spec--g1-05, spec--g1-06, spec--g1-07, spec--g1-08, spec--g1-09, spec--g1-10, spec--g1-11, spec--g1-12]
    description: >-
      You are the program manager for review group 1, which covers records t01 through t24. Your
      specialist lanes (spec--g1-01 through spec--g1-12) author the individual digests, so you do not write
      those. Your own deliverable is this group's consolidated evidence brief. Read the 24 digests your lanes
      produced alongside the records they cite and write /workspace/group_briefs/g1.md setting out: the coded
      rows for your 24 records (report, sponsor, registry_id, phase, verdict, primary_result, note_status);
      the band the measured effects in this group fall in; the endpoints, comparators and designs that recur
      across it; how the met, missed, mixed and stopped-early read-outs divide within the group; and the
      disagreements you had to settle. Where a lane's verdict or headline figure does not follow from the record
      it cites, reconcile it in the brief against that record's own posted primary-outcome analysis and say what
      you changed and why. Note any record whose digest is too thin to support a coded row. Hand the brief up
      together with your group's digests.

  - id: spec--g1-01
    parallel_group: specialists--g1
    depends_on: []
    description: >-
      Read in full your assigned record(s) t01, t02 at /environment/input_artifacts/trials/<id>.txt and write
      /logs/agent/output/digests/<id>.md for each, headed with the report id, the sponsor or trial name, and
      the registry identifier, then working through: the trial and its population (sponsor, condition, phase,
      and whether it was randomized, blinded, and controlled and against what comparator); the pre-specified
      primary endpoint and key secondary endpoints and the hypothesis they tested; the number randomized, the
      arms and their dosing, the follow-up window, and the stated eligibility; the primary-endpoint effect with
      its confidence interval or p-value and the notable adverse events; and the verdict (met, missed, mixed, or
      terminated). Write in your own words grounded only in the assigned record; do not copy the record text and
      do not import anything from outside it. Where the record is not a primary-efficacy read-out or leaves a
      figure open, say so rather than inventing one.

