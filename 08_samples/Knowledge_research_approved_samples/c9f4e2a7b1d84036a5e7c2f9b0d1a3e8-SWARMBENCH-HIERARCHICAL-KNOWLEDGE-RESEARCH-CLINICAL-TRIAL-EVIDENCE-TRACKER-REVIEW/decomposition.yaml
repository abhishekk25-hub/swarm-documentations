  - id: reduce
    parallel_group: reduce
    depends_on: [mgr--g1, mgr--g2, mgr--g3]
    description: >-
      Take the three group evidence briefs at /workspace/group_briefs/g1.md, g2.md and g3.md together with the
      digests behind them and assemble the two whole-batch deliverables: /logs/agent/output/trial_tracker.csv
      (one row per record with report, sponsor, registry_id, phase, verdict, primary_result, note_status) and
      /logs/agent/output/evidence_review.md reading across all 72 trials, the effect-size band the read-outs land
      in, the endpoints and comparators that recur, the met-versus-missed split, and where trials cluster by
      phase, condition, and verdict, anchoring every thread to the records behind it by report id, sponsor or
      trial name, or registry identifier. Reconcile the three briefs where they characterise the same pattern
      differently, and carry a group's correction through into the tracker rather than overwriting it. Do not
      author missing digests, and mark anything you cannot determine rather than inventing it.
