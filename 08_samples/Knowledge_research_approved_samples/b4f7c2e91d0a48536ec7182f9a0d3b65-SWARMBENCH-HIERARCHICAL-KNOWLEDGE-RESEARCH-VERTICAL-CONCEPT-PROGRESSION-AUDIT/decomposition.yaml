    description: >-
      You are the concept registrar and you own the one decision no reader can take alone.
      Read all sixty draft sheets under /logs/agent/units/ and the provisional slugs the
      twenty readers proposed. Consolidate them into a register of exactly twenty-four
      concepts that satisfies every constraint in section 7 of
      /input_artifacts/articulation_standard.md: 180 observations falling across 24
      concepts, each concept holding four to twelve observations drawn from at least four
      units and at least two grade bands, at least eight concepts reaching three or more
      bands, at least seven drawing on two or more subject clusters, and at least six
      concepts led by each of STEM, HUMANITIES and ARTS. Merge provisional slugs that name
      one idea, and split any slug whose observations turn out to be two different ideas
      that merely share a word, applying the rule in section 2 of the standard against the
      passages the readers actually cited. Your output is the binding register: for every
      one of the 180 observations, the unit_id, its position in that sheet, and the final
      concept_id it must carry, together with an assignment of the twenty-four final
      concept_ids to the six compiler slots, four concepts to each slot. Change no file
      yourself and do not spawn sub-agents.

