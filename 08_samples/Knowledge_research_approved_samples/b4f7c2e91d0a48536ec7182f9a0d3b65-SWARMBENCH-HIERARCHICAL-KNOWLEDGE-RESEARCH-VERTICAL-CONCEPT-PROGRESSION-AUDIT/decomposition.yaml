version: "1.0"
coordination_pattern: "hierarchical"
orchestrator_guidance: >-
  Each sub-task is dispatched once; at most one retry on hard failure. If retry
  fails, escalate with the missing-unit or missing-concept list instead of recursive
  redispatch. The concept register issued by registrar--concepts is binding on every
  downstream sub-task: no sub-task may invent, rename or drop a concept_id after it is
  issued, and a reader that disagrees escalates rather than filing its own label.

sub_tasks:
  - id: mgr--k2
    parallel_group: manage
    depends_on: []
    description: >-
      You are the K-2 band manager. Your scope is the fifteen K-2 units. Dispatch exactly
      five reader sub-agents, one per reader sub-task in your band (reader--k2-01
      through reader--k2-05), each owning the three unit_ids that sub-task names.
      Dispatch each of your five readers exactly once and spawn no further sub-agents
      beyond those five. Your own output is a short text status naming which of the
      fifteen K-2 unit_id draft files exist under /logs/agent/units/ and which are
      missing. Write no files yourself and do not restate a reader's observations.

  - id: mgr--g35
    parallel_group: manage
    depends_on: []
    description: >-
      You are the 3-5 band manager. Your scope is the fifteen 3-5 units. Dispatch exactly
      five reader sub-agents, one per reader sub-task in your band (reader--g35-01
      through reader--g35-05), each owning the three unit_ids that sub-task names.
      Dispatch each of your five readers exactly once and spawn no further sub-agents
