      concept_id with the final concept_id the register assigns to that observation, and
      leave the quote, treatment_note, demand_level and demand_reason as the reader
      wrote them unless the register's merge makes a note wrong about the concept it now
      names, in which case rewrite that note about the same passage evidence. Confirm
      each sheet still carries exactly three observations with three different
      concept_ids. Your text output lists any observation the register did not cover.
