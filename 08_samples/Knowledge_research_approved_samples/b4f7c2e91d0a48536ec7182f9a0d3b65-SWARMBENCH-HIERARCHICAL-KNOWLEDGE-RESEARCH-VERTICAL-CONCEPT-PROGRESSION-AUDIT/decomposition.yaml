    description: >-
      You are the 9-12 band manager. Your scope is the fifteen 9-12 units. Dispatch exactly
      five reader sub-agents, one per reader sub-task in your band (reader--g912-01
      through reader--g912-05), each owning the three unit_ids that sub-task names.
      Dispatch each of your five readers exactly once and spawn no further sub-agents
