  - id: reader--k2-01
    parallel_group: read
    depends_on:
      - mgr--k2
    description: >-
      Own exactly these three units and no others: K2-STEM-01, K2-HUMANITIES-01, K2-ARTS-01.
      Read each unit's own passage in full and deliver one draft unit concept sheet
      per owned unit at /logs/agent/units/<unit_id>.json, following section 3 of
      /input_artifacts/articulation_standard.md. Record exactly three observations
      per sheet, each anchored to a verbatim quotation of fifteen to sixty words
      taken from that unit's own passage file, each carrying a demand_level judged
      from the passage against the section 4 scale rather than from the unit's band,
      and each carrying a treatment_note that says what this passage does with the
      concept. Propose a provisional concept_id for each observation in the slug form
      section 1 fixes, and report your nine proposed slugs in your text output so the
      registrar can reconcile them; expect your slugs to be replaced. Quality gate for
      this 3-unit slice: every quote is verbatim and in range, every summary and note
      names things its own passage actually contains, and no note or reason is reused
      across your three units. Write exactly those three files, write no dossier,
      index or report file, and do not spawn sub-agents.

