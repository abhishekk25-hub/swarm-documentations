    description: >-
      Take the discipline-checked records handed up by the six discipline managers and assemble the two consolidation deliverables: /logs/agent/method_map.jsonld (72 nodes: 6 discipline roots from /input_artifacts/discipline_roots.csv plus one node per report carrying title, discipline and one classified_under edge to its discipline root, with report counts per discipline matching the roster) and /logs/agent/validation_log.json (one truthful entry per report with worker_id, discipline, index_id, series and methods_verified). Consolidate only; do not author missing records.
