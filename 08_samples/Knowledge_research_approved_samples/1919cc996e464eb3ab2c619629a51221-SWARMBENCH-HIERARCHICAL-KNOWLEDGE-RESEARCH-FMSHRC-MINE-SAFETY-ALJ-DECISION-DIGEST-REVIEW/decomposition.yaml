version: "1.0"
coordination_pattern: "hierarchical"

sub_tasks:

  - id: lead--g1
    agent_type: general
    parallel_group: leads
    depends_on: [spec--g1-01, spec--g1-02, spec--g1-03, spec--g1-04]
    description: >-
      Read across the eight completed decision digests in review group 1. Prepare a group rollup that compares
      mine or proceeding types, cited standards, evidence, credibility treatment, applied tests, negligence or
      motivation findings, S&S or unwarrantable-failure results, dispositions, and penalties or remedies.
      Assemble the eight register rows with columns report, case_name, docket, issue_family, disposition,
      penalty_or_remedy, note_status.

  - id: spec--g1-01
    agent_type: explore
    parallel_group: specialists--g1
    depends_on: []
    description: >-
      Read in full the assigned FMSHRC administrative-law decisions f01 and f02 at
      /environment/input_artifacts/decisions/<id>.txt. Write one /logs/agent/output/digests/<id>.md per
      decision, using the required record format. Identify the cited standard or protected activity, the
      condition and decisive testimony or documents, credibility findings, the applied Mine Act test,
      negligence or motivation analysis, S&S or unwarrantable-failure treatment where reached, the
      disposition, and penalty or other remedy. Ground each statement only in its own decision and use
      original prose.

