version: "1.0"
coordination_pattern: "hierarchical"

sub_tasks:

  - id: lead--g1
    agent_type: general
    parallel_group: leads
    depends_on: [spec--g1-01, spec--g1-02, spec--g1-03, spec--g1-04]
    description: >-
      You are the lead for review group 1. Your specialist lanes (spec--g1-01 through spec--g1-04) each author the
      briefs for their assigned opinions; you do not re-author their briefs. When they finish, read across your
      group's eight briefs and write a short group rollup: the granted issues and assigned errors your eight cases
      raise, the standards of review in play, and the affirmed-versus-reversed-versus-remanded split within your
      group, naming the convergences and divergences you see among them and noting any brief that is thin or
      ungrounded in the group rollup. Assemble your group's eight tracker rows (report, accused, docket,
      issue_type, disposition, sentence_relief, note_status) from those briefs, and hand up both your group rollup
      and your group's rows.

  - id: spec--g1-01
    agent_type: explore
    parallel_group: specialists--g1
    depends_on: []
    description: >-
      Read in full your assigned opinion(s) m01, m02 at /environment/input_artifacts/orders/<id>.txt and write
      /logs/agent/output/case_files/<id>.md for each, headed with the report id, the accused, and the docket
      number, then working through: who the accused is and the court-martial forum below; the offenses and charged
      articles of conviction and the sentence adjudged; the granted issue or assigned error the court took up; the
      standard of review it applied and how it reasoned to a result; whether it affirmed, reversed, or set aside
      the findings or sentence, ordered a rehearing or reassessment, or remanded; and any relief it gave the
      sentence, plus what sets this opinion apart: the accused, the articles, the granted issue, and the disposition that anchor it so the digest could not be mistaken for any other order in the batch. Write in your own words grounded only in the assigned opinion; do not copy the opinion text and do
      not import anything from outside it.

