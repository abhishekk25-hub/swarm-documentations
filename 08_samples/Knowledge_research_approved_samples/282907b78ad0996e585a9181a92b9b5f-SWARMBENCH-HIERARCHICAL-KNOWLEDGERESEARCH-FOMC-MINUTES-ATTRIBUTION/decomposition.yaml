version: '1.0'
coordination_pattern: hierarchical
sub_tasks:
- id: orchestrator
  description: >-
    Own the whole assignment end to end. /input_artifacts/claims.csv lists every claim and the
    meeting it belongs to, and there is one lane for each of the eight meetings. The finished
    records are written to /logs/agent/claim_records/ by the lanes, so you never carry a record in a
    message. Your own deliverable is /logs/agent/attribution_matrix.csv, one row per claim and one
    column per participant named anywhere in the finished records, built by reading those records
    back from disk so the marks agree with them exactly. Every claim id in claims.csv must have a
    record file when you finish, and where a lane has left one missing the material to write it is
    on disk under /workspace/parts/. Return only the number of record files present and the matrix
    path.
  depends_on: []
  parallel_group: root

- id: lane_20200129
  description: >-
    Own the 2020-01-29 meeting and the 37 claims that carry that meeting date in
    /input_artifacts/claims.csv. The transcript is
    /input_artifacts/transcripts/fomc-transcript-2020-01-29.txt and the minutes are
    /input_artifacts/minutes/fomc-minutes-2020-01-29.txt, whose attendance list separates the
    participants from the staff. Your eight readers each own a few named participants of this
    meeting and write what they find to /workspace/parts/20200129/ , one file per reader, so their
    findings reach you on disk rather than in a message. Your deliverable is the finished record for
    every one of your 37 claims, written to /logs/agent/claim_records/ and named for the claim id,
    each carrying claim_id, meeting_date, roster and counterpoints, where roster and counterpoints
    hold every entry your readers recorded for that claim across all eight part files with the
    speaker and quotation exactly as the reader wrote them. A claim that no reader supported takes
    an empty list, which is a real answer. Return only the number of records you wrote.
  depends_on: [orchestrator]
  parallel_group: meeting_lanes

- id: reader_20200129_g1
  description: >-
    You cover BARKIN, GEORGE, WILLIAMS at the 2020-01-29 meeting, and nobody else covers them. Read
    their own turns in /input_artifacts/transcripts/fomc-transcript-2020-01-29.txt. Every one of the
    37 claims in /input_artifacts/claims.csv carrying the meeting date 2020-01-29 is yours to judge
    against those participants and only those: for each claim, which of your participants express
    the view the claim describes in their own remarks, and which of them argue against it, doubt it,
    or call the step unnecessary. Write one file, /workspace/parts/20200129/reader_g1.json, holding
    a list of entries, each entry giving claim_id, the surname as the transcript writes it, whether
    it belongs on the roster or the counterpoints, and one quotation copied exactly from that
    participant own remarks at this meeting, applying the standard the brief sets out for what a
    quotation has to be. A participant of yours who supports no claim simply does not appear. Return
    only the number of entries you wrote.
  depends_on: [lane_20200129]
  parallel_group: meeting_readers

