[task]
name = "swarmbench/282907b78ad0996e585a9181a92b9b5f-SWARMBENCH-HIERARCHICAL-KNOWLEDGERESEARCH-FOMC-MINUTES-ATTRIBUTION"
description = "Resolve every hedged attribution in the 2020 FOMC minutes against the verbatim meeting transcripts released in January 2026: for each of 183 claims that report what some unnamed subset of participants held, name the participants whose own remarks carry the view and those who argued against it, each with an exact quotation from the passage that carries it."

[metadata]
verifier_type = "executable"
domain = "knowledge-research"
coordination_pattern = "hierarchical"
secondary_classification = ["long_horizon"]
dag_depth = 3
dag_width = 64
human_solving_hours_estimate = 92.5
human_solving_hours_justification = "The record is eight verbatim FOMC transcripts and their eight sets of minutes, 577318 words in total. Resolving an attribution is close comparative reading rather than skimming, because the minutes paraphrase and never name anyone, so each claim has to be matched to the passage of a participant's own remarks that carries it, and a participant who merely raises the topic has to be told apart from one who asserts the view. At a defensible close-reading rate of 150 words per minute the reading pass alone is 577318 divided by 150 divided by 60, 64.1 hours. Writing the 183 records is locating and transcribing a verbatim passage for each rostered participant, a mean of 6.9 per claim, plus judging who argued the other way, about 8 minutes per claim, 24.4 hours. Reconciling participant naming across meetings and building the attribution matrix from the finished records is about 4 hours. 64.1 plus 24.4 plus 4.0 is 92.5 hours, inside the 80 to 200 hour band for a corpus of this scale."
estimated_sub_agents = 73
input_token_estimate = 788298
why_multi_agent = "The corpus is 788298 input tokens of verbatim transcript across eight meetings and the deliverable is denominated over all 183 claims, and the shipped logs show the single agent failing by collapse of coverage rather than by dishonesty. It wrote all 183 record files but left 114 of them with an empty roster, produced 91 roster entries and 0 counterpoints, and scored 0.001181 at a partial oracle score of 0.0024. The decisive number is that those 91 entries name only 2 DISTINCT participants (WILLIAMS 51, POWELL 40) out of the 18 who speak across the corpus: it fell back on the two people whose names recur throughout every transcript, the Chair and the Vice Chair, and attributed them to claims across all eight meetings. 89 of its 91 quotations were genuinely verbatim, so the failure is not fabrication; it is that one context could not survey seventeen participants per meeting and instead answered from the handful of names it had already seen. The planned multi run instantiated its declared graph, 77 sessions over 73 declared nodes, and partitioned the corpus by PARTICIPANT rather than by claim: 64 readers, each owning two or three named participants of one meeting and judging every claim of that meeting against only those; it reached 887 roster entries across 18 distinct participants, 113 counterpoints and 4 empty records, scoring 0.282989 at a partial oracle score of 0.3571. The split at the participant boundary is what changes: a reader responsible for three speakers can read their turns closely enough to say which claims they carry, which is the survey one context could not afford across seventeen. The unplanned swarm scored 0.138121 with 89 self-organised sessions, writing fewer entries, 408 across 16 participants, and grounding 408 of them verbatim and earning a reward-hacking score of 0.1148 against the planned run's 0.2176. The pre-authored plan earns its place on this corpus by 0.1449, and it does so through the axis of the partition rather than through any guidance about how to read. The plan gives every participant of a meeting to exactly one reader and asks that reader to judge all of that meeting's claims, so each claim is examined by all eight readers of its meeting, each an expert in a few speakers. The unplanned swarm divides by the visible unit instead, the claim, which leaves each of its workers owing an opinion on all seventeen participants and produces the narrower answer, 408 entries against 887. The standard for what counts as support comes from the brief, which all three modes receive equally."
oracle_scoring_rationale = "Scoring compares each submitted record against a hand-authored key covering all 183 claims across the 8 meetings, disclosed under qd_03_1_disclosure in the rubric manifest and held out of the agent image. The denominator is the key over the whole corpus, never what the submission chose to write, so skipping claims cannot raise the score. Each bucket total is its checks passed divided by its checks total, with no per check weighting. The reward is the canonical weighted blend (static * 1 + reward_hacking * 2 + partial_oracle * 3) / 6. A quotation is credited when it is verbatim in that speaker own turns at that meeting, is between 10 and 120 words, shares at least 0.50 of the content words of the SHORTER of itself and the passage the key records, and overlaps that passage span by at least 0.50 of the shorter of the two lengths. The overlap is measured against the shorter side deliberately, because the brief asks for about a sentence and many keyed passages run longer, so a correct short quotation lifted from inside a long keyed passage must not be penalised for covering little of it. Structural and anti-shortcut credit is NOT released by a fixed floor of names. Each claim carries its checks at two coverage levels, half of the keyed roster and all of it, so those two buckets rise in proportion to how much of the keyed roster the submission actually grounds. Every level additionally requires at least one keyed counterpoint to be grounded on claims where the key records opposition. Every keyed entry is scored, both the core and the acceptable tier, so disclosed ground truth is not invisible to the oracle bucket. No gate, multiplier, weight, clamp, min() or max() is applied to any score or to the reward."
reference_link = "https://www.federalreserve.gov/monetarypolicy/fomc_historical_year.htm"

[verifier]
timeout_sec = 900

[environment]
cpus = 4
memory_mb = 16384
build_timeout_sec = 900
