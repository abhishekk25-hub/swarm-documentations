    description: "Read /input_artifacts/trials/NCT02048007/publications/PMC11815404.txt in full, and read no other publication. List every outcome that this one publication reports a result for, with the wording and the instrument it uses, the role it gives the outcome, the heading that establishes that role, and the sentence or whole table row carrying the number, each copied exactly from this file. Write them to /workspace/reads/NCT02048007-PMC11815404.csv and report the file path and the number of outcomes found, nothing else."
