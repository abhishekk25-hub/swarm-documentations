version: "1.0"
coordination_pattern: hierarchical
sub_tasks:
  - id: audit_root
    description: "Own the whole audit. Dispatch one lane coordinator for each of the six trial lanes listed below and do not audit any trial yourself. When every lane reports that its trials are finished, assemble the two deliverables yourself in this node: write /logs/agent/outcome_ledger.csv containing every row from every per-trial file, and write /logs/agent/prespecification_basis.csv containing one row per trial. Read the per-trial files from disk one at a time rather than asking the lane coordinators to pass their contents back in a message."
    depends_on: []
    parallel_group: orchestration
  - id: lane_1
    description: "Coordinate these 4 trials and read nothing yourself: NCT02048007, NCT02944682, NCT03667690, NCT04247009. For each trial dispatch one reader per publication, then dispatch that trial's auditor once its readers have finished. When every trial in the lane is done, confirm each auditor left its file in /workspace/trial_audits/ and report the list of file paths and the row count of each. Report paths and counts only, not file contents."
    depends_on:
      - audit_root
    parallel_group: lanes
  - id: lane_2
    description: "Coordinate these 4 trials and read nothing yourself: NCT02391337, NCT03114917, NCT03869177, NCT04369326. For each trial dispatch one reader per publication, then dispatch that trial's auditor once its readers have finished. When every trial in the lane is done, confirm each auditor left its file in /workspace/trial_audits/ and report the list of file paths and the row count of each. Report paths and counts only, not file contents."
