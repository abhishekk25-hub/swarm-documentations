version: "1.0"
coordination_pattern: hierarchical
sub_tasks:
  - id: root_orchestrator
    description: >-
      Owns the whole engagement. Launches the five appeal lane managers and collects their
      returned record paths and per-pair unit counts. Once every lane reports its pair records
      written, closes the engagement itself rather than delegating further: reads every pair
      record from /logs/agent/pair_records, checks that issue categories and grounds are used
      consistently across pairs (the same kind of ruling coded the same way), fixes inconsistent
      codings in the records on disk, then rebuilds /logs/agent/issues_ledger.csv from the final
      records so the ledger and the records agree row for row, one row per unit with the exact
      column set the brief names. Holds no pair content during the fan-out; every hand-off from
      the lanes is a file path under /logs/agent plus a count.
    depends_on: []
    parallel_group: root
  - id: lane_manager_1
    description: >-
      Manages the appeal pairs dab2738, dab2830, dab2869, dab2913, dab2954, dab3036, dab3094,
      dab3163, dab3210. Spawns one pair analyst per appeal, collects the returned record paths,
      confirms each expected record file exists on disk, and returns to the root only the list of
      paths and per-pair unit counts.
    depends_on: [root_orchestrator]
    parallel_group: lane_managers
  - id: lane_manager_2
    description: >-
      Manages the appeal pairs dab2789, dab2849, dab2874, dab2937, dab2991, dab3040, dab3119,
      dab3185, dab3211. Spawns one pair analyst per appeal, collects the returned record paths,
      confirms each expected record file exists on disk, and returns to the root only the list of
