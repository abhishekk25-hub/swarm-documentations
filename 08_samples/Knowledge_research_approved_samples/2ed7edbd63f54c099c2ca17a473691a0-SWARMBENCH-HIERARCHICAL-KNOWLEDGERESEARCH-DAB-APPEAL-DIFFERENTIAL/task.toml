[task]
name = "swarmbench/2ed7edbd63f54c099c2ca17a473691a0-SWARMBENCH-HIERARCHICAL-KNOWLEDGERESEARCH-DAB-APPEAL-DIFFERENTIAL"
description = "Reconstruct, issue by issue, what the HHS Departmental Appeals Board did to each of 45 ALJ nursing-facility enforcement decisions on review: per-issue rulings and grounds, penalty and immediate-jeopardy trajectories, and the exact language carrying each ruling, from both documents of every appeal pair."

[metadata]
verifier_type = "executable"
domain = "knowledge-research"
coordination_pattern = "hierarchical"
secondary_classification = ["long_horizon"]
dag_depth = 3
dag_width = 45
human_solving_hours_estimate = 120.0
human_solving_hours_justification = "The record is 90 decisions totaling 949583 words. This is close analytical reading, not a single pass: every pair needs its two documents read against each other so that a ruling in the Board decision can be matched to the ALJ passage it reviews, and duration changes and penalty recalculations sit in the body rather than the order paragraph, so nothing can be skimmed at a casual reading rate. A defensible rate for that kind of cross-referencing legal reading is about 150 words per minute, which puts the reading and issue-extraction pass alone at 949583 divided by 150 divided by 60, 105.5 hours. Writing the structured record for each pair, with dockets, dates, route, a three-stage immediate-jeopardy trajectory and three penalty stages whose arithmetic has to be checked, across an average of 6.3 contested-issue units per pair including choosing and verifying two verbatim quotes per unit, is about 15 minutes per pair, 11.25 hours for 45 pairs. Making category and ground codings consistent across 45 pairs once every record exists and rebuilding the ledger from the reconciled records is about 3 hours. 105.5 plus 11.25 plus 3.0 is 119.75, rounded to 120.0 hours, which sits inside the 80 to 200 hour band for an input of this scale."
estimated_sub_agents = 51
input_token_estimate = 1281937
why_multi_agent = "The record is about 1.28 million input tokens across 90 long prose decisions and the deliverable is denominated over every appeal, so coverage under evidence pressure separates the arms, and the shipped logs measure it directly. The single agent stated 177 contested issues across the 45 appeals but grounded only 16 of them in verbatim body passages from both decisions, reaching 16 appeals, and scored 0.165369. The planned multi run instantiated its declared graph exactly, 51 sessions forming one root over five lane managers over 45 pair analysts, each analyst owning both documents of one appeal; it stated 229 issues, grounded 99 across 38 appeals, and scored 0.515516. The split at the appeal boundary is what changes: an analyst holding one pair can quote each ruling from the passage that carries it, while one context spread over ninety documents demonstrably could not, and the root closes by reconciling codings across records it never had to write itself. The unplanned swarm reached 0.533251 with 56 self-organized sessions, grounding 96 passages across 39 appeals, so on this corpus the coordination itself carries the gain and the pre-authored plan does not add materially beyond it."
oracle_scoring_rationale = "Scoring compares the submitted records against a hand-verified key, an intentional and disclosed design choice recorded in the manifest oracle block under qd_03_1_disclosure, covering every appeal pair, built by reading both documents of each pair and validated so that every key quote is verbatim in its source document and every penalty component's rate times days equals its total. The denominator is the key's unit set over the whole corpus, never what the submission chose to write. Preconditions are decoupled rather than shared: a per-unit check credits only that unit, requiring it to align to the contested issue and to carry a Board-side quote found verbatim in the grader's copy of the Board decision and a distinct ALJ-side quote found verbatim in the grader's copy of the ALJ decision, both outside the caption block, with the Board-side quote sharing at least a fifth of the key passage's content words so position alone is never enough; a pair-level field requires one authored unit in that appeal; and the structural shape check requires verbatim grounding and no padding beyond three times the appeal's key issue count. Pair-level facts such as dockets, dates, route and penalties are gated only on the weak, non-positional signal that the record carries one verbatim-grounded unit, so a correct low-effort fact is not zeroed by a failure in the separate, harder skill of per-issue evidence placement; the structural shape check uses the stronger authored-unit signal so it cannot be saturated by decoupled verbatim text. Fields are scored as exact enum or normalized value matches and penalty components by arithmetic-consistent equality against the key. Corpus-wide anti-fabrication checks require grounded evidence scaled to the corpus, at least thirty percent of the appeal count, and the penalty-arithmetic check additionally requires a fifth of submitted penalty blocks to match the key stage for stage, so internal self-consistency alone earns nothing. The 1353 checks sit in three buckets, each scored as the unweighted mean of its own checks and blended on the prescribed fixed weighting of one for static, two for reward hacking and three for partial oracle, divided by six. The static and reward-hacking buckets are denominated per appeal across the whole corpus rather than as corpus-wide booleans, so the 48 static and 50 reward-hacking checks each carry under one percent of the reward. Structural is one sixth and content five sixths. No gate, multiplier, weight, clamp or min() is applied to any score or to the reward, which is bounded to zero and one by construction, and verify.py emits reward.json with the four required bucket fields, content_score, structural_score and a per-check breakdown."
reference_link = "https://www.hhs.gov/about/agencies/dab/decisions/board-decisions/index.html"

[verifier]
timeout_sec = 900

[environment]
cpus = 2
memory_mb = 4096
build_timeout_sec = 900
