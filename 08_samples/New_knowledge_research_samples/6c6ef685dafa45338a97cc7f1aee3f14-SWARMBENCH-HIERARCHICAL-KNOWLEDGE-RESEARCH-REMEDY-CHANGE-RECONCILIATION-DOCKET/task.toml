description = "Reconcile the signed remedy against its later modifications across twenty Superfund site decision dockets so a five year review team can establish the operative remedy at each site, delivering a remedy change register keyed to signed documents, a cleanup level crosswalk normalized across media and units, and a readiness memo naming the sites carrying an unresolved inconsistency between the current remedy and the standards cited for it."

