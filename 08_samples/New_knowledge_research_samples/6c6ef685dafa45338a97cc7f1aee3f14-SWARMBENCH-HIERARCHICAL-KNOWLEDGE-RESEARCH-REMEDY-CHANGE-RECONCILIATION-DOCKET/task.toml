why_multi_agent = "The manifest contains 65 signed decision documents totaling 5,344 source-PDF pages across 20 sites, about 267 pages per site on average. The determinations that decide the result sit in decision-summary narrative, responsiveness summaries and table footnotes rather than in labeled fields, so one context holding the full corpus is likely to lose deferrals, partial substitutions and retired cleanup levels. The hierarchical graph gives every site its own sustained reader, then four cluster leads reconcile five sites each so wording and unit variation surface at a tractable scope. A cohort stage settles one basis-family vocabulary and controlling-value convention across clusters, and the final assembly applies that shared frame back across all sites. The shared frame depends on the first-pass evidence and therefore requires a distinct reconciliation stage."


