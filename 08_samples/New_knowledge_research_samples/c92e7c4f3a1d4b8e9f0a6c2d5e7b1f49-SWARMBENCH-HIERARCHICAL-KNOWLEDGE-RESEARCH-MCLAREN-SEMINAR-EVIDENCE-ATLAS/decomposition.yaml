version: "1.0"
coordination_pattern: hierarchical

hierarchy:
  root_managers: [atlas-manager]
  managers:
    atlas-manager: [corpus-manager, evidence-review-manager, curriculum-manager, final-synthesis-manager]
    corpus-manager: [bibliography-shard-01, bibliography-shard-02, bibliography-shard-03, bibliography-shard-04, bibliography-shard-05, bibliography-shard-06, bibliography-shard-07, bibliography-shard-08, bibliography-shard-09, bibliography-shard-10, bibliography-shard-11, bibliography-shard-12, bibliography-shard-13, bibliography-shard-14, bibliography-shard-15, bibliography-shard-16, bibliography-shard-17, bibliography-shard-18, bibliography-shard-19, bibliography-shard-20, bibliography-shard-21, bibliography-shard-22, bibliography-shard-23, bibliography-shard-24]
    evidence-review-manager: [methods-claims-reviewer, citation-ambiguity-reviewer, theme-boundary-reviewer]
    curriculum-manager: [reading-sequence-curator, diversity-caveat-reviewer]
    final-synthesis-manager: [trajectory-writer, claim-auditor, site-assembler]

sub_tasks:
  - id: atlas-manager
    description: "Coordinate only. Delegate the live-corpus partition to corpus-manager, review to evidence-review-manager, curriculum design to curriculum-manager, and final artifact assembly to final-synthesis-manager. Do not replace their source-grounded work with a generic synthesis."
    depends_on: []
    parallel_group: root-coordination
  - id: corpus-manager
    description: "Retrieve the official publication page, freeze its ordered list for this run, divide it into 24 consecutive non-overlapping slices, and write /logs/agent/corpus_shard_manifest.json. Consolidate the shard outputs into the required /logs/agent/output/corpus_map.csv with canonical/version status and provenance fields. Dispatch one auditor per slice."
    depends_on: [atlas-manager]
    parallel_group: corpus-coordination
  - id: bibliography-shard-01
    description: "Audit SHARD-01 from corpus_shard_manifest.json. Map every assigned official record and write /logs/agent/shard_01.jsonl. Select three distinct canonical works with paper-level sources and draft evidence-card handoffs."
    depends_on: [corpus-manager]
    parallel_group: bibliography-audit
  - id: bibliography-shard-02
    description: "Audit SHARD-02 from corpus_shard_manifest.json. Map every assigned official record and write /logs/agent/shard_02.jsonl. Select three distinct canonical works with paper-level sources and draft evidence-card handoffs."
