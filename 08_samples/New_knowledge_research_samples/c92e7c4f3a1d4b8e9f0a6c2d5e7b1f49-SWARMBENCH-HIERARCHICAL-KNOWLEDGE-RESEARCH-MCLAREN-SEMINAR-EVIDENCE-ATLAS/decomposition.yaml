  - id: bibliography-shard-24
    description: "Audit SHARD-24 from corpus_shard_manifest.json. Map every assigned official record and write /logs/agent/shard_24.jsonl. Select three distinct canonical works with paper-level sources and draft evidence-card handoffs."
    depends_on: [corpus-manager]
    parallel_group: bibliography-audit
  - id: evidence-review-manager
    description: "Combine the 24 shard ledgers, resolve duplicates/version conflicts, and dispatch claim, citation, and theme-boundary review."
    depends_on: [bibliography-shard-01, bibliography-shard-02, bibliography-shard-03, bibliography-shard-04, bibliography-shard-05, bibliography-shard-06, bibliography-shard-07, bibliography-shard-08, bibliography-shard-09, bibliography-shard-10, bibliography-shard-11, bibliography-shard-12, bibliography-shard-13, bibliography-shard-14, bibliography-shard-15, bibliography-shard-16, bibliography-shard-17, bibliography-shard-18, bibliography-shard-19, bibliography-shard-20, bibliography-shard-21, bibliography-shard-22, bibliography-shard-23, bibliography-shard-24]
    parallel_group: evidence-review-coordination
  - id: methods-claims-reviewer
    description: "Own method_comparison_matrix.csv. Review evidence-card method, outcome, causal-boundary, and transferability claims; write the completed matrix and corrected evidence handoffs."
    depends_on: [evidence-review-manager]
    parallel_group: evidence-review
  - id: citation-ambiguity-reviewer
    description: "Review citations and unresolved title/year/DOI/version ambiguity; write correction and disclosure handoffs."
    depends_on: [evidence-review-manager]
    parallel_group: evidence-review
  - id: theme-boundary-reviewer
    description: "Own theme_synthesis.md. Review six proposed themes for overlap, weak classifications, historical coverage, and missing boundary cases, then write the evidence-grounded synthesis."
    depends_on: [evidence-review-manager]
    parallel_group: evidence-review
  - id: curriculum-manager
    description: "Create a preliminary 14-week evidence-card reading sequence and delegate independent sequence and diversity/caveat review."
    depends_on: [methods-claims-reviewer, citation-ambiguity-reviewer, theme-boundary-reviewer]
    parallel_group: curriculum-coordination
  - id: reading-sequence-curator
    description: "Own seminar_plan.md. Write source-backed weekly reading pair relationships, central questions, activities, methodological caveats, and reserve-reading rationales."
    depends_on: [curriculum-manager]
    parallel_group: curriculum-review
  - id: diversity-caveat-reviewer
    description: "Check phase/theme/method diversity, duplicate versions, project concentration, and all weekly caveats."
    depends_on: [curriculum-manager]
    parallel_group: curriculum-review
  - id: final-synthesis-manager
    description: "Compile the final required artifacts only after evidence and curriculum reviews are available."
    depends_on: [reading-sequence-curator, diversity-caveat-reviewer]
    parallel_group: synthesis-coordination
  - id: trajectory-writer
    description: "Write the research trajectory and cross-paper comparisons using reviewed card evidence and the method matrix."
    depends_on: [final-synthesis-manager]
    parallel_group: final-artifacts
  - id: claim-auditor
    description: "Own claim_audit.csv. Audit every substantive claim in research_trajectory.md, theme_synthesis.md, and seminar_plan.md after those artifacts exist, and ensure each claim carries evidence and a calibrated support status."
    depends_on: [trajectory-writer]
    parallel_group: post-trajectory-audit
  - id: site-assembler
    description: "Create the local index.html and validate local links without changing factual research content."
    depends_on: [trajectory-writer, claim-auditor]
    parallel_group: final-assembly
