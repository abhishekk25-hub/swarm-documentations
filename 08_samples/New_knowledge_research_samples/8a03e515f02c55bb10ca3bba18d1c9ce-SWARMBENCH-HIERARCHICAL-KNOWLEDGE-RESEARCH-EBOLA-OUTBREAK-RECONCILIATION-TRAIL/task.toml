[task]
name = "swarmbench/8a03e515f02c55bb10ca3bba18d1c9ce-SWARMBENCH-HIERARCHICAL-KNOWLEDGE-RESEARCH-EBOLA-OUTBREAK-RECONCILIATION-TRAIL"
description = "Read 29 real WHO/UN/UNICEF Ebola situation reports (Sept 2014-June 2016) and 11 real retrospective after-action documents (2015-2020) from the West Africa outbreak; build a quote-grounded situation register of case counts, response capacity, and risk level from the real-time stream, cross-link rows where a retrospective account corroborates or contradicts the contemporaneous reporting, then write a reconciliation dossier and a reporting audit."

[metadata]
verifier_type = "hybrid"
domain = "knowledge-research"
coordination_pattern = "hierarchical"
secondary_classification = ["long_horizon", "long_writing"]
dag_depth = 4
dag_width = 18
human_solving_hours_estimate = 178.5
human_solving_hours_justification = "The real corpus (40 files: 29 real-time WHO/UN/UNICEF Ebola situation reports spanning 18 September 2014 to 10 June 2016, plus 11 real retrospective/after-action documents published between April 2015 and August 2020) totals 218,471 real words (measured at 308,164 tokens via a cl100k_base tokenizer), split 115,514 words of real-time reporting (short, numerically dense weekly/biweekly bulletins -- case counts by country, contact-tracing figures, risk narrative -- averaging under 4,000 words each) and 102,957 words of retrospective analysis (long, argument-dense after-action reports, independent panel findings, and academic reviews, averaging over 9,300 words each). (1) Raw comprehension reading: the real-time stream's short numeric bulletins must be read at a rate that tracks precise week-over-week deltas in case counts, contacts, and prefecture/district-level detail rather than just following prose, which is slower per word than plain narrative despite the short length -- at an effective 75 words/minute that is 115514/75 = 1540.2 minutes; the retrospective stream's longer analytical documents read faster in raw words/minute but require close, careful reading to correctly identify which specific real-time period a given finding or recommendation actually concerns -- at 70 words/minute, 102957/70 = 1470.8 minutes. Reading subtotal: 3011.0 minutes = 50.18h. (2) Register logging: a genuine full extraction of this fact-dense corpus yields substantially more separately loggable content than a coarse per-file rate would suggest -- a real, independently-verified best-effort multi-agent execution's 1021-row register was judged by an independent LLM grader to contain 794 genuinely distinct, non-redundant, quote-verified facts spread across all 40 real files (29 real-time files averaging roughly 17 rows each, 11 retrospective files averaging roughly 48 rows each), confirming this corpus supports close to 800 distinct rows, not merely the ~3.5-per-realtime-file/~7-per-retrospective-file rate a coarser per-file estimate would suggest; logging each -- picking a defensible verbatim quote, correctly identifying the real issuing organization (which changes across the corpus: WHO, UNICEF, UN, Oxfam, MSF, UK House of Commons), classifying into the right of six topic_categories, and writing an accurate one-sentence fact -- takes about 4 minutes per row even for a fast analyst: 800*4 = 3200 minutes = 53.33h. (3) Cross-document reconciliation: the retrospective stream's own claims about 'what was known when' must be checked against the real contemporaneous real-time reports from that same period, which requires re-reading the relevant portions of the real-time stream a second time with a specific comparison question in mind rather than a first-pass extraction question -- an estimated 40,000 words of real-time text re-read at a slower cross-referencing rate of 70 words/minute (40000/70 = 571.4 minutes = 9.52h), plus dedicated verification and drafting time for 26 distinct corroborates/contradicts reconciliation threads (the same real execution run's independently-judged cross-document links confirmed 26 genuine pairs, closely matching this estimate's original ~25-thread assumption; locating the exact corresponding real-time period, comparing exact case-count/risk-framing language, and drafting a defensible corroborates-or-contradicts characterization grounded in both real texts) at 20 minutes each = 520 minutes = 8.67h. Subtotal: 18.19h. (4) Determining cross_document_link per row: distinct from building the general reconciliation picture in (3), the CSV schema requires a genuine determination for EVERY one of the ~800 rows (does this specific row have a real, confirmed counterpart in the opposite stream's already-logged rows, or not); with the register and the threads from (3) already in hand as reference points this check is faster than the initial cross-referencing pass -- 800*2.5 minutes = 2000 minutes = 33.33h. (5) Verification/re-check pass: re-checking every row's supporting_quote against its real source file verbatim, and every declared date and issuing_body against the correct real document, at the standard this reconstruction demands, given the corpus spans two structurally different document types and six shifting issuing organizations -- 7.5h. (6) Outbreak-phase/institutional-memory overhead: correctly holding in mind the real chronology of WHO's own phased response framework, the succession from the 2014 Roadmap situation reports to the 2015-2016 weekly Ebola Situation Report series, and which real organization authored which document, before any row can be logged or linked correctly -- 3.0h. (7) Writing reconciliation_dossier.md (700+ words, citing specific entry_ids and specific corroborates/contradicts threads with both streams' own language and dates) -- 7.0h. (8) Writing reporting_audit.md (400+ words, two sections requiring close reading to correctly identify non-substantive passages and to cite confirmed contradiction pairs distinct from the dossier's own narrative) -- 6.0h. Total: 50.18 + 53.33 + 18.19 + 33.33 + 7.5 + 3.0 + 7.0 + 6.0 = 178.53h ~= 178.5h."
estimated_sub_agents = 28
input_token_estimate = 308164
reference_link = "https://reliefweb.int/attachments/ca55b321-0356-381f-bb00-9c5f8372902a/roadmapsitrep_1Oct2014_eng.pdf"
network_enabled = false
why_multi_agent = "The 40 relevant files span two structurally different real document streams -- 29 short, numerically dense real-time situation reports issued week to week by shifting real organizations (WHO's 2014 Ebola Response Roadmap series, WHO's 2015-2016 weekly Ebola Situation Report series, and several real UNICEF Sierra Leone weekly sitreps), and 11 long, argument-dense retrospective after-action documents published from 2015 through 2020 by a different set of real organizations (WHO's own Interim Assessment Panel, the UN Secretary-General, Oxfam, MSF, the UK House of Commons, and academic reviewers). A single agent working through both streams end-to-end, plus a 700+ word reconciliation dossier and a 400+ word audit, all under one continuous context, is exposed to two related but distinct failure modes this task is designed to expose: (a) losing track of precise week-over-week numeric deltas as 29 short, structurally similar bulletins accumulate -- case counts, contact-tracing figures, and prefecture-level detail drift or get silently conflated across nearby weeks far more easily than in a typical narrative corpus, since every file opens with the same 'EBOLA SITUATION REPORT' masthead and a superficially similar SUMMARY paragraph; and (b) attempting the cross-document reconciliation this task's cross_document_link column requires while still holding the full extraction task in working memory, which risks exactly the kind of superficial pattern-matching this task is built to catch -- linking a retrospective claim to a real-time report merely because they discuss a similar general period, rather than because a genuine re-read of both real source passages confirms the retrospective account genuinely corroborates or genuinely contradicts what was reported in real time. The real corpus contains genuine, well-documented cases where later after-action review found gaps between real-time reporting and actual on-the-ground conditions, not all of which are flagged the same way by every retrospective document, making a naive topic-proximity link systematically wrong on several of them. Splitting each stream into small, word-count-balanced extraction workers (twelve for the real-time stream's 29 short files, six for the retrospective stream's 11 long files, rather than a uniform file count per worker, since a four-thousand-word real-time bulletin and a fifteen-thousand-word retrospective review carry very different amounts of loggable content per file) keeps each worker's numeric-tracking task small enough to hold in context reliably, while a dedicated lead per stream re-verifies quote fidelity and issuing-body attribution against that stream's own files before its rows reach the merged register. A genuine cross-document link is structurally invisible to any single stream-scoped worker or lead, since neither one's assigned files ever contain the other stream's text at all; a dedicated cross_document_reconciliation node with real read access to both streams' verified registers AND both streams' raw source files is required to confirm these, and only after both streams have been independently, carefully processed does genuine cross-document synthesis become possible -- recognizing that a retrospective panel's account of a specific capacity gap in a specific week is corroborated, sharpened, or contradicted by what the real contemporaneous situation report from that same week actually said requires the complete, faithfully-extracted picture across both streams at once, which is exactly what a single sequential read under long-horizon context pressure is least likely to preserve intact by the end."

