version: "1.0"
coordination_pattern: hierarchical

notes: |
  ORCHESTRATOR ROLE RESTRICTION: the top-level orchestrator's only legal actions are (1) read
  its own instruction, (2) call task() to spawn realtime_lead, retrospective_lead, and
  cross_document_reconciliation, (3) await their completion, (4) call task() to spawn
  final_synthesis once cross_document_reconciliation is done, and (5) confirm the three
  required files exist under /logs/agent/ (a bare `ls -la /logs/agent/`) before finishing.
  These four task() calls are the orchestrator's COMPLETE and EXCLUSIVE dispatch budget for
  this run -- no additional ad hoc, corrective, or "fix it myself" dispatch beyond those four,
  however plausible a reason seems in the moment. The orchestrator must NOT itself read any
  file under /input_artifacts/, must NOT itself read or write /workspace/*.json, must NOT
  itself open, grep, word-count, or otherwise inspect the CONTENTS of situation_register.csv,
  reconciliation_dossier.md, or reporting_audit.md (existence-only, via `ls`, is the one
  permitted check), must NOT itself draft any register row or narrative passage, and must NOT
  re-do, second-guess, or issue a follow-up task() call to patch a lead's, cross_document_
  reconciliation's, or final_synthesis's own work -- all real reading, writing, and judgment
  happens inside the four sub-agents it dispatches, never in the orchestrator's own context.

  DISPATCH OWNERSHIP: the top-level orchestrator's OWN direct task() calls are exactly
  realtime_lead, retrospective_lead, cross_document_reconciliation, and (last) final_synthesis
  -- 4 calls total. The orchestrator must NOT itself call any parallel_group: extract entry
  directly. Each extraction worker is dispatched by ITS OWN stream lead, as that lead's first
  action after it is spawned -- this is what makes the hierarchy genuinely four levels deep
  rather than one flat fan-out with an extra label: a lead that never itself calls task() to
  spawn its workers has not actually acted as a manager, regardless of what subagent_type it
  was given.

  FILE-BASED HANDOFF, NOT INLINE TEXT: every lead's verified rows and cross_document_
  reconciliation's confirmed links are each written to a JSON file under /workspace/, never
  returned as inline row-by-row text in a task() reply. final_synthesis MUST still be
  dispatched via its own task() call no matter how much total content the leads produced,
  precisely because that content never needs to pass through the orchestrator's own context
  at all: it sits on disk, and only final_synthesis, once spawned, needs to read it. Each lead
  ALSO writes a nonsubstantive.json file recording the real procedural/boilerplate passages it
  and its workers noticed (WHO/UN publication boilerplate, copyright/disclaimer blocks,
  contact-list footers, repeated methodology paragraphs) -- this is the only channel through
  which final_synthesis, which never reads any raw source file itself, can ground
  reporting_audit.md's Non-Substantive Passages section in real passages instead of inventing
  them. final_synthesis's two narrative deliverables are held to one non-negotiable output
  requirement: every entry_id, source_file, and quote either document cites must correspond to
  an actual row that genuinely exists in the situation_register.csv final_synthesis itself
  writes -- a citation to a register row or source file that isn't really there is the single
  most damaging defect either document can have, more damaging than a thinner but fully
  accurate document would be. Before finishing, final_synthesis must re-read its own
  situation_register.csv, reconciliation_dossier.md, and reporting_audit.md exactly as it
  wrote them and correct any citation that does not hold up -- there is no separate node that
  checks this for you.

  Four-level hierarchy: eighteen extraction workers (twelve covering the 29 real-time WHO/UN/
  UNICEF situation reports, six covering the 11 real retrospective/after-action documents,
  split by real word count into small, tractable batches rather than an arbitrary fixed file
  count) report to their own stream's lead. Each of the two stream leads is responsible for
  spawning and supervising its own workers, then independently re-verifying every row's
  supporting_quote against the real source file. In parallel, a dedicated
  cross_document_reconciliation node is responsible for the one thing no stream-scoped worker
  or lead can do: reading BOTH streams' verified registers side by side (and going back to the
  real source text of both when needed) to find genuine cross_document_link pairs -- cases
  where a retrospective/after-action document's account of what was known at a given time
  either corroborates or contradicts what the contemporaneous real-time situation report(s)
  from that same period actually said. No lead or worker should read the OTHER stream's raw
  files at all -- cross-document correspondence is a reconciliation-stage judgment, made only
  after both streams have already been independently and completely processed; only
  cross_document_reconciliation is allowed to read across the realtime/retrospective boundary.
  The final_synthesis node merges both streams' verified rows into the register (applying
  cross_document_reconciliation's confirmed links, not any worker's or lead's own unconfirmed
  guess at a link), writes reconciliation_dossier.md, and writes reporting_audit.md.

  SUB-TASK DESCRIPTIONS ARE SCOPE-ONLY: every extraction worker's description below states
  WHAT files to read and WHAT to produce (the required row schema), never WHICH specific
  facts, case counts, dates, or analytical conclusions to expect in those files -- discovering
  the actual content, however dense or sparse a given file turns out to be, is exactly the
  work each worker and lead is being asked to do. The same applies to
  cross_document_reconciliation and final_synthesis: their descriptions state the
  reconciliation/synthesis METHOD (read both real sides before confirming a link; ground every
  dossier claim in a real row) without asserting which specific pairs are genuine, which are
  traps, what conclusion the finished dossier should reach, or how many contradictions exist.

sub_tasks:
  - id: realtime_extract_1
    parallel_group: extract
    depends_on: []
    description: >
      Read these 2 real WHO/UN Ebola Response Roadmap situation report files in full, under
      /input_artifacts/realtime/: who_ebola_response_roadmap_update_18_september_2014.txt and
      who_ebola_response_roadmap_situation_report_8_8_october.txt. For every distinct fact you
      find, produce a row with: source_file (the file's REAL path relative to
      /input_artifacts/, INCLUDING the "realtime/" folder prefix, e.g.
      "realtime/who_ebola_response_roadmap_update_18_september_2014.txt"), document_type
      ("realtime"), date (the real date the material concerns, YYYY-MM-DD), issuing_body (the
      real organization that authored this specific document, e.g. "WHO", "UNICEF"),
      topic_category (one of CASE_COUNT_REPORT, RESPONSE_CAPACITY_STATUS, RISK_ASSESSMENT,
      OPERATIONAL_CHALLENGE), key_fact (one sentence), and supporting_quote (copied verbatim
      from the real file text, a real substantive sentence or clause -- never a bare
      boilerplate line like a copyright notice or contact address). Log every distinct fact
      you find as its own row; do not compress two genuinely different facts (e.g. two
      different countries' case counts in the same week, or a case count and a separate
      capacity statement) into a single row just because they appear close together. Do NOT
      fill in cross_document_link yourself -- leave every row's link determination to the
      dedicated cross_document_reconciliation node, which is the only place in this task
      allowed to read the retrospective stream's files. Reply with your candidate rows as
      newline-delimited JSON (NDJSON) and NOTHING else -- no prose before or after, no
      surrounding array brackets or commas between rows, exactly ONE single-line JSON object
      per row with EXACTLY these keys: source_file, document_type, date, issuing_body,
      topic_category, key_fact, supporting_quote, each row's object complete on its own line.
      Use NDJSON specifically rather than one big JSON array: if your reply is ever cut short,
      every already-complete line is still independently parseable, so only the truncated
      final row is lost rather than your entire reply becoming unparseable. Your lead depends
      on parsing this reply programmatically to aggregate all twelve workers' output -- a
      free-text, prose-wrapped, or malformed-JSON reply risks losing rows during that
      aggregation, so strict NDJSON with no surrounding commentary is mandatory. You were
      spawned and are supervised by realtime_lead.

