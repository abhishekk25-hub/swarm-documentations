  - id: cross_document_reconciliation
    parallel_group: reconcile
    depends_on: [realtime_lead, retrospective_lead]
    description: >
      Your job is the one thing no stream-scoped worker or lead can do: you are the ONLY node
      in this task allowed to read both /input_artifacts/realtime/ and
      /input_artifacts/retrospective/ against each other. Start by reading
      /workspace/realtime_verified.json and /workspace/retrospective_verified.json in full.
      For every retrospective row whose real underlying claim concerns a specific real-world
      period (a set of dates, a phase of the outbreak, a specific decision or reporting
      practice), locate the real-time situation report(s) from that same period and read their
      actual real text -- not just the logged key_fact strings -- to determine whether the
      retrospective account genuinely CORROBORATES what was reported in real time, or genuinely
      CONTRADICTS it (e.g. the retrospective document states that a risk, capacity gap, or case
      count was known or should have been apparent at a time when the real contemporaneous
      situation report(s) show WHO/UN/UNICEF's own real-time account said something materially
      different or omitted it). A shared general topic or a merely nearby date is not enough on
      its own; only record a link once the real source text of both files confirms it is
      genuinely about the same underlying period and claim. Every retrospective row that
      genuinely has a real-time counterpart must end up with a recorded link -- a retrospective
      row that was never checked against the real-time stream at all is a gap in this task's
      central, hardest deliverable, distinct from a row that was genuinely checked and found to
      have no real-time counterpart. Write your confirmed cross-document link pairs as a JSON
      array to /workspace/cross_document_links.json (each element: realtime_source_file,
      realtime_supporting_quote, retrospective_source_file, retrospective_supporting_quote,
      relationship -- either "corroborates" or "contradicts" -- and what_the_real_text_shows, a
      short grounded explanation). Identify each linked row by its EXACT supporting_quote
      (copied verbatim from /workspace/realtime_verified.json or
      /workspace/retrospective_verified.json, not a paraphrase or shortened excerpt of it) --
      final_synthesis has not yet assigned entry_ids when you write this file, and an exact
      quote is the only value it can match unambiguously back to the correct row; a paraphrased
      or approximate quote risks final_synthesis matching the wrong row, or no row at all. This
      file, not your text reply, is how final_synthesis will apply real cross_document_link
      values; it is also the evidence base for reporting_audit.md's Realtime-Retrospective
      Contradictions section, not any worker's or lead's own unconfirmed guess. In your own
      final reply, report only the file path and how many confirmed pairs it contains, not the
      pairs themselves. You are a single, self-contained node -- do this reconciliation work
      entirely yourself, directly, inside your own context; do NOT call the task tool to spawn
      any sub-agent of your own for any part of this work, no matter how large either stream's
      verified register turns out to be.

  - id: final_synthesis
    parallel_group: synthesis
    depends_on: [cross_document_reconciliation]
    description: >
      Read /workspace/realtime_verified.json, /workspace/retrospective_verified.json,
      /workspace/cross_document_links.json, /workspace/realtime_nonsubstantive.json, and
      /workspace/retrospective_nonsubstantive.json in full. Merge the two verified registers
