      document_type, date, issuing_body, topic_category, key_fact, supporting_quote,
      cross_document_link. This register's row count must equal the combined row count of
      realtime_verified.json and retrospective_verified.json -- every row from both files is a
      required output, not an optional inclusion; before finishing, count the rows in your
      written CSV against the combined count of the two input files and reconcile any
      difference. For each cross_document_links.json entry, match its realtime_supporting_quote
      and retrospective_supporting_quote to the register rows carrying that exact quote, and set
      each matched row's cross_document_link to the entry_id of its confirmed counterpart row in
      the OPPOSITE document_type (a realtime row's link must point to a retrospective row's
      entry_id, and vice versa); every other row's cross_document_link must be exactly NONE. A
      cross_document_links.json entry whose quote does not match any register row is a
      discrepancy to resolve, not to silently skip. Do not invent a link that
      cross_document_links.json does not support, and do not drop a link it does support. Then write reconciliation_dossier.md
      (at least 700 words) under /logs/agent/: a narrative account of what the real-time
      reporting stream said, week by week, about case counts, response capacity, and risk
      level, and how that account holds up against the retrospective/after-action documents'
      own later assessment of the same periods -- explicitly citing specific entry_ids, dates,
      and source_files for every substantive claim, and explicitly working through the
      genuine corroborates/contradicts pairs cross_document_reconciliation confirmed, not just
      a per-stream summary written one after another. EVERY specific number in this document --
      a case count, a death toll, a count of confirmed cross-document links, a count of
      contradictions -- must be one you can point to directly in a register row's own key_fact/
      supporting_quote or in cross_document_links.json itself; never state a summary statistic
      (e.g. "12 cross-document links were confirmed") that you have not actually counted from
      those files, and never round, estimate, or reconstruct a number from memory of what you
      expect the corpus to contain. Then write reporting_audit.md (at least 400 words) under
      /logs/agent/ with exactly two headed sections: one titled to clearly indicate
      "Non-Substantive Passages" (grounded in the two nonsubstantive.json files -- cite specific
      real passages and source_files, do not invent examples) and one titled to clearly indicate
      "Realtime-Retrospective Contradictions" (drawing ONLY on cross_document_links.json entries
      whose relationship field is exactly "contradicts", citing each by its real
      realtime_source_file and retrospective_source_file pair, distinct from whatever
      reconciliation_dossier.md already narrated in its own prose -- do not just repeat the
      dossier's own sentences here). If cross_document_links.json contains few or no
      "contradicts" entries, write a shorter, honest section that says so rather than inventing
      additional contradiction pairs to fill space -- a fabricated contradiction in this section
      is a more severe defect than an honest shortfall. Before finishing, re-read your own three output files
      exactly as you wrote them and confirm every entry_id, source_file, and quote either
      narrative document cites truly exists in situation_register.csv as you wrote it --
      correct any citation that does not hold up. You are the final node in this task; no
      other node checks your work after you finish.
