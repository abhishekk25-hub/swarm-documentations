version: "1.0"
coordination_pattern: "hierarchical"

notes: |
  ORCHESTRATOR ROLE RESTRICTION: the orchestrator's only legal actions are (1) read its own
  instruction, (2) write /workspace/routing.md from disaster_index.csv splitting each domain's
  23 disasters into lanes of two (the last lane of a domain holding one), (3) call task() to
  spawn the six domain managers, (4) await their completion, (5) call task() to spawn
  cross_industry_pattern_reconciliation once all six managers are done, (6) call task() to spawn
  final_synthesis once the managers and the reconciliation node are both done, and (7) confirm
  the four required deliverables exist under /logs/agent/ (existence-only, via ls) before
  finishing. That is the orchestrator's complete and exclusive task() budget for this run --
  exactly eight task() calls (six managers, one reconciliation, one synthesis), no more, no
  fewer, and no additional ad hoc or corrective dispatch. The orchestrator must NOT itself read
  any file under /input_artifacts/corpus/, must NOT itself read or write any /workspace/shards/
  file, must NOT itself inspect the CONTENTS of any record, the register, the synthesis, or the
  taxonomy file, and must NOT re-do or second-guess a manager's, the reconciliation node's, or
  final_synthesis's own work -- all real reading, writing, and judgment happens inside the
  sub-agents it dispatches.

  DISPATCH OWNERSHIP: the orchestrator's own direct task() calls are exactly the six domain
  managers, then cross_industry_pattern_reconciliation, then final_synthesis -- eight calls
  total. The orchestrator must NOT itself call any parallel_group: specialists entry directly.
  Each domain manager dispatches its own lanes as its first action after being spawned -- a
  manager that never calls task() to spawn its own lanes has not acted as a manager, regardless
  of what subagent_type it was given. This is what makes the hierarchy genuinely three levels
  deep (orchestrator -> manager -> specialist lane) rather than one flat fan-out with an extra
  label.

  FILE-BASED HANDOFF: every specialist lane writes one shard JSON file per disaster it owns
  under /workspace/shards/<slug>.json, never returning its findings as inline text in its
  task() reply -- a manager overseeing twelve lanes covering twenty-three disasters cannot hold
  all of that content in its own context and should not try to. cross_industry_pattern_reconciliation
  and final_synthesis both read shards directly from disk, not through any manager's own reply
  text.

  CROSS-INDUSTRY SCOPE: no domain manager and no specialist lane may read another domain's
  corpus files or shards, and none may determine a cross_industry_link -- every specialist
  writes cross_industry_link as an implicit absence (the field simply is not part of a shard;
  final_synthesis fills it in later using only cross_industry_pattern_reconciliation's own
  confirmed output). cross_industry_pattern_reconciliation is the ONLY node in this task
  allowed to read shards from more than one domain against each other, and it must confirm a
  genuine shared MECHANISM (not just a shared causal_pattern label) by reading both disasters'
  own real source dossiers before recording a link -- a shared category name alone is not
  sufficient grounds for a link.

  SUB-TASK DESCRIPTIONS ARE SCOPE-ONLY: every specialist lane's description states WHAT
  disasters to read and WHAT to produce (the record and shard schema), never WHICH specific
  causal patterns, facts, or classifications to expect -- discovering the real causal chain and
  which patterns genuinely apply is exactly the work each lane is being asked to do. The same
  applies to cross_industry_pattern_reconciliation and final_synthesis: their descriptions state
  the reconciliation/synthesis METHOD without asserting which specific cross-industry links are
  genuine or what the finished synthesis should conclude.

  SPECIALIST LANE CONTRACT (applies to every spec--* sub_task below, referenced rather than
  repeated in each one): for each disaster you own, read its full source dossier in
  /input_artifacts/corpus/, together with /input_artifacts/causal_pattern_taxonomy.md for the
  exact record contract and the eight causal pattern definitions with their worked examples,
  then write a faithful causal-chain record at /logs/agent/records/<slug>.md: a level-1 heading
  with the real disaster name, an Identity section (real date, real location, industry_domain,
  and real toll/QID where the source states one), a Causal chain section with five labeled
  parts (Root cause, Contributing factors, Failure point, Consequence, Reform triggered)
  specific to this disaster and grounded in its own dossier, and a Causal pattern
  classification section naming which of the eight patterns genuinely apply (REGULATORY_CAPTURE_OR_WEAK_OVERSIGHT, MAINTENANCE_DEFERRAL_OR_NEGLECT, DESIGN_OR_ENGINEERING_FLAW, OPERATOR_OR_HUMAN_ERROR, COST_CUTTING_UNDER_COMMERCIAL_PRESSURE, CASCADING_OR_COMMON_MODE_FAILURE, IGNORED_PRIOR_WARNINGS_OR_TESTS, INADEQUATE_SAFETY_CULTURE_OR_TRAINING),
  each with one real, exact, substantive supporting quote copied from this disaster's own
  source dossier. Do not assign a pattern the source doesn't actually support, and do not write
  a causal chain generic enough to describe a different disaster equally well. Also write each
  disaster's shard at /workspace/shards/<slug>.json as a JSON object with disaster_slug,
  disaster_name, industry_domain, real_date, worker_id (naming you as the specialist that
  produced it), and patterns (an array of objects, one per applicable causal pattern, each with
  causal_pattern, key_finding, and supporting_quote matching what you wrote in the record). Do
  not read any other domain's corpus files, and do not determine any cross_industry_link -- that
  field does not belong in your shard at all; it is filled in later by
  cross_industry_pattern_reconciliation and final_synthesis, which you have no visibility into.

  MANAGER LANE CONTRACT (applies to every mgr--* sub_task below): do not read any corpus file or
  write any record or shard yourself. Your FIRST action must be to call the task tool yourself
  (subagent_type: explore) to spawn your own 12 specialist lanes, each already assigned its one
  or two disasters -- do not proceed as if their output already exists; you are the one who must
  produce it by dispatching all of them yourself, exactly once each. Wait for all 12 to finish,
  then confirm that a record and a shard exist for every one of your 23 disasters. If a record
  or shard is still missing for one of your disasters, you may dispatch one replacement
  specialist for that disaster, and only one; report anything still missing after that in your
  status instead of dispatching again. Do not read another domain's corpus files or shards, and
  do not determine or guess at any cross_industry_link -- that is exclusively
  cross_industry_pattern_reconciliation's job, since you have no visibility into any other
  domain. In your own final reply, report only which of your 23 disasters have a record and
  shard present, not their contents.

