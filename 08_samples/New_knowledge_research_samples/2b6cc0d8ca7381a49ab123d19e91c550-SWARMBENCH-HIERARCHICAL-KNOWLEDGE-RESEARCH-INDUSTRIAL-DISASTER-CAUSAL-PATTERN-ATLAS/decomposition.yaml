  - id: cross_industry_pattern_reconciliation
    parallel_group: reconcile
    depends_on: [mgr--mining, mgr--maritime, mgr--aviation, mgr--structural, mgr--chemical, mgr--rail]
    description: >-
      Your job is the one thing no domain manager or specialist lane can do: you are the ONLY node in this task allowed to read shard files from more than one industry_domain against each other, and the only node allowed to read corpus files from more than one domain. Start by reading every shard under /workspace/shards/ (all 138). For every pair of pattern entries (one shard's pattern entry, one from a DIFFERENT industry_domain's shard) that plausibly share a causal_pattern label, confirm whether they genuinely share the same underlying MECHANISM -- not just the same category name -- by reading BOTH disasters' own real source dossiers in /input_artifacts/corpus/ yourself before recording a link; a shared label or a superficially similar outcome is not enough on its own. Only record a link once both real dossiers confirm the underlying mechanism is genuinely comparable. Write your confirmed cross-industry link pairs as a JSON array to /workspace/cross_industry_links.json (each element: disaster_slug_a, disaster_slug_b, causal_pattern, industry_domain_a, industry_domain_b, what_makes_the_mechanism_genuinely_the_same) -- this file, not your text reply, is how final_synthesis will apply real cross_industry_link values and is the evidence base for cross_industry_synthesis.md. Never link two shards from the SAME industry_domain to each other. In your own final reply, report only the file path and how many confirmed pairs it contains, not the pairs themselves. You are a single, self-contained node -- do this work entirely yourself; do NOT call the task tool to spawn any sub-agent of your own.

  - id: final_synthesis
    parallel_group: synthesize
    depends_on: [mgr--mining, mgr--maritime, mgr--aviation, mgr--structural, mgr--chemical, mgr--rail, cross_industry_pattern_reconciliation]
    description: >-
      This sub-task MUST be dispatched via its own task() call -- the orchestrator must NOT do this merge work itself inline. Your own first action is to read every shard under /workspace/shards/ (all 138) and /workspace/cross_industry_links.json directly from disk, before writing anything. Assemble /logs/agent/causal_pattern_register.csv with a single consistent set of entry_ids (assign entry_ids first, then resolve cross_industry_link values using cross_industry_links.json's disaster_slug citations to find the matching rows), exactly these column headers: entry_id, disaster_slug, disaster_name, industry_domain, real_date, causal_pattern, key_finding, supporting_quote, cross_industry_link -- one row per pattern entry across all 138 shards, cross_industry_link exactly NONE for every row that cross_industry_pattern_reconciliation did not confirm a link for. Every entry_id, disaster_slug, and quote you cite anywhere in the two documents below must be looked up against this register as you write it -- an entry_id or disaster_slug that is not really a row in the register you just assembled must never appear in either document, since citing a row that does not exist is the single most damaging defect either document can have. Then write /logs/agent/cross_industry_synthesis.md, at least 900 words, organized by causal pattern rather than by industry, naming specific disasters and entry_ids, working through every genuine cross-industry link cross_industry_pattern_reconciliation confirmed, and explicitly noting any pattern that looks like it recurs but whose underlying mechanism actually differs across the cases (a false cognate) rather than forcing a connection. Finally write /logs/agent/pattern_taxonomy.json: a JSON object with exactly these eight keys (REGULATORY_CAPTURE_OR_WEAK_OVERSIGHT, MAINTENANCE_DEFERRAL_OR_NEGLECT, DESIGN_OR_ENGINEERING_FLAW, OPERATOR_OR_HUMAN_ERROR, COST_CUTTING_UNDER_COMMERCIAL_PRESSURE, CASCADING_OR_COMMON_MODE_FAILURE, IGNORED_PRIOR_WARNINGS_OR_TESTS, INADEQUATE_SAFETY_CULTURE_OR_TRAINING), each mapped to the array of entry_ids from your own register that carry that pattern -- every entry_id in the register must appear under its own pattern's array here, and no entry_id may appear that is not a real register row.
