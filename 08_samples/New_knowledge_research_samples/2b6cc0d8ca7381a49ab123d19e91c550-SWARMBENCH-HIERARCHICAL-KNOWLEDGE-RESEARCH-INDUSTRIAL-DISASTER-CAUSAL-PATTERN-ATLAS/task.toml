[task]
name = "swarmbench/2b6cc0d8ca7381a49ab123d19e91c550-SWARMBENCH-HIERARCHICAL-KNOWLEDGE-RESEARCH-INDUSTRIAL-DISASTER-CAUSAL-PATTERN-ATLAS"
description = "Read 138 real staged Wikipedia source dossiers (~854K tokens) spanning six disaster industries and write one causal-chain record per disaster classified against a fixed eight-pattern taxonomy, then assemble a cross-industry pattern register, a synthesis of genuinely shared failure mechanisms, and a machine-checkable taxonomy file. A hybrid verifier scores source-grounding, pattern accuracy, and cross-industry link genuineness."

[metadata]
verifier_type = "hybrid"
domain = "knowledge-research"
coordination_pattern = "hierarchical"
secondary_classification = ["long_writing", "long_horizon"]
dag_depth = 3
dag_width = 72
human_solving_hours_estimate = 135.7
human_solving_hours_justification = "The 138 real source dossiers (built from full English Wikipedia articles on major industrial and infrastructure disasters, six industries: mining, maritime, aviation, structural engineering, chemical/industrial plants, rail) total 3,415,907 characters / 548,981 real words (measured at 853,976 tokens via a cl100k_base-style ~4 chars/token estimate). (1) Raw comprehension reading: a competent analyst reading closely enough to identify the actual root cause, contributing factors, failure point, consequence, and any reform each disaster's own real account documents -- not just skimming for the disaster's name and toll -- reads prose this dense at an effective 150 words/minute: 548981/150 = 3659.9 minutes = 61.0h. (2) Writing 138 causal-chain records (identity block, five-part causal chain specific to that disaster, and a defensible causal-pattern classification with a real supporting quote for each of the ~2-3 patterns that genuinely apply) at about 12 minutes per disaster even for a fast analyst: 138*12 = 1656 minutes = 27.6h. (3) Assembling causal_pattern_register.csv and verifying each row's quote against its real source dossier -- at an estimated 2.3 pattern entries per disaster (317 rows) and 2 minutes per row (locate the row's real supporting quote, cross-check it verbatim, confirm the pattern fit): 317*2 = 634 minutes = 10.57h. (4) Cross-industry pattern reconciliation: rather than blindly re-reading the full corpus a second time, a competent analyst uses the register as an index to identify plausible same-pattern candidate pairs across different industries and investigates each by reading both real dossiers side by side to confirm or reject a genuine shared mechanism -- an estimated 65 candidate pairs evaluated (both genuine links and rejected false cognates) at 15 minutes each: 65*15 = 975 minutes = 16.25h. (5) A distinct pass reviewing every one of the 317 register rows for cross-industry pattern-cluster candidacy before the deeper investigation in (4) can even target the right pairs, at 1 minute per row: 317 minutes = 5.28h. (6) Writing cross_industry_synthesis.md (900+ words, organized by causal pattern, naming specific disasters and entry_ids, distinguishing genuine shared mechanisms from same-label false cognates) -- 6.5h. (7) Assembling and validating pattern_taxonomy.json against the finished register (no orphaned or missing entry_ids across all eight pattern arrays) -- 2.5h. (8) A dedicated verification/re-check pass re-checking every row's supporting_quote against its real source dossier verbatim, and every declared date, industry_domain, and cross_industry_link against the correct real record -- 6.0h. Total: 61.0 + 27.6 + 10.57 + 16.25 + 5.28 + 6.5 + 2.5 + 6.0 = 135.7h."
estimated_sub_agents = 80
input_token_estimate = 853976
reference_link = "https://en.wikipedia.org/wiki/List_of_industrial_disasters"
network_enabled = true
why_multi_agent = "Written after reading the real single-opencode-agent, multi-opencode-agent, and multi-opencode-agent-noplan trajectories. The observed SA failure mode was not gradual fatigue drift -- the SA agent (moonshotai/Kimi-K2.6) explicitly recognized the 138-disaster scale as intractable to process by individually reading and reasoning about each dossier, and at step 7 of 84 total wrote its own keyword/regex extraction script (process_corpus_advanced.py) to mechanically scan every corpus file for taxonomy-keyword matches instead. This shipped as final output: 46/138 records (33%) contained literal placeholder text ('[See source dossier for specific root cause]') where the regex found nothing, one record's 'Failure point' field was literally the cited disaster's own corpus-file header line, and check_reward_hacking_3_no_near_duplicate_patterns measured only 8% genuine distinctness among the register's rows (17/223 credited) -- confirming the register was padded with near-duplicate, low-effort entries rather than genuinely distinct findings. The realized multi-opencode-agent trajectory shows this is a genuine, structurally-necessary split rather than a re-labeled flat fan-out: the orchestrator issued exactly its budgeted 8 direct task() calls (6 domain managers + reconciliation + synthesis), and all 6 managers independently spawned their own 12 specialist lanes each (72 total, matching dag_width exactly) with zero dropped dispatches -- a genuine depth-3 hierarchy the orchestrator itself never touches corpus files or shard contents in. Splitting into 72 word-count-balanced specialist lanes (12 per domain, 1-2 disasters each) keeps each lane's disaster-specific causal-chain writing small enough to hold in context reliably, which check_reward_hacking_7_identity_section_grounded (0.99) and the zero-contamination check_reward_hacking_6_no_placeholder_or_artifact_leakage score (1.00, once a verifier false-positive on the required Wikidata QID field was fixed) confirm the specialist lanes achieve even when the same model's unguided single-context attempt could not. A genuine cross-industry link remains structurally invisible to any single domain manager or specialist lane, since none of their assigned disasters ever contain another domain's text at all; a dedicated cross_industry_pattern_reconciliation node with real read access to every domain's verified shards AND every domain's raw source dossiers is required to confirm these (11 genuine links confirmed in the realized MA run, precision 1.00), and only after every domain has been independently and completely processed does genuine cross-industry synthesis become possible."

[agent]
timeout_sec = 5400

