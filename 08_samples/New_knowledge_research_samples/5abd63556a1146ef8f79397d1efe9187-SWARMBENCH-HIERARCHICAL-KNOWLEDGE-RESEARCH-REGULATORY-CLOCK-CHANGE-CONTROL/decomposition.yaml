version: "1.0"
coordination_pattern: "hierarchical"

# Forty-eight readers produce disjoint casefiles. Six portfolio managers then review
# eight reader outputs each and hand corrected payloads to the final editor.
sub_tasks:
  - id: portfolio-1
    subagent_type: general
    parallel_group: portfolio_managers
    depends_on: [read-rcc-001, read-rcc-002, read-rcc-003, read-rcc-004, read-rcc-005, read-rcc-006, read-rcc-007, read-rcc-008]
    description: >
      Review the completed reader outputs for records RCC-001, RCC-002, RCC-003, RCC-004, RCC-005, RCC-006, RCC-007, RCC-008. Open every returned casefile and its
      frozen source, check quotation round-trips, clock chronology, predecessor citations,
      scope boundaries, narratives, and exception flags, and directly repair or reauthor
      anything incomplete or unsupported. Do not merely count defects and do not relaunch a
      specialist that completed successfully. Write every corrected casefile back to
      /logs/agent/casefiles/<record_id>.json, then write
      /workspace/portfolio_reviews/portfolio-1.json with all eight corrected casefile payloads,
      per-record review findings, and a portfolio synthesis draft for the final editor.

  - id: read-rcc-001
    subagent_type: explore
    parallel_group: readers_1
    depends_on: []
    description: >
      Reconcile only RCC-001 (2026-15192). Read its catalog row, the change-control
      rulebook, and its own frozen source. Write the complete grounded casefile to
      /logs/agent/casefiles/RCC-001.json with correct chronology, affected scope, action class,
      predecessor citations, flags, distinct narratives, and three to seven contiguous
      evidence passages. Return the full payload to the owning portfolio manager. Do not
      open or write another record.

