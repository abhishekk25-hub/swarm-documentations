[task]
name = "swarmbench/5abd63556a1146ef8f79397d1efe9187-SWARMBENCH-HIERARCHICAL-KNOWLEDGE-RESEARCH-REGULATORY-CLOCK-CHANGE-CONTROL"
description = "Reconcile 48 recent Federal Register effective, applicability, and compliance-date changes into grounded casefiles, a chain-aware register, a fixed exception population, an operational briefing, and an accessible data-backed SVG atlas."

[metadata]
verifier_type = "hybrid"
domain = "knowledge-research"
coordination_pattern = "hierarchical"
secondary_classification = ["long_horizon", "long_writing"]
network_enabled = false
dag_depth = 3
dag_width = 48
estimated_sub_agents = 71
input_token_estimate = 1247776
high_level_prompt_word_count = 195
human_solving_hours_estimate = 140.0
human_solving_hours_justification = "READING: 48 heterogeneous Federal Register documents total 4,991,104 extracted characters (about 1,247,776 tokens). At 90 minutes per record to inspect the operative dates, predecessor citations, affected provisions, exceptions, corrections, and contiguous evidence in documents ranging from short notices to 1.3-million-character rules, reading is 48 x 1.5 = 72.0 hours. RECONCILIATION: classifying the change, resolving the immediate prior/new clock, separating affected from unaffected provisions, applying eight exception triggers, and checking the chain at 45 minutes per record is 48 x 0.75 = 36.0 hours. CASEFILE PRODUCTION: writing and checking the structured casefile and master row at 25 minutes per record is 48 x 0.417 = 20.0 hours. SYNTHESIS AND QA: recomputing the exception population and five atlas series, writing the briefing, rendering the SVG, and checking cross-artifact agreement is 12.0 hours. Total 72.0 + 36.0 + 20.0 + 12.0 = 140.0 hours."
reference_link = "https://www.federalregister.gov/developers/api/v1"
reference_links = [
  "https://www.federalregister.gov/developers/api/v1",
  "https://www.federalregister.gov/documents/2026/06/01/2026-10880/poultry-grower-payment-systems-and-capital-improvement-systems-delay-of-effective-date",
  "https://www.federalregister.gov/documents/2025/03/24/2025-04979/privacy-act-implementation-further-delay-of-effective-date"
]
why_multi_agent = "The load-bearing core is 48 independent readings of legally heterogeneous date-change documents, followed by predecessor-chain and cross-portfolio reconciliation. A single serial agent can copy early dates, but sustained attention degrades on the distinction between a whole-rule delay and a named-provision delay, a new effective date and a comment deadline, or a withdrawal and a correction; late casefiles become templated and the exception population is assembled before the source-specific scope has been resolved. The planned hierarchy assigns one source to each of 48 record specialists, then gives each of six portfolio managers eight completed casefiles to reopen against the evidence and directly repair at the graded paths. A cohort editor recomputes the master register, fixed exception population, and cited briefing from those repaired payloads; an atlas editor derives the five visual series only after cohort integrity is locked. The benefit is parallel reading capacity plus two real repair/synthesis tiers, not leaked labels, hidden answers, or a different tool budget. Metadata records the planned managerial shape and must be rewritten from the actual multi trajectory after execution."

