version: "1.0"
coordination_pattern: "hierarchical"

sub_tasks:

  - id: lead--g1
    agent_type: general
    parallel_group: leads
    depends_on: [spec--g1-01, spec--g1-02, spec--g1-03, spec--g1-04]
    description: >-
      Read across the eight completed Indiana Court of Appeals cards in review group 1. Prepare a group rollup that compares Appellate Rule 46 briefing with a Rule 9 notice stop, PCR with a direct criminal appeal, and CHINS or TPR work with dissolution, dispositions, and transfer or remand consequences. Assemble the eight transfer_calendar.csv rows from the calendar key in /environment/input_artifacts/record_format.md, and the matching cause_index.csv lines.

  - id: spec--g1-01
    agent_type: explore
    parallel_group: specialists--g1
    depends_on: []
    description: >-
      Read in full the assigned Indiana Court of Appeals opinions z01 and z02 at /environment/input_artifacts/decisions/<id>.txt. File one hearing card per opinion under /logs/agent/output/cause_drawers/ on the matching cause drawer (criminal, postconviction, family, or civil), named from the printed appellate number, using the six-part card format in /environment/input_artifacts/record_format.md. Identify the appellant, trial court, appellate number, Indiana Code or Appellate Rule issue, decisive trial-record fact, precise disposition, and transfer or remand consequence. Ground each account only in its own opinion and use original prose.

