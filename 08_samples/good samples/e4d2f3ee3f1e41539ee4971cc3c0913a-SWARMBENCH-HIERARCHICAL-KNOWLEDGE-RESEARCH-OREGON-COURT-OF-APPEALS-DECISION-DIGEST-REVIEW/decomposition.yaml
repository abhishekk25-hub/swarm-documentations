version: "1.0"
coordination_pattern: "hierarchical"

sub_tasks:

  - id: lead--g1
    agent_type: general
    parallel_group: leads
    depends_on: [spec--g1-01, spec--g1-02, spec--g1-03, spec--g1-04]
    description: >-
      Read across the eight completed Oregon Court of Appeals cards in review group 1. Prepare a group rollup that compares ORAP 5.45 assignment of error with ORAP 5.05 briefing, PCR with a direct criminal appeal, and juvenile ORS 419B work with ordinary civil or administrative review, dispositions, and petition-for-review or remand consequences. Assemble the eight petition_calendar.csv rows from the calendar key in /environment/input_artifacts/record_format.md, and the matching folio_index.csv lines.

  - id: spec--g1-01
    agent_type: explore
    parallel_group: specialists--g1
    depends_on: []
    description: >-
      Read in full the assigned Oregon Court of Appeals opinions v01 and v02 at /environment/input_artifacts/decisions/<id>.txt. File one hearing card per opinion under /logs/agent/output/department_folios/ on the matching department folio (criminal, civil, family, or administrative), named from the printed appellate number, using the six-part card format in /environment/input_artifacts/record_format.md. Identify the appellant, trial court, appellate number, ORS or ORAP issue, decisive trial-record fact, precise disposition, and petition-for-review or remand consequence. Ground each account only in its own opinion and use original prose.

